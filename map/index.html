<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>PNS Map Editor · S967</title>

  <link
    rel="stylesheet"
    href="/theme.css"
  >

  <script
    src="/theme.js"
    defer
  ></script>

  <script
    src="/language.js"
    defer
  ></script>

  <style>
    #loginTitle {
      margin-bottom: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 36px 20px 80px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--background);
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 10px;

      color: var(--muted);

      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(
        2.2rem,
        7vw,
        4rem
      );

      line-height: 1;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 14px 0 0;

      color: var(--muted);

      font-size: 0.95rem;
      line-height: 1.6;
    }

    .panel {
      margin-top: 28px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--surface);
      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 20px;
    }

    .panel-title {
      margin: 0;

      font-size: 1.15rem;
      font-weight: 750;
    }

    .field {
      margin-top: 18px;
    }

    .field:first-child {
      margin-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;

      font-size: 0.9rem;
      font-weight: 700;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 10px;

      outline: none;

      background: var(--surface-hover);
      color: var(--text);

      font: inherit;
    }

    input:focus {
      border-color: var(--border-hover);
    }

    button {
      padding: 11px 15px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      font: inherit;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--border-hover);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary-button {
      width: 100%;
      margin-top: 22px;
    }

    .share-divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 26px 0 22px;

      color: var(--muted);

      font-size: 0.82rem;
    }

    .share-divider::before,
    .share-divider::after {
      content: "";

      height: 1px;
      flex: 1;

      background: var(--border);
    }

    .share-section {
      text-align: center;
    }

    .share-title {
      margin: 0 0 6px;

      font-size: 1rem;
      font-weight: 750;
    }

    .share-description {
      margin: 0 0 14px;

      color: var(--muted);

      font-size: 0.85rem;
      line-height: 1.5;
    }

    .retention-notice {
      margin: 18px 0 0;

      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.55;
      text-align: center;
    }

    .share-code-input {
      text-align: center;

      font-size: 1.15rem !important;
      font-weight: 750 !important;
      letter-spacing: 0.18em;
    }

    .share-open-button {
      width: 100%;
      margin-top: 10px;
    }

    .secondary-button {
      background: transparent;
    }

    .danger-button {
      color: #d75555;
    }

    .status {
      min-height: 1.4em;
      margin-top: 14px;

      color: var(--muted);

      font-size: 0.88rem;
      line-height: 1.5;
    }

    .error {
      color: #d75555;
    }

    .success {
      color: #3f9565;
    }

    .hidden {
      display: none !important;
    }

    .dialog-message {
      margin: 0;

      color: var(--text);

      font-size: 0.95rem;
      line-height: 1.65;
    }

    .dialog-id {
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .dialog-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 20px;
    }

    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      margin-top: 28px;
      padding: 14px 16px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface);
    }

    .account-name {
      min-width: 0;

      font-size: 0.9rem;
      font-weight: 700;

      overflow-wrap: anywhere;
    }

    .map-count {
      flex: 0 0 auto;

      color: var(--muted);

      font-size: 0.88rem;
      font-weight: 700;
    }

    .map-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-empty {
      padding: 30px 16px;

      border: 1px dashed var(--border);
      border-radius: 12px;

      color: var(--muted);

      text-align: center;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .map-item {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface-hover);
    }

    .map-info {
      min-width: 0;
      flex: 1;
    }

    .map-name {
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-date {
      margin-top: 4px;

      color: var(--muted);

      font-size: 0.78rem;
    }

    .map-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
      flex: 0 0 auto;
    }

    .map-actions button {
      padding: 8px 10px;

      font-size: 0.82rem;
    }

    .map-share-code {
      margin-top: 6px;

      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .map-share-code strong {
      color: var(--text);
      letter-spacing: 0.08em;
    }

    .new-map-button {
      width: 100%;
      margin-top: 14px;
    }

    .back {
      display: inline-block;

      margin-top: 28px;

      color: var(--muted);

      font-size: 0.9rem;
      text-decoration: none;
    }

    .back:hover {
      color: var(--text);
    }

    /*
      Language + Theme
    */

    .top-pickers {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 1100;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .top-pickers
    .language-picker,
    .top-pickers
    .theme-picker {
      position: relative;

      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
    }

    .top-pickers
    .language-menu,
    .top-pickers
    .theme-menu {
      top: auto;
      right: 0;
      bottom: calc(100% + 8px);
    }

    @media (max-width: 560px) {
      body {
        padding:
          28px
          16px
          76px;
      }

      .panel {
        padding: 18px;
      }

      .map-item {
        align-items: stretch;
        flex-direction: column;
      }

      .map-actions {
        display: grid;
        grid-template-columns:
          repeat(2, 1fr);
      }

      .map-actions button {
        width: 100%;
      }

      .top-pickers {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="top-pickers">

    <div
      class="language-picker"
      data-language-picker
    >
      <button
        class="language-button"
        type="button"
        data-language-button
        aria-label="Language"
        aria-haspopup="true"
        aria-expanded="false"
      >
        🌐
      </button>

      <div
        class="language-menu"
        data-language-menu
        role="menu"
      >
        <button
          type="button"
          data-language-choice="ko"
          role="menuitemradio"
        >
          한국어
        </button>

        <button
          type="button"
          data-language-choice="en"
          role="menuitemradio"
        >
          English
        </button>

        <button
          type="button"
          data-language-choice="ja"
          role="menuitemradio"
        >
          日本語
        </button>

        <button
          type="button"
          data-language-choice="ru"
          role="menuitemradio"
        >
          Русский
        </button>
      </div>
    </div>


    <div
      class="theme-picker"
      data-theme-picker
    >
      <button
        class="theme-button"
        type="button"
        data-theme-button
        aria-label="Theme"
        aria-haspopup="true"
        aria-expanded="false"
      >
        ◐
      </button>

      <div
        class="theme-menu"
        data-theme-menu
        role="menu"
      >
        <button
          type="button"
          data-theme-choice="system"
          role="menuitemradio"
        >
          <span class="theme-choice-icon">
            ◐
          </span>

          <span data-i18n="themeSystem">
            System
          </span>
        </button>

        <button
          type="button"
          data-theme-choice="light"
          role="menuitemradio"
        >
          <span class="theme-choice-icon">
            ☀
          </span>

          <span data-i18n="themeLight">
            Light
          </span>
        </button>

        <button
          type="button"
          data-theme-choice="dark"
          role="menuitemradio"
        >
          <span class="theme-choice-icon">
            ☾
          </span>

          <span data-i18n="themeDark">
            Dark
          </span>
        </button>
      </div>
    </div>

  </div>


  <main>

    <div class="eyebrow">
      S967
    </div>

    <h1>
      PNS Map Editor
    </h1>

    <p
      id="pageIntro"
      class="intro"
    ></p>


    <!-- LOGIN -->

    <section
      id="loginPanel"
      class="panel"
    >
      <h2
        id="loginTitle"
        class="panel-title"
      >
        Login
      </h2>

      <form id="loginForm">

        <div class="field">
          <label
            id="loginIdLabel"
            class="label"
            for="loginId"
          >
            ID
          </label>

          <input
            id="loginId"
            type="text"
            maxlength="40"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label
            id="loginPasswordLabel"
            class="label"
            for="loginPassword"
          >
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            maxlength="100"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="loginButton"
          class="primary-button"
          type="submit"
        >
          Login
        </button>

        <div
          id="loginStatus"
          class="status"
        ></div>

      </form>

      <div
        class="share-divider"
        id="shareDivider"
      >
        OR
      </div>

      <div class="share-section">

        <h3
          id="shareTitle"
          class="share-title"
        >
          View Shared Map
        </h3>

        <p
          id="shareDescription"
          class="share-description"
        >
          Enter the 6-digit share code.
        </p>

        <input
          id="shareCode"
          class="share-code-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          placeholder="000000"
          aria-label="Share Code"
        >

        <button
          id="shareOpenButton"
          class="share-open-button"
          type="button"
        >
          Open
        </button>

        <div
          id="shareStatus"
          class="status"
        ></div>

        <p
          id="retentionNotice"
          class="retention-notice"
        >
          Saved and shared maps are stored for up to 6 months.
        </p>

      </div>
    </section>


    <!-- UNKNOWN ACCOUNT -->

    <section
      id="unknownAccountPanel"
      class="panel hidden"
    >
      <p
        id="unknownAccountMessage"
        class="dialog-message"
      ></p>

      <div class="dialog-buttons">

        <button
          id="unknownCancelButton"
          class="secondary-button"
          type="button"
        >
          Cancel
        </button>

        <button
          id="createAccountStartButton"
          type="button"
        >
          Create Account
        </button>

      </div>
    </section>


    <!-- CREATE ACCOUNT -->

    <section
      id="createAccountPanel"
      class="panel hidden"
    >
      <h2
        id="createAccountTitle"
        class="panel-title"
      >
        Create Account
      </h2>

      <p
        id="createAccountId"
        class="dialog-message"
      ></p>

      <form id="createAccountForm">

        <div class="field">
          <label
            id="createPasswordLabel"
            class="label"
            for="createPassword"
          >
            Password
          </label>

          <input
            id="createPassword"
            type="password"
            maxlength="100"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="field">
          <label
            id="confirmPasswordLabel"
            class="label"
            for="confirmPassword"
          >
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            maxlength="100"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="dialog-buttons">

          <button
            id="createCancelButton"
            class="secondary-button"
            type="button"
          >
            Cancel
          </button>

          <button
            id="createAccountButton"
            type="submit"
          >
            Create Account
          </button>

        </div>

        <div
          id="createStatus"
          class="status"
        ></div>

      </form>
    </section>


    <!-- ACCOUNT / MAP LIST -->

    <div
      id="accountArea"
      class="hidden"
    >

      <div class="account-bar">

        <div
          id="signedInUser"
          class="account-name"
        ></div>

        <button
          id="logoutButton"
          class="secondary-button"
          type="button"
        >
          Log out
        </button>

      </div>


      <section class="panel">

        <div class="panel-header">

          <h2
            id="myMapsTitle"
            class="panel-title"
          >
            My Maps
          </h2>

          <div
            id="mapCount"
            class="map-count"
          >
            0 / 5
          </div>

        </div>


        <div
          id="mapList"
          class="map-list"
        ></div>


        <button
          id="newMapButton"
          class="new-map-button"
          type="button"
        >
          + New Map
        </button>

        <div
          id="mapStatus"
          class="status"
        ></div>

      </section>

    </div>


    <a
      id="backLink"
      class="back"
      href="/"
    >
      ← Back to Home
    </a>

  </main>

    function getSessionToken() {
      return (
        sessionStorage.getItem(
          SESSION_TOKEN_KEY
        ) ?? ""
      );
    }


    function saveSession(
      session
    ) {
      if (
        !session?.token
      ) {
        return;
      }

      sessionStorage.setItem(
        SESSION_TOKEN_KEY,
        session.token
      );

      if (
        session.expiresAt
      ) {
        sessionStorage.setItem(
          SESSION_EXPIRES_KEY,
          session.expiresAt
        );
      }
    }


    function clearSession() {
      sessionStorage.removeItem(
        SESSION_TOKEN_KEY
      );

      sessionStorage.removeItem(
        SESSION_EXPIRES_KEY
      );
    }


    function authorizationHeaders() {
      const token =
        getSessionToken();

      return {
        Authorization:
          `Bearer ${token}`,
      };
    }


    function isSessionError(
      response,
      result
    ) {
      return (
        response.status === 401 ||
        result?.error ===
          "INVALID_SESSION" ||
        result?.error ===
          "SESSION_EXPIRED" ||
        result?.error ===
          "UNAUTHORIZED"
      );
    }


    function expireLogin() {
      clearSession();

      currentUser = null;
      pendingId = "";
      maps = [];
      shareStates.clear();

      loginForm.reset();
      createAccountForm.reset();

      showLogin();

      setStatus(
        loginStatus,
        text.sessionExpired,
        "error"
      );
    }

    function formatDate(
      timestamp
    ) {
      if (!timestamp) {
        return "";
      }

      const localeMap = {
        ko: "ko-KR",
        en: "en-US",
        ja: "ja-JP",
        ru: "ru-RU",
      };

      return new Intl.DateTimeFormat(
        localeMap[language] ??
          "en-US",
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }
      ).format(
        new Date(
          timestamp
        )
      );
    }


    async function loadMaps() {
      const token =
        getSessionToken();

      if (!token) {
        return false;
      }

      try {
        const response =
          await fetch(
            MAP_LIST_URL,
            {
              method: "GET",

              headers:
                authorizationHeaders(),
            }
          );

        const result =
          await response
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            response,
            result
          )
        ) {
          expireLogin();
          return false;
        }

        if (
          !response.ok ||
          !result.ok
        ) {
          throw new Error(
            text.mapsLoadFailed
          );
        }

        currentUser = {
          id:
            result.user?.username ??
            currentUser?.id ??
            "",
        };

        maps =
          Array.isArray(
            result.maps
          )
            ? result.maps
            : [];

        showAccount();

        await loadShareStates();

        return true;

      } catch (error) {
        setStatus(
          mapStatus,
          error?.message ||
            text.mapsLoadFailed,
          "error"
        );

        return false;
      }
    }


    /*
      ==========================================================
      SHARE STATUS / OWNER SHARING
      ==========================================================
    */

    async function getShareStatus(
      mapId
    ) {
      const response =
        await fetch(
          MAP_SHARE_STATUS_URL,
          {
            method: "POST",

            headers: {
              ...authorizationHeaders(),

              "Content-Type":
                "application/json",
            },

            body:
              JSON.stringify({
                map_id: mapId,
              }),
          }
        );

      const result =
        await response
          .json()
          .catch(
            () => ({})
          );

      if (
        isSessionError(
          response,
          result
        )
      ) {
        expireLogin();

        throw new Error(
          text.sessionExpired
        );
      }

      if (
        !response.ok ||
        !result.ok
      ) {
        throw new Error(
          text.shareFailed
        );
      }

      return {
        sharing:
          Boolean(
            result.sharing
          ),

        shareCode:
          result.shareCode ??
          null,

        sharedAt:
          result.sharedAt ??
          null,

        updatedAt:
          result.updatedAt ??
          null,
      };
    }


    async function loadShareStates() {
      shareStates.clear();

      renderMaps();

      await Promise.all(
        maps.map(
          async (map) => {
            try {
              const state =
                await getShareStatus(
                  map.id
                );

              shareStates.set(
                map.id,
                state
              );
            } catch (error) {
              console.error(
                "Share status failed:",
                map.id,
                error
              );
            }
          }
        )
      );

      renderMaps();
    }


    async function enableOrUpdateShare(
      mapId
    ) {
      const existing =
        shareStates.get(
          mapId
        );

      setStatus(
        mapStatus,
        existing?.sharing
          ? text.shareUpdating
          : text.shareCreating
      );

      try {
        const response =
          await fetch(
            MAP_SHARE_ENABLE_URL,
            {
              method: "POST",

              headers: {
                ...authorizationHeaders(),

                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({
                  map_id:
                    mapId,
                }),
            }
          );

        const result =
          await response
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            response,
            result
          )
        ) {
          expireLogin();
          return;
        }

        if (
          !response.ok ||
          !result.ok ||
          !result.shareCode
        ) {
          throw new Error(
            text.shareFailed
          );
        }

        shareStates.set(
          mapId,
          {
            sharing:
              true,

            shareCode:
              result.shareCode,

            sharedAt:
              existing?.sharedAt ??
              new Date()
                .toISOString(),

            updatedAt:
              new Date()
                .toISOString(),
          }
        );

        setStatus(
          mapStatus,
          `${text.shareCode}: ${result.shareCode}`,
          "success"
        );

        renderMaps();

      } catch (error) {
        setStatus(
          mapStatus,
          error?.message ||
            text.shareFailed,
          "error"
        );
      }
    }


    async function disableShare(
      mapId
    ) {
      if (
        !window.confirm(
          text.shareStopConfirm
        )
      ) {
        return;
      }

      setStatus(
        mapStatus,
        text.shareStopping
      );

      try {
        const response =
          await fetch(
            MAP_SHARE_DISABLE_URL,
            {
              method: "POST",

              headers: {
                ...authorizationHeaders(),

                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({
                  map_id:
                    mapId,
                }),
            }
          );

        const result =
          await response
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            response,
            result
          )
        ) {
          expireLogin();
          return;
        }

        if (
          !response.ok ||
          !result.ok
        ) {
          throw new Error(
            text.shareStopFailed
          );
        }

        shareStates.set(
          mapId,
          {
            sharing:
              false,

            shareCode:
              null,

            sharedAt:
              null,

            updatedAt:
              null,
          }
        );

        setStatus(
          mapStatus,
          "",
          ""
        );

        renderMaps();

      } catch (error) {
        setStatus(
          mapStatus,
          error?.message ||
            text.shareStopFailed,
          "error"
        );
      }
    }


    /*
      ==========================================================
      PUBLIC SHARED MAP
      ==========================================================
    */

    shareCode.addEventListener(
      "input",
      () => {
        shareCode.value =
          shareCode.value
            .replace(
              /\D/g,
              ""
            )
            .slice(
              0,
              6
            );

        setStatus(
          shareStatus,
          ""
        );
      }
    );


    shareOpenButton.addEventListener(
      "click",
      async () => {
        const code =
          shareCode.value.trim();

        if (
          !/^\d{6}$/.test(
            code
          )
        ) {
          setStatus(
            shareStatus,
            text.shareInvalid,
            "error"
          );

          shareCode.focus();

          return;
        }

        shareOpenButton.disabled =
          true;

        setStatus(
          shareStatus,
          text.shareLoading
        );

        try {
          const response =
            await fetch(
              MAP_SHARE_LOAD_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify({
                    share_code:
                      code,
                  }),
              }
            );

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );

          if (
            response.status === 404 ||
            result.error ===
              "SHARED_MAP_NOT_FOUND" ||
            result.error ===
              "shared_map_not_found"
          ) {
            throw new Error(
              text.shareNotFound
            );
          }

          if (
            !response.ok ||
            !result.ok ||
            !result.map
          ) {
            throw new Error(
              text.shareLoadFailed
            );
          }

          sessionStorage.setItem(
            "s967_shared_map",
            JSON.stringify({
              map:
                result.map,

              readOnly:
                result.readOnly ??
                true,
            })
          );

          window.location.href =
            "/map/editor/?shared=1";

        } catch (error) {
          setStatus(
            shareStatus,
            error?.message ||
              text.shareLoadFailed,
            "error"
          );

          shareOpenButton.disabled =
            false;
        }
      }
    );


    /*
      ==========================================================
      LOGIN
      ==========================================================
    */

    loginForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        setStatus(
          loginStatus,
          ""
        );

        const id =
          loginId.value.trim();

        const password =
          loginPassword.value;

        if (
          !id ||
          !password
        ) {
          return;
        }

        loginButton.disabled =
          true;

        loginButton.textContent =
          text.loggingIn;

        try {
          const response =
            await fetch(
              MAP_LOGIN_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify({
                    username:
                      id,

                    password,
                  }),
              }
            );

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          if (
            response.status === 404 &&
            result.error ===
              "USER_NOT_FOUND"
          ) {
            pendingId =
              id;

            showUnknownAccount();

            return;
          }


          if (
            result.error ===
              "INVALID_PASSWORD"
          ) {
            throw new Error(
              text.invalidPassword
            );
          }


          if (
            result.error ===
              "INVALID_USERNAME"
          ) {
            throw new Error(
              text.invalidId
            );
          }


          if (
            !response.ok ||
            !result.ok ||
            !result.session?.token
          ) {
            throw new Error(
              text.loginFailed
            );
          }


          saveSession(
            result.session
          );

          currentUser = {
            id:
              result.user
                ?.username ??
              id,
          };

          maps =
            Array.isArray(
              result.maps
            )
              ? result.maps
              : [];

          pendingId = "";

          loginPassword.value =
            "";

          showAccount();

          await loadShareStates();

        } catch (error) {
          setStatus(
            loginStatus,
            error?.message ||
              text.loginFailed,
            "error"
          );

        } finally {
          loginButton.disabled =
            false;

          loginButton.textContent =
            text.loginButton;
        }
      }
    );


    /*
      ==========================================================
      CREATE ACCOUNT
      ==========================================================
    */

    unknownCancelButton.addEventListener(
      "click",
      () => {
        pendingId = "";

        loginPassword.value =
          "";

        showLogin();

        loginId.focus();
      }
    );


    createAccountStartButton.addEventListener(
      "click",
      () => {
        showCreateAccount();
      }
    );


    createCancelButton.addEventListener(
      "click",
      () => {
        createPassword.value =
          "";

        confirmPassword.value =
          "";

        showUnknownAccount();
      }
    );


    createAccountForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        setStatus(
          createStatus,
          ""
        );


        if (
          createPassword.value !==
          confirmPassword.value
        ) {
          setStatus(
            createStatus,
            text.passwordMismatch,
            "error"
          );

          confirmPassword.focus();

          return;
        }


        if (
          createPassword.value.length < 8 ||
          createPassword.value.length > 100
        ) {
          setStatus(
            createStatus,
            text.invalidNewPassword,
            "error"
          );

          createPassword.focus();

          return;
        }


        createAccountButton.disabled =
          true;

        createAccountButton.textContent =
          text.creatingAccount;


        try {
          const response =
            await fetch(
              MAP_REGISTER_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify({
                    username:
                      pendingId,

                    password:
                      createPassword.value,
                  }),
              }
            );

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          if (
            result.error ===
              "USERNAME_ALREADY_EXISTS"
          ) {
            throw new Error(
              text.usernameExists
            );
          }


          if (
            result.error ===
              "INVALID_USERNAME"
          ) {
            throw new Error(
              text.invalidId
            );
          }


          if (
            result.error ===
              "INVALID_PASSWORD"
          ) {
            throw new Error(
              text.invalidNewPassword
            );
          }


          if (
            !response.ok ||
            !result.ok ||
            !result.session?.token
          ) {
            throw new Error(
              text.accountCreateFailed
            );
          }


          saveSession(
            result.session
          );

          currentUser = {
            id:
              result.user
                ?.username ??
              pendingId,
          };

          maps =
            Array.isArray(
              result.maps
            )
              ? result.maps
              : [];

          pendingId = "";

          loginPassword.value =
            "";

          createPassword.value =
            "";

          confirmPassword.value =
            "";

          showAccount();

          await loadShareStates();

        } catch (error) {
          setStatus(
            createStatus,
            error?.message ||
              text.accountCreateFailed,
            "error"
          );

        } finally {
          createAccountButton.disabled =
            false;

          createAccountButton.textContent =
            text.createAccount;
        }
      }
    );


    /*
      ==========================================================
      LOGOUT
      ==========================================================
    */

    logoutButton.addEventListener(
      "click",
      () => {
        clearSession();

        currentUser = null;
        pendingId = "";
        maps = [];
        shareStates.clear();

        loginForm.reset();
        createAccountForm.reset();

        setStatus(
          loginStatus,
          ""
        );

        setStatus(
          mapStatus,
          ""
        );

        showLogin();
      }
    );


    /*
      ==========================================================
      MAP ACTIONS
      ==========================================================
    */

    newMapButton.addEventListener(
      "click",
      () => {
        if (
          maps.length >=
          MAX_MAPS
        ) {
          return;
        }

        window.location.href =
          "/map/editor/?new=1";
      }
    );


    function openMap(
      mapId
    ) {
      window.location.href =
        `/map/editor/?map=${encodeURIComponent(mapId)}`;
    }


    async function renameMap(
      mapId
    ) {
      const map =
        maps.find(
          (item) =>
            item.id === mapId
        );

      if (!map) {
        return;
      }

      const newName =
        window.prompt(
          text.rename,
          map.name
        );

      if (
        newName === null
      ) {
        return;
      }

      const trimmed =
        newName.trim();

      if (
        !trimmed ||
        trimmed === map.name
      ) {
        return;
      }

      try {
        /*
          map-save가 문서 데이터도 요구하므로
          먼저 본문을 불러온 뒤 같은 데이터로
          이름만 변경해 저장한다.
        */

        const loadResponse =
          await fetch(
            `${MAP_LOAD_URL}?mapId=${encodeURIComponent(mapId)}`,
            {
              method: "GET",

              headers:
                authorizationHeaders(),
            }
          );

        const loadResult =
          await loadResponse
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            loadResponse,
            loadResult
          )
        ) {
          expireLogin();
          return;
        }

        if (
          !loadResponse.ok ||
          !loadResult.ok ||
          !loadResult.map
        ) {
          throw new Error(
            text.mapRenameFailed
          );
        }


        const saveResponse =
          await fetch(
            MAP_SAVE_URL,
            {
              method: "POST",

              headers: {
                ...authorizationHeaders(),

                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({
                  mapId:
                    mapId,

                  name:
                    trimmed,

                  documentData:
                    loadResult.map
                      .documentData,
                }),
            }
          );

        const saveResult =
          await saveResponse
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            saveResponse,
            saveResult
          )
        ) {
          expireLogin();
          return;
        }

        if (
          !saveResponse.ok ||
          !saveResult.ok
        ) {
          throw new Error(
            text.mapRenameFailed
          );
        }

        await loadMaps();

      } catch (error) {
        setStatus(
          mapStatus,
          error?.message ||
            text.mapRenameFailed,
          "error"
        );
      }
    }


    async function deleteMap(
      mapId
    ) {
      if (
        !window.confirm(
          text.deleteConfirm
        )
      ) {
        return;
      }

      try {
        const response =
          await fetch(
            MAP_DELETE_URL,
            {
              method: "POST",

              headers: {
                ...authorizationHeaders(),

                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({
                  map_id:
                    mapId,
                }),
            }
          );

        const result =
          await response
            .json()
            .catch(
              () => ({})
            );

        if (
          isSessionError(
            response,
            result
          )
        ) {
          expireLogin();
          return;
        }

        if (!response.ok) {
          throw new Error(
            text.mapDeleteFailed
          );
        }

        shareStates.delete(
          mapId
        );

        await loadMaps();

      } catch (error) {
        setStatus(
          mapStatus,
          error?.message ||
            text.mapDeleteFailed,
          "error"
        );
      }
    }


    /*
      ==========================================================
      LANGUAGE CHANGE
      ==========================================================
    */

    window.addEventListener(
      "s967languagechange",
      (event) => {
        language =
          event.detail?.language ??
          (
            typeof getCurrentLanguage ===
              "function"
              ? getCurrentLanguage()
              : "en"
          );

        text =
          TEXT[language] ??
          TEXT.en;

        setStaticText();
      }
    );


    /*
      ==========================================================
      INITIALIZE
      ==========================================================
    */

    async function initialize() {
      setStaticText();

      const token =
        getSessionToken();

      if (!token) {
        showLogin();
        return;
      }

      const expires =
        sessionStorage.getItem(
          SESSION_EXPIRES_KEY
        );

      if (
        expires &&
        new Date(
          expires
        ).getTime() <=
          Date.now()
      ) {
        clearSession();
        showLogin();
        return;
      }

      /*
        같은 탭에서 새로고침한 경우
        저장된 세션으로 계정/맵 목록 복구.
      */

      showAccount();

      const restored =
        await loadMaps();

      if (!restored) {
        if (!getSessionToken()) {
          showLogin();
        }
      }
    }


    initialize();
  </script>

</body>
</html>
