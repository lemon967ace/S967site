<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>PNS Map Editor · S967</title>

  <link
    rel="stylesheet"
    href="/theme.css"
  >

  <script
    src="/theme.js"
    defer
  ></script>

  <script
    src="/language.js"
    defer
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    body {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;

      display: flex;
      flex-direction: column;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--background);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--border-hover);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    /*
      ==========================================================
      APP HEADER
      ==========================================================
    */

    .editor-header {
      position: relative;
      z-index: 100;
      flex: 0 0 auto;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto;
      gap: 12px;
      align-items: center;

      padding:
        clamp(6px, 0.85vh, 10px)
        clamp(10px, 1.25vw, 16px);

      border-bottom:
        1px solid var(--border);

      background: var(--surface);
    }

    .editor-title-area {
      min-width: 0;
    }

    .editor-eyebrow {
      margin-bottom: clamp(1px, 0.18vh, 3px);

      color: var(--muted);

      font-size: clamp(0.62rem, 0.72vw, 0.72rem);
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .editor-title-row {
      display: flex;
      align-items: center;
      gap: 8px;

      min-width: 0;
    }

    .editor-title-input {
      width: min(380px, 100%);
      min-width: 0;

      padding:
        clamp(4px, 0.55vh, 7px)
        clamp(7px, 0.75vw, 9px);

      border: 1px solid transparent;
      border-radius: 8px;

      outline: none;

      background: transparent;
      color: var(--text);

      font-size: clamp(0.88rem, 1.05vw, 1rem);
      font-weight: 750;
    }

    .editor-title-input:hover,
    .editor-title-input:focus {
      border-color: var(--border);
      background: var(--surface-hover);
    }

    .mode-badge {
      flex: 0 0 auto;

      padding: 4px 7px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--muted);

      font-size: 0.72rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .header-actions button,
    .header-actions a {
      min-height: clamp(32px, 4.4vh, 38px);
      padding:
        clamp(5px, 0.7vh, 8px)
        clamp(8px, 0.9vw, 11px);

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .header-actions a:hover {
      border-color: var(--border-hover);
    }

    /*
      ==========================================================
      TOOLBAR
      ==========================================================
    */

    .editor-toolbar {
      position: relative;
      z-index: 90;
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      gap: 7px;

      min-height: clamp(40px, 5.2vh, 48px);
      padding:
        clamp(5px, 0.65vh, 7px)
        clamp(8px, 0.95vw, 12px);

      overflow-x: auto;

      border-bottom:
        1px solid var(--border);

      background: var(--surface);
    }

    .tool-button {
      flex: 0 0 auto;

      min-height: 34px;
      padding: 7px 10px;

      font-size: 0.8rem;
    }

    .tool-separator {
      width: 1px;
      height: 26px;
      flex: 0 0 auto;

      margin: 0 2px;

      background: var(--border);
    }

    /*
      ==========================================================
      MAIN EDITOR LAYOUT
      ==========================================================
    */

    .editor-shell {
      position: relative;

      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-columns:
        minmax(190px, 17vw)
        minmax(0, 1fr)
        minmax(210px, 18vw);

      overflow: hidden;
      padding-bottom: clamp(6px, 1vh, 12px);
      background: var(--background);
    }

    .editor-sidebar {
      position: relative;
      z-index: 20;

      min-width: 0;
      min-height: 0;
      padding:
        clamp(8px, 1.1vh, 14px)
        clamp(8px, 0.9vw, 14px);

      background: var(--surface);
    }

    .editor-sidebar-left {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: clamp(8px, 1vh, 12px);

      border-right:
        1px solid var(--border);
    }

    .editor-sidebar-right {
      overflow-y: auto;

      border-left:
        1px solid var(--border);
    }

    .sidebar-scroll {
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .sidebar-section {
      margin-top: clamp(12px, 1.6vh, 18px);
    }

    .sidebar-section:first-child {
      margin-top: 0;
    }

    .sidebar-title {
      margin: 0 0 clamp(6px, 0.9vh, 9px);

      color: var(--muted);

      font-size: clamp(0.68rem, 0.72vw, 0.74rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }


    .selection-details {
      display: grid;
      gap: 8px;
    }

    .selection-name {
      color: var(--text);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .selection-row {
      display: grid;
      grid-template-columns: minmax(72px, auto) minmax(0, 1fr);
      gap: 8px;
    }

    .selection-key {
      color: var(--muted);
      font-weight: 700;
    }

    .selection-value {
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .editor-stage {
      position: relative;

      min-width: 0;
      min-height: 0;

      overflow: hidden;

      background: var(--background);
    }

    #mapCanvasHost {
      position: absolute;
      inset: 0;

      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .pns-map-canvas {
      position: absolute;
      inset: 0;
      touch-action: none;
      outline: none;
    }

    .minimap-panel {
      position: relative;
      width: 100%;
      min-width: 0;
      padding: 8px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface-hover);
    }

    .minimap-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-bottom: 6px;

      font-size: 0.78rem;
      font-weight: 800;
    }

    .minimap-host {
      position: relative;
      width: 100%;
      aspect-ratio: 1.45;

      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 8px;

      touch-action: none;
    }

    .minimap-host canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .minimap-viewport-canvas {
      cursor: crosshair;
      touch-action: none;
    }

    .minimap-panel.collapsed .minimap-host {
      display: none;
    }

    .minimap-panel.collapsed .minimap-header {
      margin: 0;
    }

    .zoom-readout {
      flex: 0 0 auto;
      min-width: 54px;
      padding: 6px 8px;

      border: 1px solid var(--border);
      border-radius: 9px;

      color: var(--muted);

      text-align: center;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }


    .zoom-input-wrap {display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;padding:0 7px;min-height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover);color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;}
    .zoom-input {width:52px;min-width:0;padding:4px 2px;border:0;outline:none;background:transparent;color:var(--text);text-align:right;font:inherit;font-variant-numeric:tabular-nums;}
    .shared-map-title,.shared-filter-panel,.shared-zoom-panel{display:none;}
    body.shared-view .editor-header,body.shared-view .editor-toolbar,body.shared-view .editor-statusbar,body.shared-view .editor-sidebar{display:none!important;}
    body.shared-view .editor-shell{position:fixed;inset:0;display:block;padding:0;overflow:hidden;}
    body.shared-view .editor-stage{position:absolute;inset:0;width:100%;height:100%;}
    body.shared-view .shared-map-title{position:absolute;top:clamp(12px,2vh,22px);left:clamp(12px,1.6vw,24px);z-index:55;display:block;max-width:min(62vw,680px);padding:8px 11px;border:1px solid color-mix(in srgb,var(--border) 38%,transparent);border-radius:10px;background:color-mix(in srgb,var(--surface) 24%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:var(--text);font-size:clamp(.95rem,1.35vw,1.25rem);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
    body.shared-view .shared-filter-panel{position:fixed;left:clamp(12px,1.6vw,24px);bottom:44px;z-index:55;display:block;width:clamp(210px,20vw,300px);max-height:min(46vh,430px);overflow:auto;padding:10px;border:1px solid color-mix(in srgb,var(--border) 38%,transparent);border-radius:12px;background:color-mix(in srgb,var(--surface) 26%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
    body.shared-view .shared-filter-panel h2{margin:0 0 8px;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
    body.shared-view .shared-filter-panel h3{margin:0 0 8px;font-size:.82rem;}
    body.shared-view .shared-zoom-panel{position:fixed;right:calc(clamp(12px,1.6vw,24px) + 94px);bottom:44px;z-index:55;display:flex;align-items:center;gap:6px;padding:6px;border:1px solid color-mix(in srgb,var(--border) 38%,transparent);border-radius:12px;background:color-mix(in srgb,var(--surface) 30%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
    body.shared-view .shared-zoom-panel button{min-width:34px;min-height:34px;padding:6px 9px;}
    @media(max-width:620px){body.shared-view .shared-filter-panel{width:min(240px,calc(100vw - 24px));max-height:38vh;}body.shared-view .shared-map-title{max-width:calc(100vw - 24px);}}

    /*
      ==========================================================
      STATUS BAR
      ==========================================================
    */

    .editor-statusbar {
      position: relative;
      z-index: 80;
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      min-height: 34px;
      padding: 6px 12px;

      border-top:
        1px solid var(--border);

      background: var(--surface);
      color: var(--muted);

      font-size: 0.76rem;
    }

    .status-left,
    .status-right {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-item {
      white-space: nowrap;
    }

    /*
      ==========================================================
      LOADING / ERROR OVERLAY
      ==========================================================
    */

    .editor-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        color-mix(
          in srgb,
          var(--background) 84%,
          transparent
        );
    }

    .overlay-card {
      width: min(420px, 100%);
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--surface);
      box-shadow: var(--shadow);

      text-align: center;
    }

    .overlay-title {
      margin: 0;

      font-size: 1.05rem;
      font-weight: 800;
    }

    .overlay-message {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 0.88rem;
      line-height: 1.6;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 8px;

      margin-top: 18px;
    }

    .overlay-actions a,
    .overlay-actions button {
      padding: 9px 12px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
    }

    /*
      ==========================================================
      LANGUAGE + THEME
      ==========================================================
    */

    .top-pickers {
      position: fixed;

      right: 14px;
      bottom: 44px;

      z-index: 1500;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .top-pickers
    .language-picker,
    .top-pickers
    .theme-picker {
      position: relative;

      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
    }

    .top-pickers
    .language-menu,
    .top-pickers
    .theme-menu {
      top: auto;
      right: 0;
      bottom: calc(100% + 8px);
    }

    /*
      ==========================================================
      RESPONSIVE
      ==========================================================
    */

    @media (max-width: 1100px) {
      .editor-shell {
        grid-template-columns:
          minmax(170px, 20vw)
          minmax(0, 1fr)
          minmax(190px, 22vw);
      }
    }

    @media (max-width: 820px) {
      .editor-header {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .editor-eyebrow {
        display: none;
      }

      .header-actions {
        overflow-x: auto;
      }

      .editor-shell {
        grid-template-columns:
          minmax(150px, 28vw)
          minmax(0, 1fr);
      }

      .editor-sidebar-right {
        display: none;
      }

      .editor-title-input {
        width: 100%;
      }

      .status-right {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .editor-header {
        grid-template-columns: 1fr;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .editor-shell {
        grid-template-columns: 1fr;
      }

      .editor-sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!--
    ============================================================
    HEADER
    ============================================================
  -->

  <header class="editor-header">

    <div class="editor-title-area">

      <div class="editor-eyebrow">
        S967 · PNS MAP EDITOR
      </div>

      <div class="editor-title-row">

        <input
          id="mapTitleInput"
          class="editor-title-input"
          type="text"
          maxlength="100"
          value=""
          aria-label="Map name"
        >

        <span
          id="modeBadge"
          class="mode-badge"
        ></span>

      </div>

    </div>


    <div class="header-actions">

      <button
        id="saveButton"
        type="button"
        disabled
      >
        Save
      </button>

      <span class="tool-separator" aria-hidden="true"></span>
      <button id="openMapFileButton" type="button" disabled>Open file</button>
      <button id="exportMapFileButton" type="button" disabled>Export to file</button>
      <input id="openMapFileInput" type="file" accept=".isomap" hidden>

      <a
        id="mapListLink"
        href="/map/"
      >
        My Maps
      </a>

    </div>

  </header>


  <!--
    ============================================================
    TOOLBAR
    ============================================================
  -->

  <div
    id="editorToolbar"
    class="editor-toolbar"
  >

    <button
      id="selectToolButton"
      class="tool-button"
      type="button"
      disabled
    >
      Select
    </button>

    <button
      id="moveToolButton"
      class="tool-button"
      type="button"
      disabled
    >
      Move
    </button>

    <button
      id="bulkDeleteToolButton"
      class="tool-button"
      type="button"
      disabled
    >
      Delete area
    </button>

    <button
      id="rangeEraseToolButton"
      class="tool-button"
      type="button"
      disabled
    >
      Erase range area
    </button>

    <div class="tool-separator"></div>

    <button
      id="undoButton"
      class="tool-button"
      type="button"
      disabled
    >
      Undo
    </button>

    <button
      id="redoButton"
      class="tool-button"
      type="button"
      disabled
    >
      Redo
    </button>

    <div class="tool-separator"></div>

    <button
      id="zoomOutButton"
      class="tool-button"
      type="button"
      disabled
      aria-label="Zoom out"
    >
      −
    </button>

    <label class="zoom-input-wrap" aria-label="Zoom percentage">
      <input id="zoomPercentInput" class="zoom-input" type="number" min="1" max="400" step="1" value="100" inputmode="numeric">
      <span>%</span>
    </label>

    <button
      id="zoomInButton"
      class="tool-button"
      type="button"
      disabled
      aria-label="Zoom in"
    >
      +
    </button>

    <button
      id="fitMapButton"
      class="tool-button"
      type="button"
      disabled
    >
      Fit
    </button>

  </div>


  <!--
    ============================================================
    EDITOR
    ============================================================
  -->

  <div class="editor-shell">

    <aside
      id="editorSidebar"
      class="editor-sidebar editor-sidebar-left"
    >
      <div class="sidebar-scroll">

        <section class="sidebar-section">

          <h2
            id="buildingTypesTitle"
            class="sidebar-title"
          >
            Building Types
          </h2>

          <div id="buildingTypesHost"></div>

        </section>

      </div>

      <section
        id="minimapPanel"
        class="minimap-panel"
        aria-label="Minimap"
        hidden
      >
        <div class="minimap-header">
          <span id="minimapTitle">Minimap</span>
          <button
            id="minimapToggle"
            type="button"
            aria-expanded="true"
          >
            Collapse
          </button>
        </div>

        <div
          id="minimapHost"
          class="minimap-host"
        ></div>
      </section>

    </aside>


    <main class="editor-stage">

      <div id="mapCanvasHost"></div>

      <div id="sharedMapTitle" class="shared-map-title"></div>
      <section id="sharedFilterPanel" class="shared-filter-panel" aria-label="Building filters">
        <h2 id="sharedFiltersTitle">Building filters</h2>
        <div id="sharedFiltersHost"></div>
      </section>
      <div id="sharedZoomPanel" class="shared-zoom-panel" aria-label="Map zoom">
        <button id="sharedZoomOutButton" type="button" aria-label="Zoom out">−</button>
        <label class="zoom-input-wrap" aria-label="Zoom percentage">
          <input id="sharedZoomPercentInput" class="zoom-input" type="number" min="1" max="400" step="1" value="100" inputmode="numeric">
          <span>%</span>
        </label>
        <button id="sharedZoomInButton" type="button" aria-label="Zoom in">+</button>
        <button id="sharedFitMapButton" type="button">Fit</button>
      </div>

    </main>


    <aside
      id="editorInspector"
      class="editor-sidebar editor-sidebar-right"
    >

      <section class="sidebar-section">

        <h2
          id="selectionTitle"
          class="sidebar-title"
        >
          Selection
        </h2>

        <div id="selectionHost"></div>

      </section>


      <section class="sidebar-section">

        <h2
          id="filtersTitle"
          class="sidebar-title"
        >
          Filters
        </h2>

        <div id="filtersHost"></div>

      </section>

    </aside>

  </div>


  <!--
    ============================================================
    STATUS BAR
    ============================================================
  -->

  <footer class="editor-statusbar">

    <div class="status-left">

      <span
        id="documentStatus"
        class="status-item"
      >
      </span>

      <span
        id="cursorStatus"
        class="status-item"
      >
        X: — · Y: —
      </span>

    </div>

    <div class="status-right">

      <span
        id="zoomStatus"
        class="status-item"
      >
        100%
      </span>

    </div>

  </footer>


  <!--
    ============================================================
    LANGUAGE + THEME
    ============================================================
  -->

  <div class="top-pickers">

    <div
      class="language-picker"
      data-language-picker
    >
      <button
        class="language-button"
        type="button"
        data-language-button
        aria-label="Language"
        aria-haspopup="true"
        aria-expanded="false"
      >
        🌐
      </button>

      <div
        class="language-menu"
        data-language-menu
        role="menu"
      >
        <button
          type="button"
          data-language-choice="ko"
          role="menuitemradio"
        >
          한국어
        </button>

        <button
          type="button"
          data-language-choice="en"
          role="menuitemradio"
        >
          English
        </button>

        <button
          type="button"
          data-language-choice="ja"
          role="menuitemradio"
        >
          日本語
        </button>

        <button
          type="button"
          data-language-choice="ru"
          role="menuitemradio"
        >
          Русский
        </button>
      </div>
    </div>


    <div
      class="theme-picker"
      data-theme-picker
    >
      <button
        class="theme-button"
        type="button"
        data-theme-button
        aria-label="Theme"
        aria-haspopup="true"
        aria-expanded="false"
      >
        ◐
      </button>

      <div
        class="theme-menu"
        data-theme-menu
        role="menu"
      >
        <button
          type="button"
          data-theme-choice="system"
          role="menuitemradio"
        >
          <span class="theme-choice-icon">
            ◐
          </span>

          <span data-i18n="themeSystem">
            System
          </span>
        </button>

        <button
          type="button"
          data-theme-choice="light"
          role="menuitemradio"
        >
          <span class="theme-choice-icon">
            ☀
          </span>

          <span data-i18n="themeLight">
            Light

    /*
      ==========================================================
      ENTRY MODE
      ==========================================================
    */

    function getEntryMode() {
      const url =
        new URL(
          window.location.href
        );

      const newMode =
        url.searchParams.get(
          "new"
        ) === "1";

      const sharedMode =
        url.searchParams.get(
          "shared"
        ) === "1";

      const mapId =
        (
          url.searchParams.get(
            "map"
          ) ?? ""
        ).trim();


      const count =
        Number(newMode) +
        Number(sharedMode) +
        Number(Boolean(mapId));


      if (count !== 1) {
        return {
          mode:
            "invalid",
        };
      }


      if (newMode) {
        return {
          mode:
            "new",

          templateId:
            (url.searchParams.get("template") ?? "").trim(),

          title:
            (url.searchParams.get("title") ?? "").trim(),
        };
      }


      if (sharedMode) {
        return {
          mode:
            "shared",
        };
      }


      return {
        mode:
          "saved",

        mapId,
      };
    }


    /*
      ==========================================================
      LOGIN CHECK
      ==========================================================
    */

    function requireLogin() {
      const token =
        getSessionToken();

      if (!token) {
        return null;
      }


      const expires =
        sessionStorage.getItem(
          SESSION_EXPIRES_KEY
        );


      if (
        expires &&
        new Date(
          expires
        ).getTime() <=
          Date.now()
      ) {
        clearSession();

        return null;
      }


      return token;
    }


    /*
      ==========================================================
      LOAD SAVED MAP
      ==========================================================
    */

    async function loadSavedMap(
      mapId
    ) {
      autosaveReady = false; ensureAutosaveController().cancel();
      const token =
        requireLogin();

      if (!token) {
        setOverlay(
          text.loginRequired,
          text.sessionExpired,
          true
        );

        return false;
      }


      setOverlay(
        text.loading,
        text.loadingMap
      );


      try {
        const response =
          await fetch(
            `${MAP_LOAD_URL}?mapId=${encodeURIComponent(mapId)}`,
            {
              method:
                "GET",

              headers: {
                Authorization:
                  `Bearer ${token}`,
              },
            }
          );


        const result =
          await response
            .json()
            .catch(
              () => ({})
            );


        if (
          response.status === 401
        ) {
          clearSession();

          setOverlay(
            text.sessionExpired,
            "",
            true
          );

          return false;
        }


        if (
          response.status === 404
        ) {
          const deletedRecovery = await findRecovery({ mapId });
          if (deletedRecovery) { hideOverlay(); setEditorControlsEnabled(true); await offerRecovery(deletedRecovery, { missingServer: true }); return true; }
          setOverlay(
            text.mapNotFound,
            "",
            true
          );

          return false;
        }


        if (
          !response.ok ||
          !result.ok ||
          !result.map
        ) {
          throw new Error(
            text.loadFailed
          );
        }


        currentMapId =
          result.map.id;
        recoverySourceKind = "saved"; recoveryDocumentId = null; saveMetadata = { id: result.map.id, name: result.map.name, createdAt: result.map.createdAt, updatedAt: result.map.updatedAt };

        currentDocument =
          PNSMapEngine.loadDocument(
            result.map.documentData
          );

        mapTitleInput.value =
          result.map.name ??
          text.untitled;

        readOnly =
          false;

        setDirty(
          false
        );

        mountMapRenderer();
        autosaveReady = true;

        await offerRecovery(await findRecovery({ mapId: currentMapId, serverUpdatedAt: result.map.updatedAt }));

        hideOverlay();

        setEditorControlsEnabled(
          true
        );

        /*
          다음 단계:
          currentDocument를 실제 아이소메트릭
          렌더러에 전달한다.

          예:
          window.PNSMapEngine.loadDocument(
            currentDocument
          );
        */

        return true;

      } catch (error) {
        console.error(
          "Map load failed:",
          error
        );

        setOverlay(
          text.loadFailed,
          "",
          true
        );

        return false;
      }
    }


    /*
      ==========================================================
      NEW MAP
      ==========================================================
    */

    async function prepareNewMap(entry = {}) {
      autosaveReady = false; ensureAutosaveController().cancel();
      const token =
        requireLogin();

      if (!token) {
        setOverlay(
          text.loginRequired,
          "",
          true
        );

        return false;
      }


      setOverlay(
        text.loading,
        text.preparingNew
      );


      currentMapId =
        null;
      recoverySourceKind = "new"; recoveryDocumentId = newRecoveryDocumentId(); recoveryActiveKey = null;

      const title = entry.title || text.untitled;
      let template = null;
      if (entry.templateId && entry.templateId !== "empty") {
        const raw = sessionStorage.getItem(NEW_MAP_TEMPLATE_KEY);
        sessionStorage.removeItem(NEW_MAP_TEMPLATE_KEY);
        try {
          const transfer = JSON.parse(raw || "null");
          if (
            !transfer ||
            transfer.templateId !== entry.templateId ||
            !transfer.templateData
          ) {
            throw new Error("INVALID_TEMPLATE_TRANSFER");
          }
          template = transfer.templateData;
        } catch (error) {
          console.error("New map template transfer failed:", error);
          setOverlay(text.loadFailed, "", true);
          return false;
        }
      } else {
        sessionStorage.removeItem(NEW_MAP_TEMPLATE_KEY);
      }

      try {
        currentDocument = PNSMapEngine.createNewDocument({
          title,
          template,
        });
      } catch (error) {
        console.error("New map template validation failed:", error);
        setOverlay(text.loadFailed, "", true);
        return false;
      }

      readOnly =
        false;

      mapTitleInput.value =
        title;

      setDirty(
        true
      );

      mountMapRenderer();
      autosaveReady = true;

      await offerRecovery(await findRecovery({ unsaved: true }));

      hideOverlay();

      setEditorControlsEnabled(
        true
      );

      return true;
    }

    function ensureSaveManager() {
      if (saveManager) return saveManager;
      saveManager = createMapSaveManager({
        url: MAP_SAVE_URL,
        getToken: getSessionToken,
        getMapId: () => currentMapId,
        setMapId: id => { currentMapId = id; },
        getName: () => mapTitleInput.value,
        exportDocument: () => {
          const documentData = PNSMapEngine.exportDocument();
          documentData.title = mapTitleInput.value.trim();
          return documentData;
        },
        getRevision: () => mutationRevision,
        isReadOnly: () => readOnly,
        onMetadata: metadata => { saveMetadata = metadata; },
        onSessionExpired: () => { clearSession(); },
        onStateChange: state => {
          saveStatusMessage = state.saving ? text.saving : "";
          renderDocumentStatus(); updateSaveButton();
        },
      });
      return saveManager;
    }

    saveButton.addEventListener(
      "click",
      async () => {
        const savingHistoryStateId = history?.getState().currentStateId;
        try {
          const outcome = await ensureSaveManager().save();
          if (!outcome.skipped) history?.markSaved(savingHistoryStateId);
          if (!outcome.skipped && outcome.clean && history?.isAtSavedState()) {
            ensureAutosaveController().cancel(); setDirty(false);
            const accountId = getRecoveryAccountId(), keys = new Set([recoveryActiveKey]);
            if (accountId && outcome.requestMapId) keys.add(recoveryKey(accountId, "saved", outcome.requestMapId, null));
            if (accountId && currentMapId) keys.add(recoveryKey(accountId, "saved", currentMapId, null));
            await Promise.all([...keys].filter(Boolean).map(key => recoveryStorage.delete(key).catch(() => {})));
            recoveryActiveKey = null; recoverySourceKind = "saved"; recoveryDocumentId = null;
          }
          else if (!outcome.skipped) { saveStatusMessage = ""; renderDocumentStatus(); }
        } catch (error) {
          const code = error instanceof MapSaveError ? error.code : "MAP_SAVE_FAILED";
          saveStatusMessage = getSaveErrorMessage(code);
          renderDocumentStatus();
          if (["UNAUTHORIZED", "INVALID_SESSION", "SESSION_EXPIRED"].includes(code)) setOverlay(text.sessionExpired, "", true);
        } finally {
          updateSaveButton();
        }
      }
    );

    moveToolButton.addEventListener("click", () => { try { cancelAreaModes(); buildingController?.startMove(); mapRenderer?.invalidate(); } catch (error) { window.alert(error.message); } });
    bulkDeleteToolButton.addEventListener("click", () => { try { rangeEraseController?.cancel(); bulkDeleteController?.start(); mapRenderer?.invalidate(); } catch (error) { window.alert(error.message); } });
    rangeEraseToolButton.addEventListener("click", () => { try { rangeEraseController?.start(); mapRenderer?.invalidate(); } catch (error) { window.alert(error.message); } });
    function performUndo() { const command = buildingController?.undo(); if (command) mapRenderer?.refresh(); }
    function performRedo() { const command = buildingController?.redo(); if (command) mapRenderer?.refresh(); }
    undoButton.addEventListener("click", performUndo);
    redoButton.addEventListener("click", performRedo);

    function applyZoomPercentInput(input) {
      if (!input || !mapRenderer) return;
      const percent = Number(input.value);
      if (!Number.isFinite(percent)) {
        window.S967EditorHost.setZoom?.(mapRenderer.getState?.().zoom ?? 1);
        return;
      }
      const clampedPercent = Math.min(400, Math.max(1, percent));
      input.value = String(Math.round(clampedPercent));
      mapRenderer.setZoom?.(clampedPercent / 100);
    }

    function bindZoomInput(input) {
      if (!input) return;
      input.addEventListener("change", () => applyZoomPercentInput(input));
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          applyZoomPercentInput(input);
          input.blur();
        }
      });
    }

    bindZoomInput(zoomPercentInput);
    bindZoomInput(sharedZoomPercentInput);

    zoomOutButton.addEventListener("click", () => { mapRenderer?.zoomBy?.(1 / 1.15); });
    zoomInButton.addEventListener("click", () => { mapRenderer?.zoomBy?.(1.15); });
    fitMapButton.addEventListener("click", () => { mapRenderer?.fitToMap?.(); });
    sharedZoomOutButton?.addEventListener("click", () => mapRenderer?.zoomBy?.(1 / 1.15));
    sharedZoomInButton?.addEventListener("click", () => mapRenderer?.zoomBy?.(1.15));
    sharedFitMapButton?.addEventListener("click", () => mapRenderer?.fitToMap?.());
    window.addEventListener("keydown", event => {
      if (readOnly || event.defaultPrevented) return;
      const action = editorShortcutAction({ key: event.key, ctrlKey: event.ctrlKey, metaKey: event.metaKey, altKey: event.altKey, shiftKey: event.shiftKey, isFormControl: event.target instanceof Element && Boolean(event.target.closest("input, textarea, select, [contenteditable='true']")) });
      if (action) { event.preventDefault(); action === "undo" ? performUndo() : performRedo(); }
    });


    /*
      ==========================================================
      LANGUAGE CHANGE
      ==========================================================
    */

    window.addEventListener(
      "s967languagechange",
      (event) => {
        language =
          event.detail?.language ??
          (
            typeof getCurrentLanguage ===
              "function"
              ? getCurrentLanguage()
              : "en"
          );

        text =
          TEXT[language] ??
          TEXT.en;

        setStaticText();
      }
    );


    /*
      ==========================================================
      PUBLIC HOST API
      ==========================================================

      다음 단계에서 실제 맵 엔진을 별도 JS 파일로
      분리해도 이 HTML을 거의 건드리지 않도록
      최소한의 연결 인터페이스를 준비해 둔다.
    */

    window.S967EditorHost = {
      getMode() {
        return editorMode;
      },

      getMapId() {
        return currentMapId;
      },

      getDocument() {
        return PNSMapEngine.getDocument();
      },

      isReadOnly() {
        return readOnly;
      },

      markDirty() {
        if (!readOnly) {
          setDirty(
            true
          );
        }
      },

      markSaved() {
        setDirty(
          false
        );
      },

      setCursor(
        x,
        y
      ) {
        document.getElementById(
          "cursorStatus"
        ).textContent =
          `X: ${x} · Y: ${y}`;
      },

      clearCursor() {
        document.getElementById(
          "cursorStatus"
        ).textContent =
          "X: — · Y: —";
      },

      setZoom(
        zoom
      ) {
        const label =
          `${Math.round(zoom * 100)}%`;

        document.getElementById(
          "zoomStatus"
        ).textContent =
          label;

        const percent = Math.round(zoom * 100);
        if (zoomPercentInput && document.activeElement !== zoomPercentInput) zoomPercentInput.value = String(percent);
        if (sharedZoomPercentInput && document.activeElement !== sharedZoomPercentInput) sharedZoomPercentInput.value = String(percent);
      },
    };


    /*
      ==========================================================
      INITIALIZE
      ==========================================================
    */

    async function initialize() {
      const entry =
        getEntryMode();


      if (
        entry.mode ===
        "invalid"
      ) {
        editorMode =
          "invalid";

        setStaticText();

        setOverlay(
          text.invalidEntry,
          "",
          true
        );

        return;
      }


      editorMode =
        entry.mode;

      setStaticText();


      if (
        editorMode === "new"
      ) {
        await prepareNewMap(entry);

        return;
      }


      if (
        editorMode === "saved"
      ) {
        await loadSavedMap(
          entry.mapId
        );

        return;
      }


      if (
        editorMode === "shared"
      ) {
        prepareSharedMap();

        return;
      }
    }


    initialize();
  </script>

</body>
</html>
