<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>고정맵 제작기 · S967</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js" defer></script>
  <script src="/admin/admin-auth.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
    body { height: 100dvh; min-height: 0; display: flex; flex-direction: column; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color: var(--text); background: var(--background); }
    button,input,select { font: inherit; }
    button { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-hover); color: var(--text); font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--border-hover); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input,select { border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--surface-hover); color: var(--text); padding: 7px 8px; }
    input:focus,select:focus { border-color: var(--border-hover); }
    .hidden { display: none !important; }

    .editor-header { position: relative; z-index: 100; flex: 0 0 auto; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: clamp(6px,.85vh,10px) clamp(10px,1.25vw,16px); border-bottom: 1px solid var(--border); background: var(--surface); }
    .editor-title-area { min-width: 0; }
    .editor-eyebrow { margin-bottom: 2px; color: var(--muted); font-size: .68rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .editor-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .editor-title { margin: 0; font-size: clamp(.95rem,1.2vw,1.15rem); font-weight: 800; }
    .mode-badge { padding: 4px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .72rem; font-weight: 750; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
    .header-actions button,.header-actions a,.header-actions select { min-height: 34px; padding: 6px 9px; font-size: .8rem; }
    .header-actions a { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-hover); color: var(--text); text-decoration: none; font-weight: 700; }

    .editor-toolbar { position: relative; z-index: 90; flex: 0 0 auto; display: flex; align-items: center; gap: 7px; min-height: 42px; padding: 5px 10px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--surface); }
    .tool-button { flex: 0 0 auto; min-height: 34px; padding: 7px 10px; font-size: .8rem; }
    .tool-separator { width: 1px; height: 26px; flex: 0 0 auto; margin: 0 2px; background: var(--border); }
    .zoom-input-wrap { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; padding: 0 7px; min-height: 34px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-hover); color: var(--muted); font-size: .78rem; }
    .zoom-input { width: 52px; padding: 4px 2px; border: 0; background: transparent; color: var(--text); text-align: right; }

    .editor-shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px,18vw) minmax(0,1fr) minmax(250px,20vw); overflow: hidden; padding-bottom: clamp(6px,1vh,12px); background: var(--background); }
    .editor-sidebar { position: relative; z-index: 20; min-width: 0; min-height: 0; padding: 10px; background: var(--surface); }
    .editor-sidebar-left { display: grid; grid-template-rows: minmax(0,1fr) auto; gap: 10px; border-right: 1px solid var(--border); }
    .editor-sidebar-right { overflow-y: auto; border-left: 1px solid var(--border); }
    .sidebar-scroll { min-height: 0; overflow-y: auto; padding-right: 2px; }
    .sidebar-section { margin-top: 14px; }
    .sidebar-section:first-child { margin-top: 0; }
    .sidebar-title { margin: 0 0 8px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .field-grid { display: grid; gap: 7px; }
    .field-grid label { display: grid; gap: 4px; color: var(--muted); font-size: .76rem; font-weight: 700; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row > * { min-width: 0; }
    .grow { flex: 1 1 auto; }
    .small { width: 72px; }
    .type-list { display: grid; gap: 6px; margin-top: 8px; }
    .type-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 5px; }
    .type-row .select-type { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type-row button { padding: 6px 7px; font-size: .74rem; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: .72rem; line-height: 1.45; }

    .editor-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--background); }
    #mapCanvasHost { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pns-map-canvas { position: absolute; inset: 0; touch-action: none; outline: none; }

    .minimap-panel { position: relative; width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-hover); }
    .minimap-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: .78rem; font-weight: 800; }
    .minimap-host { position: relative; width: 100%; aspect-ratio: 1.45; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; touch-action: none; }
    .minimap-host canvas { position: absolute; inset: 0; display: block; }
    .minimap-viewport-canvas { cursor: crosshair; touch-action: none; }

    .selection-card { display: grid; gap: 9px; }
    .selection-name { font-weight: 800; overflow-wrap: anywhere; }
    .selection-empty { color: var(--muted); font-size: .82rem; }
    .danger { color: #d75555; }
    .full { width: 100%; }

    .editor-statusbar { position: relative; z-index: 80; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 34px; padding: 6px 12px; border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .76rem; }
    .status-left,.status-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .status-item { white-space: nowrap; }

    .editor-overlay { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb,var(--background) 86%,transparent); }
    .overlay-card { width: min(440px,100%); padding: 22px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
    .overlay-title { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .overlay-message { margin: 10px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.6; white-space: pre-line; }
    .overlay-actions { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .overlay-actions a { padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-hover); color: var(--text); text-decoration: none; font-size: .84rem; font-weight: 700; }

    dialog { border: 0; border-radius: 14px; padding: 22px; background: var(--surface); color: var(--text); box-shadow: 0 18px 60px #0005; }
    dialog::backdrop { background: #0007; }

    @media (max-width: 900px) {
      .editor-shell { grid-template-columns: minmax(190px,28vw) minmax(0,1fr); }
      .editor-sidebar-right { display: none; }
    }
    @media (max-width: 620px) {
      .editor-header { grid-template-columns: 1fr; }
      .header-actions { justify-content: flex-start; }
      .editor-shell { grid-template-columns: 1fr; }
      .editor-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <header class="editor-header">
    <div class="editor-title-area">
      <div class="editor-eyebrow">S967 · IsoMAP EDITOR</div>
      <div class="editor-title-row">
        <h1 class="editor-title">고정맵 제작기</h1>
        <span class="mode-badge">ADMIN · FIXED TEMPLATE</span>
        <span id="dirtyBadge" class="mode-badge">저장됨</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="newTemplateButton" type="button">새 템플릿</button>
      <button id="openTemplateButton" type="button">.isotemplate 열기</button>
      <button id="importMapButton" type="button">.isomap 가져오기</button>
      <button id="exportTemplateButton" type="button">내보내기</button>
      <input id="templateFileInput" type="file" accept=".isotemplate" hidden>
      <input id="mapFileInput" type="file" accept=".isomap" hidden>
      <span class="tool-separator"></span>
      <select id="serverTemplates" aria-label="등록된 고정맵"><option value="">등록된 고정맵 선택</option></select>
      <button id="refreshServerButton" type="button">새로고침</button>
      <button id="loadServerButton" type="button">서버에서 열기</button>
      <button id="registerServerButton" type="button">신규 등록</button>
      <button id="replaceServerButton" type="button" hidden>서버 업데이트</button>
      <a href="/admin/">관리자</a>
    </div>
  </header>

  <div class="editor-toolbar">
    <button id="selectToolButton" class="tool-button" type="button">선택</button>
    <button id="moveToolButton" class="tool-button" type="button">이동</button>
    <button id="bulkDeleteToolButton" class="tool-button" type="button">영역 내 건물 삭제</button>
    <button id="rangeEraseToolButton" class="tool-button" type="button">범위 부분 삭제</button>
    <span class="tool-separator"></span>
    <button id="undoButton" class="tool-button" type="button">실행 취소</button>
    <button id="redoButton" class="tool-button" type="button">다시 실행</button>
    <span class="tool-separator"></span>
    <button id="zoomOutButton" class="tool-button" type="button">−</button>
    <label class="zoom-input-wrap"><input id="zoomPercentInput" class="zoom-input" type="number" min="1" max="400" step="1" value="100"><span>%</span></label>
    <button id="zoomInButton" class="tool-button" type="button">+</button>
    <button id="fitMapButton" class="tool-button" type="button">전체 보기</button>
  </div>

  <div class="editor-shell">
    <aside class="editor-sidebar editor-sidebar-left">
      <div class="sidebar-scroll">
        <section class="sidebar-section">
          <h2 class="sidebar-title">고정 건물 종류</h2>
          <div class="field-grid">
            <label>ID<input id="typeIdInput" value="fixed-type-01"></label>
            <label>이름<input id="typeNameInput" placeholder="예: 실험기지"></label>
            <div class="row">
              <label class="grow">기본 색<input id="typeColorInput" value="#4E79A7" placeholder="#RRGGBB 또는 255,255,255"></label>
              <label>가로<input id="typeWidthInput" type="number" min="1" step="1" value="1"></label>
              <label>세로<input id="typeHeightInput" type="number" min="1" step="1" value="1"></label>
            </div>
            <button id="addTypeButton" type="button">건물 종류 추가</button>
          </div>
          <div class="field-grid" style="margin-top:10px">
            <strong style="font-size:.76rem">새 건물 배치 설정</strong>
            <div class="row">
              <label class="grow">색<input id="buildingColorInput" value="#4E79A7" placeholder="#RRGGBB 또는 255,255,255"></label>
              <label class="small">우선순위<input id="buildingPriorityInput" type="number" step="1" value="0"></label>
            </div>
          </div>
          <div id="buildingTypesHost" class="type-list"></div>
          <p class="hint">종류를 누르면 배치 모드가 됩니다. 실제 고정 건물은 개별 색과 우선순위를 따로 가질 수 있습니다.</p>
        </section>

        <section class="sidebar-section">
          <h2 class="sidebar-title">고정 범위</h2>
          <div class="field-grid">
            <div class="row">
              <label class="grow">종류<select id="rangeKindInput"><option value="allowed">건축 허용</option><option value="blocked">건축 금지</option></select></label>
              <label class="small">우선순위<input id="rangePriorityInput" type="number" step="1" value="0"></label>
            </div>
            <label>색<input id="rangeColorInput" value="#59A14F" placeholder="#RRGGBB 또는 255,255,255"></label>
            <button id="newRangeButton" type="button">새 범위</button>
            <button id="confirmRangeButton" type="button">범위 확정</button>
          </div>
          <p class="hint">색은 HEX 또는 RGB 입력 가능. 우선순위는 항상 정수로 저장되며 삭제되지 않습니다.</p>
        </section>
      </div>

      <section id="minimapPanel" class="minimap-panel">
        <div class="minimap-header"><span>미니맵</span></div>
        <div id="minimapHost" class="minimap-host"></div>
      </section>
    </aside>

    <main class="editor-stage"><div id="mapCanvasHost"></div></main>

    <aside class="editor-sidebar editor-sidebar-right">
      <section class="sidebar-section">
        <h2 class="sidebar-title">선택 정보</h2>
        <div id="selectionHost" class="selection-card"><div class="selection-empty">선택된 항목이 없습니다.</div></div>
      </section>
    </aside>
  </div>

  <footer class="editor-statusbar">
    <div class="status-left">
      <span id="documentStatus" class="status-item">준비 중…</span>
      <span id="cursorStatus" class="status-item">X: — · Y: —</span>
      <span id="serverStatus" class="status-item"></span>
    </div>
    <div class="status-right"><span id="zoomStatus" class="status-item">100%</span></div>
  </footer>

  <div id="editorOverlay" class="editor-overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle" class="overlay-title">관리자 세션 확인 중…</h2>
      <p id="overlayMessage" class="overlay-message"></p>
      <div id="overlayActions" class="overlay-actions hidden"><a href="/admin/">관리자 페이지</a></div>
    </div>
  </div>

  <dialog id="registerDialog">
    <form id="registerForm" class="field-grid">
      <h2 style="margin:0 0 8px">관리자에 신규 등록</h2>
      <label>한국어<input name="name_ko" required maxlength="100"></label>
      <label>English<input name="name_en" required maxlength="100"></label>
      <label>日本語<input name="name_ja" required maxlength="100"></label>
      <label>Русский<input name="name_ru" required maxlength="100"></label>
      <div class="row" style="justify-content:flex-end"><button id="cancelRegisterButton" type="button">취소</button><button type="submit">등록</button></div>
    </form>
  </dialog>

  <script type="module" src="./template-editor-app.js"></script>
</body>
</html>
