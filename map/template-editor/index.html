<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>고정맵 제작기 | S967</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><script src="/admin/admin-auth.js"></script>
<style>body{margin:0;font-family:system-ui,sans-serif;background:var(--bg,#f5f5f5);color:var(--text,#222)}button,input,select{font:inherit}.gate{max-width:560px;margin:10vh auto;padding:24px;background:var(--card-bg,#fff);border-radius:14px}.app{height:100vh;display:grid;grid-template-rows:auto auto auto 1fr}.toolbar,.serverbar,.navstatus{display:flex;gap:8px;align-items:center;padding:8px;background:var(--card-bg,#fff);border-bottom:1px solid #aaa;flex-wrap:wrap}.workspace{min-height:0;display:grid;grid-template-columns:280px 1fr 280px}.panel{padding:12px;overflow:auto;background:var(--card-bg,#fff)}.canvas{min-width:0;min-height:0}.field{display:grid;gap:5px;margin:8px 0}.coord{width:76px}.compact{width:90px}.navstatus label{display:flex;gap:4px;align-items:center}.row{display:flex;gap:6px;flex-wrap:wrap}.list button{margin:4px 0}.dirty,.error{color:#c2410c;font-weight:700}dialog{border:0;border-radius:14px;padding:22px;box-shadow:0 18px 60px #0005}dialog::backdrop{background:#0007}@media(max-width:800px){.workspace{grid-template-columns:220px 1fr}.right{display:none}}</style></head><body>
<section id="gate" class="gate"><h1>고정맵 제작기</h1><p id="gateMessage">관리자 세션을 확인하고 있습니다.</p><a href="/admin/">관리자 페이지로 이동</a></section>
<main id="app" class="app" hidden>
 <div class="toolbar"><strong>고정맵 제작기</strong><span id="dirty"></span><button id="newBtn">새 템플릿</button><button id="openBtn">.isotemplate 열기</button><button id="importBtn">.isomap 가져오기</button><button id="exportBtn">내보내기</button><button id="undoBtn">실행 취소</button><button id="redoBtn">다시 실행</button><input id="templateFile" type="file" accept=".isotemplate" hidden><input id="mapFile" type="file" accept=".isomap" hidden></div>
 <div class="serverbar"><strong id="linkStatus">로컬 고정맵</strong><button id="registerBtn">관리자에 신규 등록</button><button id="replaceBtn" hidden>등록된 고정맵 업데이트</button><select id="serverTemplates"><option value="">등록된 고정맵 선택</option></select><button id="refreshServerBtn">목록 새로고침</button><button id="loadServerBtn">등록된 고정맵 열기</button><span id="serverStatus"></span></div>
 <div class="navstatus">
  <strong>좌표</strong>
  <span id="cursorCoord">커서 X — / Y —</span>
  <label>중심 X <input id="centerX" class="coord" type="number" min="0" max="511"></label>
  <label>Y <input id="centerY" class="coord" type="number" min="0" max="1023"></label>
  <button id="goCenter" type="button">이동</button>
  <label>배율 <input id="zoomInput" class="compact" type="number" min="1" max="400" step="1">%</label>
  <button id="applyZoom" type="button">적용</button>
 </div>
 <div class="workspace"><aside class="panel"><h2>고정 건물 유형</h2><div class="field"><label>ID<input id="typeId" value="fixed-type-01"></label><label>이름<input id="typeName"></label><label>색상<input id="typeColor" type="color" value="#4e79a7"></label><label>크기<select id="typeSize"><option value="1">1×1</option><option value="2">2×2</option></select></label><button id="addType">유형 추가</button></div><div id="types" class="list"></div><hr><h2>고정 영역</h2><div class="row"><select id="rangeKind"><option value="allowed">allowed</option><option value="blocked">blocked</option></select><input id="rangeColor" type="color" value="#59a14f"></div><div class="row"><button id="startRange">사각형 시작</button><button id="commitRange">영역 확정</button></div><div class="field"><strong>좌표로 사각형 생성</strong><div class="row"><label>X1 <input id="rangeX1" class="coord" type="number" min="0" max="511"></label><label>Y1 <input id="rangeY1" class="coord" type="number" min="0" max="1023"></label></div><div class="row"><label>X2 <input id="rangeX2" class="coord" type="number" min="0" max="511"></label><label>Y2 <input id="rangeY2" class="coord" type="number" min="0" max="1023"></label></div><button id="createRangeCoords" type="button">좌표로 영역 생성</button></div></aside><section id="canvas" class="canvas"></section><aside class="panel right"><h2>선택 항목</h2><div id="selection">선택된 항목이 없습니다.</div><div id="buildingCoords" class="field" hidden><strong>선택 건물 좌표</strong><div class="row"><label>X <input id="buildingX" class="coord" type="number" min="0" max="511"></label><label>Y <input id="buildingY" class="coord" type="number" min="0" max="1023"></label><button id="moveBuildingCoords" type="button">좌표 적용</button></div></div><div class="row"><button id="moveBuilding">이동</button><button id="editBuilding">이름/유형 수정</button><button id="deleteBuilding">건물 삭제</button></div><div class="row"><button id="editRange">영역 속성 수정</button><button id="eraseRange">영역 일부 삭제</button><button id="deleteRange">영역 삭제</button></div><p>휠 확대/축소 · 가운데 버튼 또는 Space+드래그 이동</p></aside></div>
</main>
<dialog id="registerDialog"><form id="registerForm" class="field"><h2>관리자에 신규 등록</h2><label>한국어<input name="name_ko" required maxlength="100"></label><label>English<input name="name_en" required maxlength="100"></label><label>日本語<input name="name_ja" required maxlength="100"></label><label>Русский<input name="name_ru" required maxlength="100"></label><div class="row"><button type="submit">등록</button><button type="button" id="cancelRegister">취소</button></div></form></dialog>
<script type="module" src="./template-editor-app.js"></script></body></html>
