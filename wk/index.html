<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WK Application · S967</title>

  <link
    rel="stylesheet"
    href="/theme.css"
  >

  <script
    src="/theme.js"
    defer
  ></script>

  <script
    src="/language.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 36px 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(
        2.2rem,
        7vw,
        4rem
      );
      letter-spacing: -0.04em;
    }

    h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    .eyebrow {
      margin-bottom: 10px;

      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .panel {
      margin-top: 24px;
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--surface);
      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .field {
      margin-top: 20px;
    }

    .field:first-child {
      margin-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;

      font-size: 0.92rem;
      font-weight: 700;
    }

    .required {
      color: #d75555;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      font: inherit;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 9px;

      padding: 11px 12px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
    }

    .choice input {
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .choice span {
      min-width: 0;
      line-height: 1.5;
    }

    .small {
      margin-top: 7px;

      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    .status {
      margin-top: 16px;
      min-height: 1.4em;

      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      color: #d75555;
    }

    .success {
      color: #3f9565;
    }

    button {
      padding: 11px 15px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      font: inherit;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      border-color: var(--border-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .submit-row {
      margin-top: 24px;
    }

    .submit-row button {
      width: 100%;
    }

    .back {
      display: inline-block;
      margin-top: 26px;

      font-size: 0.9rem;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    <div class="eyebrow">

    <h1 id="pageTitle">

            for="playerName"

          </label>

          <input
            id="playerName"
            type="text"
            maxlength="100"
            required
          >
        </div>


        <div class="field">
          <label
            id="tierLabel"
            class="label"
            for="tier"
          >
            Tier
            <span class="required">*</span>
          </label>

          <select
            id="tier"
            required
          >
            <option value="">
              Loading…
            </option>
          </select>
        </div>


        <div class="field">
          <label
            id="allianceLabel"
            class="label"
            for="alliance"
          >
            Alliance
            <span class="required">*</span>
          </label>

          <select
            id="alliance"
            required
          >
            <option value="">
              Loading…
            </option>
          </select>
        </div>


        <div class="field">
          <div
            id="troopTypeLabel"
            class="label"
          >
            Troop Type
            <span class="required">*</span>
          </div>

          <div
            id="troopTypeChoices"
            class="choices"
          ></div>
        </div>


        <div class="field">
          <label
            id="troopSizeLabel"
            class="label"
            for="troopSize"
          >
            Troop Size
            <span class="required">*</span>
          </label>

          <input
            id="troopSize"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            required
          >
        </div>


        <div class="field">
          <label
            id="rallySizeLabel"
            class="label"
            for="rallySize"
          >
            Rally Size
            <span class="required">*</span>
          </label>

          <input
            id="rallySize"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            required
          >
        </div>


        <div class="field">
          <div
            id="realtimeLabel"
            class="label"
          >
            Real-time Response
            <span class="required">*</span>
          </div>

          <div
            id="realtimeChoices"
            class="choices"
          ></div>
        </div>


        <div class="field">
          <div
            id="captainRoleLabel"
            class="label"
          >
            Captain Role
            <span class="required">*</span>
          </div>

          <div
            id="captainRoleChoices"
            class="choices"
          ></div>
        </div>


        <div class="field">
          <div
            id="participationTimeLabel"
            class="label"
          >
            Participation Time
            <span class="required">*</span>
          </div>

          <div
            id="participationTimeChoices"
            class="choices"
          ></div>

          <p
            id="participationNotice"
            class="small hidden"
          ></p>
        </div>


        <div class="field">
          <label class="choice">
            <input
              id="agreementColony"
              type="checkbox"
              required
            >

            <span id="agreementColonyText"></span>
          </label>
        </div>


        <div class="field">
          <label class="choice">
            <input
              id="agreementTroopReturn"
              type="checkbox"
              required
            >

            <span id="agreementTroopReturnText"></span>

        </div>


        <div class="submit-row">
          <button
            id="submitButton"

            Submit

        </div>

        <div
          id="formStatus"
          class="status"
        ></div>
      </form>
    </section>


    <a
      id="backLink"
      class="back"

    >
      ← Back to Home

    function createRadioGroup(
      containerId,
      name,
      values
    ) {
      const container =
        document.getElementById(
          containerId
        );

      container.innerHTML = "";

      Object.entries(values)
        .forEach(
          ([value, label]) => {
            const wrapper =
              document.createElement(
                "label"
              );

            wrapper.className =
              "choice";


            const input =
              document.createElement(
                "input"
              );

            input.type =
              "radio";

            input.name =
              name;

            input.value =
              value;

            input.required =
              true;


            const span =
              document.createElement(
                "span"
              );

            span.textContent =
              label;


            wrapper.appendChild(
              input
            );

            wrapper.appendChild(
              span
            );

            container.appendChild(
              wrapper
            );
          }
        );
    }


    function renderRadioGroups() {
      createRadioGroup(
        "troopTypeChoices",
        "troop_type",
        text.troopTypes
      );

      createRadioGroup(
        "realtimeChoices",
        "realtime_response",
        text.realtimeOptions
      );

      createRadioGroup(
        "captainRoleChoices",
        "captain_role",
        text.captainRoles
      );

      createRadioGroup(
        "participationTimeChoices",
        "participation_time",
        text.participationTimes
      );
    }


    async function loadOptions() {
      const response =
        await fetch(
          WK_API_URL,
          {
            method: "GET",
          }
        );

      const result =
        await response
          .json()
          .catch(
            () => ({})
          );

      if (!response.ok) {
        throw new Error(
          result.error ||
          text.loadFailed
        );
      }


      tier.innerHTML = "";

      const tierPlaceholder =
        document.createElement(
          "option"
        );

      tierPlaceholder.value = "";
      tierPlaceholder.textContent =
        text.select;

      tier.appendChild(
        tierPlaceholder
      );


      for (
        const item
        of (result.tiers ?? [])
      ) {
        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(item.id);

        option.textContent =
          item.name;

        tier.appendChild(option);
      }


      alliance.innerHTML = "";

      const alliancePlaceholder =
        document.createElement(
          "option"
        );

      alliancePlaceholder.value = "";
      alliancePlaceholder.textContent =
        text.select;

      alliance.appendChild(
        alliancePlaceholder
      );


      for (
        const item
        of (result.alliances ?? [])
      ) {
        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(item.id);

        option.textContent =
          item.name;

        alliance.appendChild(
          option
        );
      }
    }


    function getCheckedValue(
      name
    ) {
      return (
        document.querySelector(
          `input[name="${name}"]:checked`
        )?.value ?? ""
      );
    }


function updateParticipationState() {
  const realtime =
    getCheckedValue(
      "realtime_response"
    );

  const participationInputs =
    document.querySelectorAll(
      'input[name="participation_time"]'
    );

  const captainInputs =
    document.querySelectorAll(
      'input[name="captain_role"]'
    );

  if (
    realtime ===
    "monitor_unavailable"
  ) {
    participationInputs.forEach(
      (input) => {
        input.checked =
          input.value ===
          "second_half";

        input.disabled =
          input.value !==
          "second_half";
      }
    );

    captainInputs.forEach(
      (input) => {
        input.checked =
          input.value ===
          "regular";

        input.disabled =
          input.value !==
          "regular";
      }
    );

    participationNotice.textContent =
      text.forcedSecondHalf;

    participationNotice.classList.remove(
      "hidden"
    );

    return;
  }

  participationInputs.forEach(
    (input) => {
      input.disabled =
        false;
    }
  );

  captainInputs.forEach(
    (input) => {
      input.disabled =
        false;
    }
  );

  participationNotice.classList.add(
    "hidden"
  );
} 


    document.addEventListener(
      "change",
      (event) => {
        if (
          event.target.matches(
            'input[name="realtime_response"]'
          )
        ) {
          updateParticipationState();
        }
      }
    );


    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        setStatus("");


        if (!form.reportValidity()) {
          setStatus(
            text.required,
            "error"
          );

          return;
        }


        const troopType =
          getCheckedValue(
            "troop_type"
          );

        const realtimeResponse =
          getCheckedValue(
            "realtime_response"
          );

        const captainRole =
          getCheckedValue(
            "captain_role"
          );

        const participationTime =
          getCheckedValue(
            "participation_time"
          );


        if (
          !troopType ||
          !realtimeResponse ||
          !captainRole ||
          !participationTime
        ) {
          setStatus(
            text.required,
            "error"
          );

          return;
        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          text.submitting;


        try {
          const response =
            await fetch(
              WK_API_URL,
              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify({
                    language,

                    player_name:
                      playerName
                        .value
                        .trim(),

                    tier_id:
                      Number(
                        tier.value
                      ),

                    alliance_id:
                      Number(
                        alliance.value
                      ),

                    troop_type:
                      troopType,

                    troop_size:
                      Number(
                        troopSize.value
                      ),

                    rally_size:
                      Number(
                        rallySize.value
                      ),

                    realtime_response:
                      realtimeResponse,

                    captain_role:
                      captainRole,

                    participation_time:
                      participationTime,

                    s967_confirmed:
                      s967Confirmed
                        .checked,

                    agreement_colony:
                      agreementColony
                        .checked,

                    agreement_troop_return:
                      agreementTroopReturn
                        .checked,
                  }),
              }
            );


          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          if (!response.ok) {
            throw new Error(
              result.error ||
              text.submitFailed
            );
          }


          form.reset();

          updateParticipationState();

          setStatus(
            text.success,
            "success"
          );
        } catch (error) {
          setStatus(
            error.message ||
              text.submitFailed,
            "error"
          );
        } finally {
          submitButton.disabled =
            false;

          submitButton.textContent =
            text.submit;
        }
      }
    );


    async function initialize() {
      setStaticText();
      renderRadioGroups();

      try {
        await loadOptions();
      } catch (error) {
        setStatus(
          error.message ||
            text.loadFailed,
          "error"
        );

        submitButton.disabled =
          true;
      }
    }


    initialize();
  </script>
</body>
</html>
