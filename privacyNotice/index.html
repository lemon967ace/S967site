<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>S967 Privacy Policy</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js" defer></script>
  <script src="/language.js" defer></script>
  <style>
* { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.24), transparent 35%),
        var(--page-bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      transition: background-color .2s ease, color .2s ease;
    }

    a { color: inherit; }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 88px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .effective-date {
      margin-top: 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    .intro,
    .section {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .intro {
      padding: 20px 22px;
      line-height: 1.7;
    }

    .section {
      margin-top: 16px;
      padding: 22px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      line-height: 1.4;
    }

    h3 {
      margin: 20px 0 10px;
      font-size: 1rem;
    }

    p {
      margin: 10px 0;
      line-height: 1.75;
    }

    ul {
      margin: 8px 0 0;
      padding-left: 1.25rem;
      line-height: 1.72;
    }

    li + li { margin-top: 4px; }

    .subtle {
      color: var(--muted);
    }

    .policy-table-wrap {
      overflow-x: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      background: var(--surface-strong);
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      line-height: 1.6;
    }

    th {
      font-size: .84rem;
      background: var(--surface-hover);
    }

    td {
      font-size: .88rem;
    }

    tr:last-child td { border-bottom: 0; }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-hover);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 24px;
      padding: 16px 4px 0;
      color: var(--muted);
      text-align: center;
      font-size: .8rem;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 980px);
        padding-top: 34px;
        padding-bottom: 86px;
      }

      .intro,
      .section {
        border-radius: 14px;
        padding: 17px;
      }

      h1 {
        font-size: clamp(2rem, 10vw, 3rem);
      }

      .settings {
        right: 12px;
        bottom: 12px;
      }

      .setting-button {
        width: 38px;
        height: 38px;
      }
    }
  
    .top-pickers { position:fixed; right:18px; bottom:18px; z-index:1100; display:flex; align-items:flex-end; gap:8px; }
    .top-pickers .language-picker,.top-pickers .theme-picker { position:relative; top:auto; right:auto; bottom:auto; left:auto; }
    .top-pickers .language-menu,.top-pickers .theme-menu { top:auto; right:0; bottom:calc(100% + 8px); left:auto; }
    .policy-note { margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-hover); line-height:1.65; }
    @media (max-width:600px){ .top-pickers{right:14px;bottom:14px;gap:8px;} }
</style>
</head>
<body>
<div class="top-pickers">
<div class="language-picker" data-language-picker>
<button class="language-button" type="button" data-language-button aria-label="Language" aria-haspopup="true" aria-expanded="false">🌐</button>
<div class="language-menu" data-language-menu role="menu">
<button type="button" data-language-choice="ko" role="menuitemradio">한국어</button>
<button type="button" data-language-choice="en" role="menuitemradio">English</button>
<button type="button" data-language-choice="ja" role="menuitemradio">日本語</button>
<button type="button" data-language-choice="ru" role="menuitemradio">Русский</button>
</div></div>
<div class="theme-picker" data-theme-picker>
<button class="theme-button" type="button" data-theme-button aria-label="Theme" aria-haspopup="true" aria-expanded="false">◐</button>
<div class="theme-menu" data-theme-menu role="menu">
<button type="button" data-theme-choice="system" role="menuitemradio"><span class="theme-choice-icon">◐</span><span data-i18n="themeSystem">System</span></button>
<button type="button" data-theme-choice="light" role="menuitemradio"><span class="theme-choice-icon">☀</span><span data-i18n="themeLight">Light</span></button>
<button type="button" data-theme-choice="dark" role="menuitemradio"><span class="theme-choice-icon">☾</span><span data-i18n="themeDark">Dark</span></button>
</div></div></div>
<main id="policyRoot" class="shell"></main>
<script>
(() => {
  const POLICY = {"ko": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>개인정보 처리방침</h1><div class=\"effective-date\">시행일: 2026년 8월 14일</div></header>\n<section class=\"intro\">S967(이하 “사이트”)은 이용자의 개인정보를 중요하게 생각하며 관련 법령을 준수합니다. 사이트는 서비스 제공과 운영에 필요한 범위에서 개인정보를 처리하고, 처리 목적이 달성되거나 정해진 보유기간이 지난 경우 해당 정보를 삭제 또는 비식별 처리합니다.</section>\n<section class=\"section\"><h2>1. 처리하는 개인정보와 이용 목적</h2>\n<h3>1) 계정 및 인증</h3><p>Staff·채팅 전용 계정 및 IsoMap Editor 계정 운영을 위해 로그인 ID, 내부 계정 식별자, 닉네임, 권한·활성화 상태, 비밀번호 해시 또는 인증정보, 세션 토큰 해시와 만료시각 등 필요한 기술정보를 처리할 수 있습니다.</p><p><strong>이용 목적:</strong> 인증, 계정·권한 관리, Staff 기능·채팅·맵 편집 서비스 제공, 부정 이용 방지, 보안 및 장애 대응</p><p class=\"subtle\">비밀번호 원문과 세션 토큰 원문은 사이트 데이터베이스에 평문으로 저장하지 않습니다.</p>\n<h3>2) 채팅</h3><p>채팅 메시지, 작성자 닉네임·계정 식별정보, 작성 시각, 방 참가·초대·퇴장 기록, 읽음 상태, 반응, 첨부파일, 푸시 알림 토큰·Firebase Installation ID 등을 처리할 수 있습니다. 신고가 접수되면 처리를 위해 필요한 범위의 신고 대상 메시지와 제한된 전후 문맥을 확인할 수 있습니다.</p><p>관리자는 일반적인 운영 목적으로 자신이 참가하지 않은 비공개 채팅방을 임의로 열람하지 않습니다.</p>\n<h3>3) 채팅 번역</h3><p>이용자가 번역 기능을 사용할 때 <strong>번역 대상 메시지 본문</strong>이 OpenAI API로 전송됩니다. 계정 비밀번호나 전체 채팅방 기록은 번역 요청에 포함하지 않으며, 번역 결과는 기능 제공을 위해 캐시될 수 있습니다.</p>\n<h3>4) 문의·신고</h3><p>문의·신고 내용, 처리에 필요한 닉네임 등 정보, 선택적으로 제공한 이메일·Discord·Telegram·Kakao Open Profile·LINE 등의 연락정보, 필요한 첨부·증거자료를 처리할 수 있습니다. 연락정보 제공은 선택사항입니다.</p>\n<h3>5) 이미지·파일 업로드</h3><p>업로드한 이미지·파일, 업로드 시각, 관리에 필요한 기술정보와 부정 이용 방지를 위한 IP 기반 해시 등이 생성되는 경우 해당 정보를 처리할 수 있습니다.</p>\n<h3>6) 게임 내 신청·취합 기능</h3><p>게임 닉네임, 연맹 등 소속정보, 신청 내용, 병력·수량 등 이용자가 입력한 게임 관련 정보와 신청·수정 시각을 처리합니다. “공동구매”는 S967이 상품 또는 게임 아이템을 판매하거나 결제를 중개한다는 의미가 아니며, 참여자가 각자 직접 구매할 항목을 편의상 취합하는 기능입니다.</p>\n<h3>7) Staff 이메일</h3><p>Staff는 업무 알림용 이메일을 선택적으로 등록할 수 있습니다. Staff는 본인이 등록한 이메일을 조회·추가·수정·삭제할 수 있으며, 관리자는 서비스 운영·계정 관리 목적으로 Staff가 등록한 이메일을 조회하고 필요한 경우 수정, 활성화/비활성화 또는 삭제할 수 있습니다. 삭제된 수신자 정보는 S967 DB에서 즉시 삭제하며 비활성 데이터로 별도 보관하지 않습니다.</p>\n<h3>8) IsoMap Editor</h3><p>Map Editor 로그인 ID, 내부 계정 식별자, 비밀번호 해시, 세션 인증정보, 저장 맵의 이름·문서 데이터·생성/수정 시각, 공유 시 공유코드·공유 스냅샷·갱신 시각을 처리합니다.</p></section>\n<section class=\"section\"><h2>2. 개인정보의 보유 및 이용기간</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>정보</th><th>보유·삭제 기준</th></tr></thead><tbody>\n<tr><td>문의 시 선택적으로 제공한 연락정보</td><td>접수 후 <strong>1개월을 기준으로 정기적으로 삭제</strong></td></tr>\n<tr><td>Staff가 등록한 이메일 주소</td><td>등록 중 보유, 삭제 시 <strong>S967 DB에서 즉시 삭제</strong></td></tr>\n<tr><td>푸시 알림 토큰</td><td>알림 해제 또는 계정 탈퇴 시 <strong>즉시 삭제</strong></td></tr>\n<tr><td>신고 자료</td><td>원칙적으로 접수 후 <strong>90일을 기준으로 정기 삭제</strong>. 실제 분쟁·법적 보존 필요 시 예외</td></tr>\n<tr><td>탈퇴자가 작성한 채팅 기록</td><td>계정 연결 해제 후 <strong>최대 3년을 기준으로 정기 삭제</strong>. 법적 보존 필요 시 예외</td></tr>\n<tr><td>IsoMap Editor 계정</td><td>마지막 성공 로그인 후 <strong>6개월을 기준으로 정기적으로 삭제</strong></td></tr>\n<tr><td>Iso 저장 맵</td><td>마지막 수정 후 <strong>6개월을 기준으로 정기적으로 삭제</strong></td></tr>\n<tr><td>Iso 공유 맵 스냅샷</td><td>마지막 공유 생성·갱신 후 <strong>6개월을 기준으로 정기적으로 삭제</strong></td></tr>\n<tr><td>실제 분쟁·법적 절차에 필요한 정보</td><td>해당 절차 종료 시까지 필요한 최소 범위</td></tr>\n</tbody></table></div><p class=\"policy-note\">정기 삭제 작업은 일정 주기로 실행되므로 기준 시점이 지난 직후가 아니라 다음 정기 삭제 시점에 처리될 수 있습니다.</p></section>\n<section class=\"section\"><h2>3. 계정 탈퇴 및 채팅 기록</h2><p>Staff 또는 채팅 계정이 삭제되면 로그인 권한을 제거하고 기존 채팅 작성자 정보에서 현재 계정과 직접 연결되는 식별정보를 제거합니다. 작성자는 “탈퇴한 사용자”와 같은 표시로 전환될 수 있습니다.</p><p>메시지 본문 자체에 이름·연락처 등 개인정보가 포함되어 있다면 계정 연결 제거 후에도 완전한 익명정보가 아닐 수 있습니다. 실제 분쟁 또는 법적 절차가 진행 중인 경우 필요한 최소 범위의 자료는 자동 삭제를 일시 보류할 수 있습니다.</p></section>\n<section class=\"section\"><h2>4. 개인정보의 파기</h2><p>개인정보가 불필요해진 경우 삭제하거나 계정과의 연결을 제거합니다. 법령 또는 실제 분쟁 대응을 위해 보존이 필요한 경우 필요한 범위와 기간으로 제한합니다.</p></section>\n<section class=\"section\"><h2>5. 개인정보 처리 위탁 및 외부 서비스</h2><h3>Supabase, Inc.</h3><p>인증, 데이터베이스, 파일 저장, 서버 기능 및 서비스 데이터 처리에 사용합니다. S967의 Supabase 프로젝트 데이터베이스는 <strong>싱가포르(ap-southeast-1)</strong> 리전을 사용합니다.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>푸시 알림 제공을 위해 Firebase Installation ID 등 기술정보를 처리할 수 있습니다.</p><h3>Plus Five Five, Inc. / Resend</h3><p>운영 이메일 발송을 위해 수신 이메일 주소, 이메일 메타데이터 및 이메일에 포함되는 문의·신청·신고 정보를 처리할 수 있습니다.</p><h3>OpenAI API</h3><p>이용자가 요청한 채팅 번역을 위해 번역 대상 메시지 본문과 API 처리에 필요한 기술정보가 전송될 수 있습니다.</p></section>\n<section class=\"section\"><h2>6. 개인정보의 국외 이전</h2><p>Supabase(주요 저장지역: 싱가포르), Google/Firebase, Resend(미국), OpenAI 등 외부 서비스 이용 과정에서 필요한 정보가 암호화된 네트워크를 통해 국외의 해당 서비스 인프라로 전송될 수 있습니다. 보유기간은 S967의 각 보유 기준과 해당 서비스 제공자의 정책에 따릅니다.</p><p>선택 기능에 따른 국외 이전을 원하지 않는 경우 해당 기능을 사용하지 않을 수 있습니다. 핵심 인프라에 해당하는 경우 이전을 거부하면 일부 기능 이용이 어려울 수 있습니다.</p></section>\n<section class=\"section\"><h2>7. 개인정보의 제3자 제공</h2><p>사이트는 이용자의 개인정보를 판매하지 않으며, 원칙적으로 수집·이용 목적을 벗어나 임의로 제3자에게 제공하지 않습니다. 다만 이용자의 별도 동의, 법률의 특별한 규정 또는 적법한 관계기관의 요청이 있는 경우 예외가 적용될 수 있습니다.</p></section>\n<section class=\"section\"><h2>8. 이용자의 권리</h2><p>이용자는 관련 법령의 범위에서 개인정보 열람, 정정, 삭제, 처리정지, 계정 탈퇴 및 이의 제기를 요청할 수 있습니다. Staff는 자신의 업무 알림 이메일을 직접 관리할 수 있습니다.</p></section>\n<section class=\"section\"><h2>9. 개인정보 보호 및 접근통제</h2><p>사이트는 권한 분리, 관리자 기능 접근 제한, HTTPS, 서버 비밀키의 클라이언트 비공개, 데이터베이스·비공개 파일 접근 제한, 비공개 채팅 접근 제한, 정기 삭제 등 필요한 보호조치를 적용합니다.</p></section>\n<section class=\"section\"><h2>10. 브라우저에 저장되는 정보</h2><p>로그인·인증 상태, 언어·테마 설정 및 서비스 이용에 필요한 설정정보를 브라우저 저장공간에 저장할 수 있습니다. IsoMap Editor는 저장되지 않은 편집 내용을 복구하기 위해 IndexedDB에 자동복구 스냅샷을 저장할 수 있으며, 이 데이터는 이용자의 기기에 저장됩니다.</p></section>\n<section class=\"section\"><h2>11. 만 14세 미만 이용자</h2><p>사이트는 만 14세 미만 아동의 개인정보를 법정대리인의 동의 없이 적극적으로 수집하는 것을 목적으로 운영하지 않습니다.</p></section>\n<section class=\"section\"><h2>12. 개인정보 보호 관련 문의</h2><p>열람·정정·삭제, 계정 탈퇴 및 기타 개인정보 관련 요청은 아래로 문의할 수 있습니다.</p><p><strong>운영자:</strong> S967 운영자</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section>\n<section class=\"section\"><h2>13. 개인정보 처리방침의 변경</h2><p>처리 방법, 외부 서비스, 보유기간 등이 변경되어 본 방침을 수정하는 경우 사이트를 통해 변경 내용을 공개합니다.</p><p><strong>시행일: 2026년 8월 14일</strong></p></section><footer>S967 · Privacy Policy</footer>", "en": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>Privacy Policy</h1><div class=\"effective-date\">Effective date: August 14, 2026</div></header>\n<section class=\"intro\">S967 (“the Site”) values users’ privacy and complies with applicable laws. The Site processes personal information only as necessary to provide and operate its services, and deletes or de-identifies information when its purpose has been fulfilled or the applicable retention period has passed.</section>\n<section class=\"section\"><h2>1. Personal information processed and purposes of use</h2>\n<h3>1) Accounts and authentication</h3><p>For Staff accounts, chat-only accounts, and IsoMap Editor accounts, the Site may process login IDs, internal account identifiers, nicknames, permissions and activation status, password hashes or other authentication information, and technical session information such as hashed session tokens and expiration times.</p><p><strong>Purpose:</strong> authentication, account and permission management, Staff features, chat and map editing services, abuse prevention, security, and troubleshooting</p><p class=\"subtle\">Plain-text passwords and raw session tokens are not stored in the Site database.</p>\n<h3>2) Chat</h3><p>The Site may process chat messages, author nicknames and account identifiers, timestamps, room participation/invitation/leave records, read state, reactions, attachments, push notification tokens, and Firebase Installation IDs. When a report is submitted, the reported message and limited surrounding context necessary for review may be accessed.</p><p>Administrators do not routinely open private rooms they do not participate in for general operational purposes.</p>\n<h3>3) Chat translation</h3><p>When a user requests translation, the <strong>body of the message to be translated</strong> is sent to the OpenAI API. Account passwords and the full history of a chat room are not included in the translation request. Translation results may be cached to provide the feature.</p>\n<h3>4) Inquiries and reports</h3><p>The Site may process inquiry/report content, nicknames or other information needed to handle the matter, optional contact information such as email, Discord, Telegram, Kakao Open Profile, or LINE, and necessary attachments or evidence. Contact information is optional.</p>\n<h3>5) Image and file uploads</h3><p>The Site may process uploaded images/files, upload timestamps, technical information needed to manage uploads, and, where generated for abuse prevention, identifiers such as IP-based hashes.</p>\n<h3>6) In-game applications and aggregation</h3><p>The Site processes game nicknames, alliance or other in-game affiliation, application details, troop/quantity information entered by the user, and submission/update times. “Group Buy” does not mean that S967 sells products or game items or intermediates payment; it is a convenience feature that aggregates items participants intend to purchase directly through their own game accounts.</p>\n<h3>7) Staff email</h3><p>Staff may optionally register email addresses for work notifications. Staff can view, add, edit, and delete their own registered addresses. For service operation and account management, the administrator can view Staff-registered addresses and, when necessary, edit, activate/deactivate, or delete them. Deleted recipient records are immediately removed from the S967 database and are not separately retained as inactive data.</p>\n<h3>8) IsoMap Editor</h3><p>The Site processes Map Editor login IDs, internal account identifiers, password hashes, session authentication information, saved map names/document data/creation and update times, and, when sharing is used, share codes, shared snapshots, and update times.</p></section>\n<section class=\"section\"><h2>2. Retention periods</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>Information</th><th>Retention / deletion standard</th></tr></thead><tbody>\n<tr><td>Optional contact information submitted with an inquiry</td><td>Periodically deleted based on <strong>1 month after receipt</strong></td></tr>\n<tr><td>Staff email address</td><td>Retained while registered; <strong>immediately deleted from the S967 DB</strong> when deleted</td></tr>\n<tr><td>Push notification token</td><td><strong>Immediately deleted</strong> when notifications are disabled or the account is withdrawn</td></tr>\n<tr><td>Report records/evidence</td><td>Normally periodically deleted based on <strong>90 days after receipt</strong>; exception for an actual dispute or legal preservation need</td></tr>\n<tr><td>Chat records written by a withdrawn user</td><td>Unlinked from the account, then periodically deleted based on a <strong>maximum of 3 years</strong>; legal-preservation exception may apply</td></tr>\n<tr><td>IsoMap Editor account</td><td>Periodically deleted based on <strong>6 months after the last successful login</strong></td></tr>\n<tr><td>Iso saved map</td><td>Periodically deleted based on <strong>6 months after the last update</strong></td></tr>\n<tr><td>Iso shared map snapshot</td><td>Periodically deleted based on <strong>6 months after the last share creation/update</strong></td></tr>\n<tr><td>Information required for an actual dispute or legal process</td><td>Minimum necessary scope until the relevant process ends</td></tr>\n</tbody></table></div><p class=\"policy-note\">Periodic cleanup runs on a schedule, so deletion may occur at the next scheduled cleanup rather than immediately when the reference period passes.</p></section>\n<section class=\"section\"><h2>3. Account withdrawal and chat records</h2><p>When a Staff or chat account is deleted, service access is removed and author identifiers directly linking existing chat records to the current account are removed. The author may be displayed as “Deleted User” or a similar label.</p><p>If the message body itself contains names, contact details, or other personal information, removing the account link does not necessarily make that content fully anonymous. Where an actual dispute or legal process is pending, automatic deletion of the minimum necessary records may be temporarily suspended.</p></section>\n<section class=\"section\"><h2>4. Destruction of personal information</h2><p>When personal information is no longer necessary, the Site deletes it or removes its link to an account. Where retention is required by law or for an actual dispute, processing is limited to the necessary scope and period.</p></section>\n<section class=\"section\"><h2>5. Service providers and external services</h2><h3>Supabase, Inc.</h3><p>Used for authentication, database, file storage, server functions, and service data processing. The S967 Supabase project database uses the <strong>Singapore (ap-southeast-1)</strong> region.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>Firebase Installation ID and related technical information may be processed to provide push notifications.</p><h3>Plus Five Five, Inc. / Resend</h3><p>Recipient email addresses, email metadata, and inquiry/application/report information included in emails may be processed for operational email delivery.</p><h3>OpenAI API</h3><p>The message body submitted for translation and technical information required for the API request may be transmitted when a user requests chat translation.</p></section>\n<section class=\"section\"><h2>6. Overseas transfer</h2><p>When using external services such as Supabase (main storage region: Singapore), Google/Firebase, Resend (United States), and OpenAI, necessary information may be transmitted through encrypted networks to the relevant overseas service infrastructure. Retention follows S967’s applicable standards and the provider’s policies.</p><p>Users who do not want an overseas transfer associated with an optional feature can refrain from using that feature. If a transfer relates to core service infrastructure, refusing it may make some features unavailable.</p></section>\n<section class=\"section\"><h2>7. Third-party disclosure</h2><p>The Site does not sell users’ personal information and, in principle, does not disclose it to third parties outside the stated purposes. Exceptions may apply with separate user consent, where specifically provided by law, or where necessary to comply with a lawful request from a competent authority.</p></section>\n<section class=\"section\"><h2>8. User rights</h2><p>Within the scope provided by applicable law, users may request access, correction, deletion, suspension of processing, account withdrawal, and review of objections. Staff can directly manage their own operational email recipients.</p></section>\n<section class=\"section\"><h2>9. Security and access control</h2><p>The Site applies measures such as permission separation, restricted administrator functions, HTTPS, keeping server secrets out of client code, restricted database/private-file access, limits on private-chat access, and periodic deletion of unnecessary information.</p></section>\n<section class=\"section\"><h2>10. Information stored in the browser</h2><p>The Site may store login/authentication state, language/theme settings, and other settings needed for service use in browser storage. IsoMap Editor may store recovery snapshots for unsaved edits in IndexedDB on the user’s device.</p></section>\n<section class=\"section\"><h2>11. Users under 14</h2><p>The Site is not operated for the purpose of actively collecting personal information from children under 14 without consent required by applicable law.</p></section>\n<section class=\"section\"><h2>12. Privacy inquiries</h2><p>Requests concerning access, correction, deletion, account withdrawal, or other privacy matters may be sent to the contact below.</p><p><strong>Operator:</strong> S967 Operator</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section>\n<section class=\"section\"><h2>13. Changes to this policy</h2><p>If processing methods, external services, retention periods, or other relevant matters change, updates to this policy will be published through the Site.</p><p><strong>Effective date: August 14, 2026</strong></p></section><footer>S967 · Privacy Policy</footer>", "ja": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>プライバシーポリシー</h1><div class=\"effective-date\">施行日：2026年8月14日</div></header>\n<section class=\"intro\">S967（以下「本サイト」）は、利用者の個人情報を重要に取り扱い、適用される法令を遵守します。本サイトはサービスの提供・運営に必要な範囲で個人情報を処理し、利用目的が達成された場合、または定めた保存期間を経過した場合に削除または識別情報との関連を解除します。</section>\n<section class=\"section\"><h2>1. 処理する個人情報と利用目的</h2>\n<h3>1) アカウント・認証</h3><p>Staff、チャット専用アカウント、IsoMap Editorアカウントの運営のため、ログインID、内部アカウント識別子、ニックネーム、権限・有効状態、パスワードハッシュ等の認証情報、セッショントークンのハッシュや有効期限などの技術情報を処理する場合があります。</p><p><strong>利用目的：</strong>本人認証、アカウント・権限管理、Staff機能、チャット、マップ編集サービス、不正利用防止、セキュリティおよび障害対応</p><p class=\"subtle\">パスワードの平文およびセッショントークンの原文は、本サイトのデータベースに平文で保存しません。</p>\n<h3>2) チャット</h3><p>チャットメッセージ、投稿者のニックネーム・アカウント識別情報、投稿時刻、ルーム参加・招待・退出記録、既読状態、リアクション、添付ファイル、プッシュ通知トークン、Firebase Installation ID等を処理する場合があります。通報がある場合は、処理に必要な対象メッセージと限定された前後文脈を確認できます。</p><p>管理者は通常の運営目的で、自身が参加していない非公開ルームを任意に閲覧しません。</p>\n<h3>3) チャット翻訳</h3><p>利用者が翻訳機能を使用した場合、<strong>翻訳対象メッセージの本文</strong>がOpenAI APIへ送信されます。アカウントのパスワードやチャットルーム全体の履歴は翻訳リクエストに含めません。翻訳結果は機能提供のためキャッシュされる場合があります。</p>\n<h3>4) お問い合わせ・通報</h3><p>お問い合わせ・通報内容、処理に必要なニックネーム等、任意提供のメール・Discord・Telegram・Kakao Open Profile・LINE等の連絡先、必要な添付・証拠資料を処理する場合があります。連絡先の提供は任意です。</p>\n<h3>5) 画像・ファイルアップロード</h3><p>アップロードした画像・ファイル、アップロード時刻、管理に必要な技術情報、不正利用防止のためIPベースのハッシュ等が生成される場合はその情報を処理することがあります。</p>\n<h3>6) ゲーム内申請・集計</h3><p>ゲーム内ニックネーム、同盟などの所属、申請内容、兵力・数量など利用者が入力したゲーム関連情報、申請・更新時刻を処理します。「Group Buy」はS967が商品・ゲームアイテムを販売したり決済を仲介したりする意味ではなく、参加者が各自のゲームアカウントで直接購入する予定の項目を集計する機能です。</p>\n<h3>7) Staffメール</h3><p>Staffは業務通知用メールを任意で登録できます。Staffは自分が登録したメールを閲覧・追加・編集・削除できます。サービス運営・アカウント管理のため、管理者もStaffが登録したメールを閲覧し、必要に応じて編集、有効化・無効化、削除できます。削除された受信者情報はS967 DBから直ちに削除され、無効データとして別途保存しません。</p>\n<h3>8) IsoMap Editor</h3><p>Map EditorのログインID、内部アカウント識別子、パスワードハッシュ、セッション認証情報、保存マップの名称・文書データ・作成/更新時刻、共有時の共有コード・共有スナップショット・更新時刻を処理します。</p></section>\n<section class=\"section\"><h2>2. 保存期間</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>情報</th><th>保存・削除基準</th></tr></thead><tbody>\n<tr><td>お問い合わせ時に任意提供された連絡先</td><td>受付後<strong>1か月を基準に定期削除</strong></td></tr>\n<tr><td>Staffが登録したメールアドレス</td><td>登録中保存、削除時に<strong>S967 DBから即時削除</strong></td></tr>\n<tr><td>プッシュ通知トークン</td><td>通知解除または退会時に<strong>即時削除</strong></td></tr>\n<tr><td>通報資料</td><td>原則として受付後<strong>90日を基準に定期削除</strong>。実際の紛争・法的保存が必要な場合は例外</td></tr>\n<tr><td>退会者が作成したチャット記録</td><td>アカウントとの関連を解除後、<strong>最大3年を基準に定期削除</strong>。法的保存の例外あり</td></tr>\n<tr><td>IsoMap Editorアカウント</td><td>最終ログイン成功後<strong>6か月を基準に定期削除</strong></td></tr>\n<tr><td>Iso保存マップ</td><td>最終更新後<strong>6か月を基準に定期削除</strong></td></tr>\n<tr><td>Iso共有マップスナップショット</td><td>最終共有作成・更新後<strong>6か月を基準に定期削除</strong></td></tr>\n<tr><td>実際の紛争・法的手続に必要な情報</td><td>当該手続終了まで必要最小限</td></tr>\n</tbody></table></div><p class=\"policy-note\">定期削除はスケジュールに従って実行されるため、基準時点を過ぎた直後ではなく、次回の定期削除時に処理される場合があります。</p></section>\n<section class=\"section\"><h2>3. 退会とチャット記録</h2><p>Staffまたはチャットアカウントが削除された場合、サービス利用権限を削除し、既存チャット記録から現在のアカウントに直接結びつく投稿者識別情報を除去します。投稿者は「退会したユーザー」等の表示に変更される場合があります。</p><p>本文自体に氏名・連絡先等が含まれる場合、アカウントとの関連を解除しても完全な匿名情報になるとは限りません。実際の紛争や法的手続が進行中の場合、必要最小限の資料について自動削除を一時停止できます。</p></section>\n<section class=\"section\"><h2>4. 個人情報の削除</h2><p>個人情報が不要になった場合、本サイトは削除またはアカウントとの関連解除を行います。法令または実際の紛争対応のため保存が必要な場合は、必要な範囲と期間に限定します。</p></section>\n<section class=\"section\"><h2>5. 委託先・外部サービス</h2><h3>Supabase, Inc.</h3><p>認証、データベース、ファイル保存、サーバー機能、サービスデータ処理に使用します。S967のSupabaseプロジェクトのデータベースは<strong>シンガポール（ap-southeast-1）</strong>リージョンを使用します。</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>プッシュ通知提供のためFirebase Installation ID等の技術情報を処理する場合があります。</p><h3>Plus Five Five, Inc. / Resend</h3><p>運営メール送信のため、受信メールアドレス、メールメタデータ、メールに含まれる問い合わせ・申請・通報情報を処理する場合があります。</p><h3>OpenAI API</h3><p>利用者がチャット翻訳を要求した場合、翻訳対象メッセージ本文とAPI処理に必要な技術情報が送信される場合があります。</p></section>\n<section class=\"section\"><h2>6. 国外移転</h2><p>Supabase（主な保存地域：シンガポール）、Google/Firebase、Resend（米国）、OpenAI等の外部サービス利用時、必要な情報が暗号化されたネットワークを通じて国外の関連インフラへ送信される場合があります。保存期間はS967の各基準および各提供者のポリシーに従います。</p><p>任意機能に伴う国外移転を望まない場合は、その機能を使用しないことができます。コアインフラに関する移転を拒否すると、一部機能が利用できない場合があります。</p></section>\n<section class=\"section\"><h2>7. 第三者提供</h2><p>本サイトは利用者の個人情報を販売せず、原則として明示した利用目的を超えて任意に第三者へ提供しません。利用者の別途同意、法令の特別な規定、または適法な関係機関の要請がある場合は例外となることがあります。</p></section>\n<section class=\"section\"><h2>8. 利用者の権利</h2><p>利用者は適用法令の範囲で、閲覧、訂正、削除、処理停止、退会、異議申立て等を請求できます。Staffは自身の業務通知メールを直接管理できます。</p></section>\n<section class=\"section\"><h2>9. 安全管理・アクセス制御</h2><p>本サイトは権限分離、管理者機能のアクセス制限、HTTPS、サーバー秘密情報のクライアント非公開、DB・非公開ファイルのアクセス制限、非公開チャットへのアクセス制限、不要情報の定期削除等の措置を適用します。</p></section>\n<section class=\"section\"><h2>10. ブラウザに保存される情報</h2><p>ログイン・認証状態、言語・テーマ設定、その他サービス利用に必要な設定をブラウザストレージに保存する場合があります。IsoMap Editorは未保存の編集内容を復旧するため、利用者の端末上のIndexedDBに復旧スナップショットを保存する場合があります。</p></section>\n<section class=\"section\"><h2>11. 14歳未満の利用者</h2><p>本サイトは、適用法令上必要な同意なく14歳未満の児童の個人情報を積極的に収集することを目的として運営していません。</p></section>\n<section class=\"section\"><h2>12. プライバシーに関するお問い合わせ</h2><p>閲覧・訂正・削除、退会その他の要請は以下へご連絡ください。</p><p><strong>運営者：</strong>S967 運営者</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section>\n<section class=\"section\"><h2>13. 本ポリシーの変更</h2><p>処理方法、外部サービス、保存期間等を変更して本ポリシーを改定する場合、本サイトを通じて変更内容を公開します。</p><p><strong>施行日：2026年8月14日</strong></p></section><footer>S967 · Privacy Policy</footer>", "ru": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>Политика конфиденциальности</h1><div class=\"effective-date\">Дата вступления в силу: 14 августа 2026 г.</div></header>\n<section class=\"intro\">S967 («Сайт») бережно относится к персональным данным пользователей и соблюдает применимое законодательство. Сайт обрабатывает данные только в объёме, необходимом для предоставления и работы сервисов, и удаляет либо отвязывает их от идентификаторов после достижения цели обработки или истечения установленного срока хранения.</section>\n<section class=\"section\"><h2>1. Обрабатываемые данные и цели</h2>\n<h3>1) Учётные записи и аутентификация</h3><p>Для Staff-аккаунтов, аккаунтов только для чата и IsoMap Editor могут обрабатываться логины, внутренние идентификаторы аккаунта, никнеймы, права и статус активности, хэши паролей или другие данные аутентификации, а также технические данные сессии: хэш токена и срок действия.</p><p><strong>Цель:</strong> аутентификация, управление аккаунтами и правами, функции Staff, чат и редактор карт, предотвращение злоупотреблений, безопасность и устранение неполадок</p><p class=\"subtle\">Пароли и исходные session-токены в открытом виде в базе данных Сайта не хранятся.</p>\n<h3>2) Чат</h3><p>Сайт может обрабатывать сообщения, никнейм и идентификаторы автора, время отправки, участие/приглашения/выход из комнат, статус прочтения, реакции, вложения, push-токены и Firebase Installation ID. При жалобе может быть просмотрено сообщение и ограниченный контекст, необходимый для её рассмотрения.</p><p>Администратор не просматривает произвольно закрытые комнаты, в которых не участвует, для обычных операционных целей.</p>\n<h3>3) Перевод сообщений</h3><p>При запросе перевода <strong>текст переводимого сообщения</strong> отправляется в OpenAI API. Пароль аккаунта и полная история комнаты в запрос не включаются. Результат перевода может кэшироваться для работы функции.</p>\n<h3>4) Обращения и жалобы</h3><p>Могут обрабатываться содержание обращения/жалобы, никнейм и иные необходимые сведения, добровольно предоставленные email, Discord, Telegram, Kakao Open Profile, LINE и другие контакты, а также необходимые вложения и доказательства. Контактные данные предоставляются по желанию.</p>\n<h3>5) Загрузка изображений и файлов</h3><p>Могут обрабатываться загруженные изображения/файлы, время загрузки, технические сведения для управления загрузками и, если создаются для предотвращения злоупотреблений, идентификаторы вроде хэша на основе IP.</p>\n<h3>6) Игровые заявки и сбор данных</h3><p>Обрабатываются игровой никнейм, альянс и другая игровая принадлежность, содержание заявки, сведения о войсках/количестве и время подачи/изменения. Название «Group Buy» не означает, что S967 продаёт товары или игровые предметы либо посредничает в оплате; это функция сбора сведений о покупках, которые участники совершают самостоятельно через свои игровые аккаунты.</p>\n<h3>7) Email Staff</h3><p>Staff может добровольно зарегистрировать email для рабочих уведомлений. Staff может просматривать, добавлять, изменять и удалять собственные адреса. Для работы сервиса и управления аккаунтами администратор также может видеть адреса Staff и при необходимости изменять, включать/отключать или удалять их. Удалённая запись получателя немедленно удаляется из БД S967 и отдельно как неактивные данные не хранится.</p>\n<h3>8) IsoMap Editor</h3><p>Обрабатываются логин Map Editor, внутренний идентификатор аккаунта, хэш пароля, данные аутентификации сессии, название и данные сохранённой карты, время создания/изменения, а при общем доступе — код, снимок общей карты и время обновления.</p></section>\n<section class=\"section\"><h2>2. Сроки хранения</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>Информация</th><th>Правило хранения/удаления</th></tr></thead><tbody>\n<tr><td>Необязательные контакты в обращении</td><td>Периодическое удаление по истечении <strong>1 месяца после получения</strong></td></tr>\n<tr><td>Email Staff</td><td>Хранится, пока зарегистрирован; при удалении <strong>немедленно удаляется из БД S967</strong></td></tr>\n<tr><td>Push-токен</td><td><strong>Немедленно удаляется</strong> при отключении уведомлений или удалении аккаунта</td></tr>\n<tr><td>Материалы жалобы</td><td>Обычно периодически удаляются по истечении <strong>90 дней</strong>; исключение — реальный спор или юридическая необходимость</td></tr>\n<tr><td>Чат пользователя после удаления аккаунта</td><td>Отвязывается от аккаунта и периодически удаляется исходя из <strong>максимального срока 3 года</strong>; возможно юридическое исключение</td></tr>\n<tr><td>Аккаунт IsoMap Editor</td><td>Периодическое удаление по истечении <strong>6 месяцев после последнего успешного входа</strong></td></tr>\n<tr><td>Сохранённая карта Iso</td><td>Периодическое удаление по истечении <strong>6 месяцев после последнего изменения</strong></td></tr>\n<tr><td>Снимок общей карты Iso</td><td>Периодическое удаление по истечении <strong>6 месяцев после последнего создания/обновления общего доступа</strong></td></tr>\n<tr><td>Данные для реального спора или юридической процедуры</td><td>Минимально необходимый объём до завершения процедуры</td></tr>\n</tbody></table></div><p class=\"policy-note\">Очистка выполняется по расписанию, поэтому данные могут быть удалены при следующем плановом запуске, а не в точный момент истечения контрольного срока.</p></section>\n<section class=\"section\"><h2>3. Удаление аккаунта и чат</h2><p>После удаления Staff- или чат-аккаунта доступ к сервису прекращается, а идентификаторы автора, напрямую связывающие существующие сообщения с текущим аккаунтом, удаляются. Автор может отображаться как «Удалённый пользователь» или аналогично.</p><p>Если текст сообщения сам содержит имя, контакты или иные персональные данные, удаление связи с аккаунтом не обязательно делает его полностью анонимным. При реальном споре или юридической процедуре автоматическое удаление минимально необходимых материалов может быть временно приостановлено.</p></section>\n<section class=\"section\"><h2>4. Удаление персональных данных</h2><p>Когда данные больше не нужны, Сайт удаляет их или отвязывает от аккаунта. Если хранение необходимо по закону или для реального спора, оно ограничивается необходимым объёмом и сроком.</p></section>\n<section class=\"section\"><h2>5. Внешние поставщики и сервисы</h2><h3>Supabase, Inc.</h3><p>Используется для аутентификации, базы данных, хранения файлов, серверных функций и обработки сервисных данных. База проекта S967 в Supabase использует регион <strong>Сингапур (ap-southeast-1)</strong>.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>Firebase Installation ID и связанные технические данные могут обрабатываться для push-уведомлений.</p><h3>Plus Five Five, Inc. / Resend</h3><p>Для операционных писем могут обрабатываться email получателя, метаданные письма и сведения из обращений/заявок/жалоб, включённые в письмо.</p><h3>OpenAI API</h3><p>При запросе перевода может передаваться текст переводимого сообщения и техническая информация, необходимая для API-запроса.</p></section>\n<section class=\"section\"><h2>6. Передача данных за границу</h2><p>При использовании внешних сервисов, включая Supabase (основной регион хранения — Сингапур), Google/Firebase, Resend (США) и OpenAI, необходимые данные могут передаваться по зашифрованной сети в соответствующую зарубежную инфраструктуру. Срок хранения определяется правилами S967 и политикой поставщика.</p><p>Если пользователь не хочет международной передачи, связанной с необязательной функцией, он может не использовать эту функцию. Отказ от передачи, связанной с основной инфраструктурой, может сделать часть функций недоступной.</p></section>\n<section class=\"section\"><h2>7. Передача третьим лицам</h2><p>Сайт не продаёт персональные данные и, как правило, не передаёт их третьим лицам за пределами заявленных целей. Исключения возможны при отдельном согласии пользователя, прямом требовании закона или законном запросе компетентного органа.</p></section>\n<section class=\"section\"><h2>8. Права пользователя</h2><p>В пределах применимого закона пользователь может запросить доступ, исправление, удаление, приостановку обработки, удаление аккаунта и рассмотрение возражений. Staff может самостоятельно управлять адресами рабочих уведомлений.</p></section>\n<section class=\"section\"><h2>9. Безопасность и контроль доступа</h2><p>Сайт применяет разделение прав, ограничение административных функций, HTTPS, отсутствие серверных секретов в клиентском коде, ограничения доступа к базе и закрытым файлам, ограничения доступа к закрытым чатам и плановое удаление ненужных данных.</p></section>\n<section class=\"section\"><h2>10. Данные в браузере</h2><p>Сайт может хранить в браузере состояние входа/аутентификации, язык, тему и другие настройки. IsoMap Editor может сохранять на устройстве пользователя в IndexedDB снимки восстановления несохранённых изменений.</p></section>\n<section class=\"section\"><h2>11. Пользователи младше 14 лет</h2><p>Сайт не предназначен для активного сбора персональных данных детей младше 14 лет без согласия, требуемого применимым законодательством.</p></section>\n<section class=\"section\"><h2>12. Вопросы о конфиденциальности</h2><p>Запросы о доступе, исправлении, удалении, удалении аккаунта и другие вопросы можно направить по адресу ниже.</p><p><strong>Оператор:</strong> S967</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section>\n<section class=\"section\"><h2>13. Изменения политики</h2><p>При изменении способов обработки, внешних сервисов, сроков хранения и других существенных положений обновления будут опубликованы на Сайте.</p><p><strong>Дата вступления в силу: 14 августа 2026 г.</strong></p></section><footer>S967 · Privacy Policy</footer>"};
