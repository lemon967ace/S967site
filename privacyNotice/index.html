<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>S967 개인정보 처리방침</title>

  <link
    rel="stylesheet"
    href="/theme.css"
  >

  <script
    src="/theme.js"
    defer
  ></script>

  <script
    src="/language.js"
    defer
  ></script>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--page-bg);

    /*
      Chrome on iPhone/iPad also uses WebKit.
      Fix automatic text inflation so table cells keep one scale.
    */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(
        circle at top left,
        rgba(255, 255, 255, .24),
        transparent 35%
      ),
      var(--page-bg);
    color: var(--text);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Noto Sans KR",
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    font-size: 16px;
    line-height: 1.6;
    transition:
      background-color .2s ease,
      color .2s ease;
  }

  a {
    color: inherit;
  }

  .shell {
    width: min(980px, calc(100% - 32px));
    margin: 0 auto;
    padding: 56px 0 88px;
  }

  .hero {
    margin-bottom: 24px;
  }

  .eyebrow {
    margin-bottom: 10px;
    color: var(--muted);
    font-size: .78rem;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -.045em;
  }

  .effective-date {
    margin-top: 14px;
    color: var(--muted);
    font-size: .9rem;
  }

  .intro,
  .section,
  .privacy-summary {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .intro,
  .privacy-summary {
    padding: 20px 22px;
    line-height: 1.7;
  }

  .privacy-summary {
    margin: 18px 0 22px;
  }

  .section {
    margin-top: 16px;
    padding: 22px;
  }

  h2 {
    margin: 0 0 14px;
    font-size: 1.15rem;
    line-height: 1.4;
  }

  h3 {
    margin: 20px 0 10px;
    font-size: 1rem;
    line-height: 1.5;
  }

  p {
    margin: 10px 0;
    line-height: 1.75;
  }

  ul {
    margin: 8px 0 0;
    padding-left: 1.25rem;
    line-height: 1.72;
  }

  li + li {
    margin-top: 4px;
  }

  .subtle {
    color: var(--muted);
  }

  .policy-table-wrap {
    overflow-x: auto;
    margin-top: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
    table-layout: fixed;
    background: var(--surface-strong);

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  th,
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
    line-height: 1.6;
    font-size: .88rem;

    /*
      Important on iOS Chromium/WebKit:
      do not let individual cells receive text inflation.
    */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  th {
    background: var(--surface-hover);
    font-size: .84rem;
    font-weight: 700;
  }

  th:first-child,
  td:first-child {
    width: 30%;
  }

  th:nth-child(2),
  td:nth-child(2) {
    width: 70%;
  }

  td {
    overflow-wrap: break-word;
    word-break: keep-all;
  }

  td strong {
    font-size: inherit;
    line-height: inherit;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  .policy-note {
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-hover);
    line-height: 1.65;
  }

  .contact {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-hover);
    text-decoration: none;
    overflow-wrap: anywhere;
  }

  footer {
    margin-top: 24px;
    padding: 16px 4px 0;
    color: var(--muted);
    text-align: center;
    font-size: .8rem;
    line-height: 1.6;
  }

  .top-pickers {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 1100;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .top-pickers .language-picker,
  .top-pickers .theme-picker {
    position: relative;
    top: auto;
    right: auto;
    bottom: auto;
    left: auto;
  }

  .top-pickers .language-menu,
  .top-pickers .theme-menu {
    top: auto;
    right: 0;
    bottom: calc(100% + 8px);
    left: auto;
  }

  @media (max-width: 640px) {
    .shell {
      width: calc(100% - 20px);
      padding-top: 34px;
      padding-bottom: 86px;
    }

    .intro,
    .section,
    .privacy-summary {
      border-radius: 14px;
      padding: 17px;
    }

    h1 {
      font-size: clamp(2rem, 10vw, 3rem);
    }

    .top-pickers {
      right: 14px;
      bottom: 14px;
      gap: 8px;
    }

    /*
      Do not use a 720px-wide desktop table on a ~390px phone.
      Keeping the table inside the viewport also prevents Chromium/WebKit
      from deciding that the long second column should be enlarged.
    */
    .policy-table-wrap {
      overflow-x: hidden;
    }

    table {
      min-width: 0;
      width: 100%;
      table-layout: fixed;
    }

    th,
    td {
      padding: 10px 9px;
      font-size: .82rem;
      line-height: 1.55;
    }

    th {
      font-size: .8rem;
    }

    th:first-child,
    td:first-child {
      width: 34%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 66%;
    }

    td {
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
  }

  @media (max-width: 380px) {
    .section {
      padding: 14px;
    }

    th,
    td {
      padding: 9px 7px;
      font-size: .79rem;
    }

    th {
      font-size: .77rem;
    }

    th:first-child,
    td:first-child {
      width: 36%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 64%;
    }
  }
</style>

  
</head>

<body>
  <div class="top-pickers">
    <div
      class="language-picker"
      data-language-picker
    >
      <button
        class="language-button"
        type="button"
        data-language-button
        aria-label="Language"
        aria-haspopup="true"
        aria-expanded="false"
      >
        🌐
      </button>

      <div
        class="language-menu"
        data-language-menu
        role="menu"
      >
        <button type="button" data-language-choice="ko" role="menuitemradio">
          한국어
        </button>
        <button type="button" data-language-choice="en" role="menuitemradio">
          English
        </button>
        <button type="button" data-language-choice="ja" role="menuitemradio">
          日本語
        </button>
        <button type="button" data-language-choice="ru" role="menuitemradio">
          Русский
        </button>
      </div>
    </div>

    <div
      class="theme-picker"
      data-theme-picker
    >
      <button
        class="theme-button"
        type="button"
        data-theme-button
        aria-label="Theme"
        aria-haspopup="true"
        aria-expanded="false"
      >
        ◐
      </button>

      <div
        class="theme-menu"
        data-theme-menu
        role="menu"
      >
        <button type="button" data-theme-choice="system" role="menuitemradio">
          <span class="theme-choice-icon">◐</span>
          <span data-i18n="themeSystem">System</span>
        </button>

        <button type="button" data-theme-choice="light" role="menuitemradio">
          <span class="theme-choice-icon">☀</span>
          <span data-i18n="themeLight">Light</span>
        </button>

        <button type="button" data-theme-choice="dark" role="menuitemradio">
          <span class="theme-choice-icon">☾</span>
          <span data-i18n="themeDark">Dark</span>
        </button>
      </div>
    </div>
  </div>

  <main
    id="policyRoot"
    class="shell"
  ></main>

  <script>
    (() => {
      const TITLES = {
    "ko": "S967 개인정보 처리방침",
    "en": "S967 Privacy Policy",
    "ja": "S967 プライバシーポリシー",
    "ru": "S967 Политика конфиденциальности"
      };

      const POLICY = {
    ko: `
      <header class="hero">
       <div class="eyebrow">
        S967
       </div>
       <h1>
        개인정보 처리방침
       </h1>
       <div class="effective-date">
        시행일: 2026년 8월 16일
       </div>
      </header>
      <section class="privacy-summary">
       <p>
        본 사이트에서 처리하는 개인정보의 대표적인 예는 다음과 같습니다.
       </p>
       <ul>
        <li>
         Puzzles &amp; Survival 게임 닉네임 및 게임 내 정보
        </li>
        <li>
         로그인 ID 및 비밀번호 인증정보(비밀번호는 해시 등 보호된 형태로 저장)
        </li>
        <li>
         이용자가 희망하는 경우 직접 제공한 연락정보
        </li>
       </ul>
       <p>
        이 외에도 채팅, 이미지·파일 업로드, 지도 편집 등 각 기능을 이용하는 과정에서 발생하는 기술정보가 함께 처리될 수 있으며, 자세한 항목은 아래 “1. 처리하는 개인정보와 이용 목적”에서 확인할 수 있습니다.
       </p>
       <p>
        <strong>
         다만 전화번호, 실명 등 서비스 이용에 필요하지 않은 직접적인 개인정보는 요구하지 않습니다.
        </strong>
       </p>
       <p>
        본인의 개인정보를 소중히 여기고 쉽게 공개하거나 남용하지 않는 안전한 인터넷 이용을 권장합니다.
       </p>
      </section>
      <section class="intro">
       S967(이하 “사이트”)은 이용자의 개인정보를 중요하게 생각하며 관련 법령을 준수합니다. 사이트는 서비스 제공과 운영에 필요한 범위에서 개인정보를 처리하고, 처리 목적이 달성되거나 정해진 보유기간이 지난 경우 해당 정보를 삭제하거나 계정과의 연결을 제거합니다.
      </section>
      <section class="section">
       <h2>
        1. 처리하는 개인정보와 이용 목적
       </h2>
       <h3>
        1) 계정 및 인증
       </h3>
       <p>
        Staff·채팅 전용 계정 및 IsoMap Editor 계정 운영을 위해 로그인 ID, 내부 계정 식별자, 닉네임, 권한·활성화 상태, 비밀번호 해시 또는 인증정보, 세션 토큰 해시와 만료시각 등 필요한 기술정보를 처리할 수 있습니다.
       </p>
       <p>
        <strong>
         이용 목적:
        </strong>
        인증, 계정·권한 관리, Staff 기능·채팅·맵 편집 서비스 제공, 부정 이용 방지, 보안 및 장애 대응
       </p>
       <p class="subtle">
        비밀번호 원문과 세션 토큰 원문은 사이트 데이터베이스에 평문으로 저장하지 않습니다.
       </p>
       <p>
        패스키를 등록하거나 패스키로 로그인하는 경우, 인증에 필요한 패스키 자격증명 식별자·공개키 등 관련 인증정보와 기기·인증수단에서 제공하는 필요한 기술정보가 Supabase Auth를 통해 처리될 수 있습니다. 지문·얼굴 등 생체정보 자체와 패스키의 개인키는 사이트가 수집하거나 저장하지 않으며, 이용자의 기기·브라우저·운영체제 또는 이용자가 선택한 패스키 제공자에서 관리됩니다.
       </p>
       <h3>
        2) 채팅
       </h3>
       <p>
        채팅 메시지, 작성자 닉네임·계정 식별정보, 작성 시각, 방 참가·초대·퇴장 기록, 읽음 상태, 반응, 첨부파일, 푸시 알림 토큰·Firebase Installation ID 등을 처리할 수 있습니다.
       </p>
       <p>
        이용자는 자신이 작성한 채팅 메시지를 개별적으로 삭제할 수 있으며, 삭제한 메시지는 즉시 삭제됩니다.
       </p>
       <p>
        신고가 접수되면 신고 처리를 위해 필요한 범위에서 신고 대상 메시지와 제한된 전후 문맥을 별도의 신고자료로 처리할 수 있습니다. 신고 접수 당시 확보된 신고자료는 이후 원본 채팅 메시지가 삭제되더라도 신고자료의 별도 보유·삭제 기준에 따라 처리될 수 있습니다.
       </p>
       <p>
        관리자는 일반적인 운영 목적으로 자신이 참가하지 않은 비공개 채팅방을 임의로 열람하지 않습니다.
       </p>
       <h3>
        3) 채팅 번역
       </h3>
       <p>
        채팅 참여자가 메시지 번역을 요청하면
        <strong>
         번역 대상 메시지 본문
        </strong>
        이 OpenAI API로 전송됩니다. 번역을 요청한 이용자 본인이 작성한 메시지뿐만 아니라 다른 참여자가 작성한 메시지도 번역 대상이 될 수 있습니다. 계정 비밀번호나 전체 채팅방 기록은 번역 요청에 포함하지 않습니다.
       </p>
       <p>
        번역 결과는 기능 제공을 위해 캐시될 수 있으며, 생성 후
        <strong>
         1개월을 기준으로 정기 삭제
        </strong>
        합니다. 원본 메시지와 번역 캐시는 별도로 관리될 수 있습니다.
       </p>
       <h3>
        4) 문의·신고
       </h3>
       <p>
        문의·신고 내용, 처리에 필요한 닉네임 등 정보와 이용자가 선택적으로 제공한 이메일·Discord·Telegram·Kakao Open Profile·LINE 등의 연락정보를 처리할 수 있습니다. 연락정보 제공은 선택사항입니다.
       </p>
       <p>
        문의·신고 기능에서는 이미지 또는 파일을 첨부할 수 없습니다.
       </p>
       <h3>
        5) 이미지·파일 업로드
       </h3>
       <p>
        사이트의 이미지 업로드 기능 및 채팅 첨부 기능을 통해 업로드한 이미지·문서·압축파일 등, 업로드 시각, 관리에 필요한 기술정보와 부정 이용 방지를 위한 IP 기반 해시 등이 생성되는 경우 해당 정보를 처리할 수 있습니다.
       </p>
       <p>
        IP 기반 해시는 부정 이용 방지 및 차단 기능 제공을 위해 이용할 수 있습니다.
       </p>
       <h3>
        6) 게임 내 신청·취합 기능
       </h3>
       <p>
        게임 닉네임, 연맹 등 소속정보, 신청 내용, 병력·수량 등 이용자가 입력한 게임 관련 정보와 신청·수정 시각을 처리합니다. “공동구매”는 S967이 상품 또는 게임 아이템을 판매하거나 결제를 중개한다는 의미가 아니며, 참여자가 각자 직접 구매할 항목을 편의상 취합하는 기능입니다.
       </p>
       <p>
        일부 신청정보는 운영을 위해 Excel 등의 파일로 정리되어 업무 알림을 수신하는 Staff에게 이메일로 전달될 수 있습니다.
       </p>
       <h3>
        7) Staff 이메일
       </h3>
       <p>
        Staff는 업무 알림용 이메일을 선택적으로 등록할 수 있습니다. Staff는 본인이 등록한 이메일을 조회·추가·수정·삭제할 수 있으며, 관리자는 서비스 운영·계정 관리 목적으로 Staff가 등록한 이메일을 조회하고 필요한 경우 수정, 활성화·비활성화 또는 삭제할 수 있습니다. 삭제된 수신자 정보는 S967 DB에서 즉시 삭제하며 비활성 데이터로 별도 보관하지 않습니다.
       </p>
       <h3>
        8) IsoMap Editor
       </h3>
       <p>
        Map Editor 로그인 ID, 내부 계정 식별자, 비밀번호 해시, 세션 인증정보, 저장 맵의 이름·문서 데이터·생성/수정 시각, 공유 시 공유코드·공유 스냅샷·갱신 시각을 처리합니다.
       </p>
       <h3>
        9) 색칠놀이
       </h3>
       <p>
        색칠놀이 기능 이용 시 Map Editor 계정의 내부 계정 식별자와 연결하여 사용자가 만든 색상 팔레트, 색상 이름·색상값, 구역별 색칠 상태, 색상별 기준 구역, 라벨 표시 설정, 저장 데이터의 생성·수정 시각을 처리합니다.

      <section class="section">
       <h2>
        3. 계정 탈퇴 및 채팅 기록
       </h2>
       <p>
        Staff 계정은 미로그인에 따른 자동 탈퇴 대상이 아니며, 탈퇴하려면 별도의 탈퇴 신청이 필요합니다. 탈퇴 처리 시 해당 계정정보를 삭제합니다.
       </p>
       <p>
        채팅 전용 계정은 초대 방식으로 제공되며 일반적인 공개 회원가입 절차는 없습니다. 채팅 계정은 이용자가 탈퇴하는 경우 삭제하며, 마지막 성공 로그인 후 2년간 로그인하지 않은 경우 자동으로 탈퇴 처리합니다. 다만 활성 Staff 계정은 이 자동 탈퇴 대상에서 제외합니다.
       </p>
       <p>
        채팅 계정이 삭제되면 로그인 권한을 제거하고 기존 채팅 작성자 정보에서 현재 계정과 직접 연결되는 식별정보를 즉시 제거합니다. 작성자는 “탈퇴한 사용자”와 같은 표시로 전환될 수 있습니다.
       </p>
       <p>
        계정 탈퇴 당시 남아 있는 채팅 메시지는 계정과의 연결을 제거한 뒤 원칙적으로 3년 이내 정기 삭제합니다. 다만 실제 분쟁·신고·법적 보존 대상으로 지정된 자료는 필요한 기간 동안 예외적으로 보존할 수 있습니다.
       </p>
       <p>
        이용자가 자신이 작성한 개별 채팅 메시지를 삭제하는 경우 해당 메시지는 즉시 삭제됩니다.
       </p>
       <p>
        메시지 본문 자체에 이름·연락처 등 개인정보가 포함되어 있다면 계정 연결 제거 후에도 완전한 익명정보가 아닐 수 있습니다.
       </p>
       <p>
        신고 접수 당시 별도로 확보된 신고자료는 원본 메시지와 별개로 신고자료의 보유기간에 따라 처리될 수 있습니다. 실제 분쟁 또는 법적 절차가 진행 중인 경우 필요한 최소 범위의 자료는 자동 삭제를 일시 보류할 수 있습니다.
       </p>
      </section>
      <section class="section">
       <h2>
        4. 개인정보의 파기
       </h2>
       <p>
        개인정보가 불필요해진 경우 해당 정보를 삭제하거나 계정과의 연결을 제거합니다. 이용자가 개별 채팅 메시지를 삭제하거나 즉시 삭제 대상으로 정한 정보에 삭제 사유가 발생한 경우 해당 정보는 즉시 삭제합니다.
       </p>
       <p>
        Storage에 저장된 업로드 파일이 삭제 대상이 된 경우 데이터베이스의 파일 기록뿐 아니라 Storage의 실제 파일도 함께 삭제합니다.
       </p>
       <p>
        정기 삭제 대상으로 정한 정보는 각 보유기간이 지난 후 정기적인 삭제 절차에 따라 삭제합니다. 법령 또는 실제 분쟁 대응을 위해 보존이 필요한 경우 필요한 범위와 기간으로 제한합니다.

       </h3>

        <strong>

      const root =
        document.getElementById(
          "policyRoot"
        );

      let renderedLanguage = "";

      function normalizeLanguage(value) {
        const lang = String(value || "")
          .trim()
          .toLowerCase()
          .split("-")[0];

        return POLICY[lang]
          ? lang
          : "ko";
      }

      function render(lang) {
        const target =
          normalizeLanguage(lang);

        if (
          renderedLanguage === target
        ) {
          return;
        }

        renderedLanguage = target;
        root.innerHTML = POLICY[target];

        if (
          document.documentElement.lang !==
            target
        ) {
          document.documentElement.lang =
            target;
        }

        document.title =
          TITLES[target];
      }

      function languageFromEvent(event) {
        return (
          event?.detail?.language ||
          event?.detail?.lang ||
          ""
        );
      }

      /*
       * 이 페이지는 본문 전체를 POLICY 객체에서 다시 그리므로,
       * 공용 language.js의 세부 구현이나 실행 타이밍 하나에만
       * 의존하지 않는다.
       */
      document.addEventListener(
        "click",
        (event) => {
          const target =
            event.target instanceof Element
              ? event.target
              : null;

          const choice =
            target?.closest(
              "[data-language-choice]"
            );

          if (!choice) {
            return;
          }

          const lang =
            choice.getAttribute(
              "data-language-choice"
            );

          if (lang && POLICY[lang]) {
            render(lang);
          }
        },
        true
      );

      const languageObserver =
        new MutationObserver(() => {
          const lang =
            normalizeLanguage(
              document.documentElement.lang
            );

          if (
            lang !== renderedLanguage
          ) {
            render(lang);
          }
        });

      languageObserver.observe(
        document.documentElement,
        {
          attributes: true,
          attributeFilter: ["lang"],
        }
      );

      function handleLanguageEvent(event) {
        const lang =
          languageFromEvent(event);

        if (lang) {
          render(lang);
        }
      }

      window.addEventListener(
        "languagechange",
        handleLanguageEvent
      );

      document.addEventListener(
        "languagechange",
        handleLanguageEvent
      );

      window.addEventListener(
        "languagechanged",
        handleLanguageEvent
      );

      document.addEventListener(
        "languagechanged",
        handleLanguageEvent
      );

      render(
        document.documentElement.lang ||
          "ko"
      );
    })();
  </script>
