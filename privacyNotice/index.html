<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>S967 개인정보 처리방침</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js" defer></script><script src="/language.js" defer></script><style>*{box-sizing:border-box}html{min-height:100%;background:var(--page-bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(255,255,255,.24),transparent 35%),var(--page-bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,Helvetica,Arial,sans-serif;transition:background-color .2s ease,color .2s ease}a{color:inherit}.shell{width:min(980px,calc(100% - 32px));margin:0 auto;padding:56px 0 88px}.hero{margin-bottom:24px}.eyebrow{margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.045em}.effective-date{margin-top:14px;color:var(--muted);font-size:.9rem}.intro,.section,.privacy-summary{border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.intro,.privacy-summary{padding:20px 22px;line-height:1.7}.privacy-summary{margin:18px 0 22px}.section{margin-top:16px;padding:22px}h2{margin:0 0 14px;font-size:1.15rem;line-height:1.4}h3{margin:20px 0 10px;font-size:1rem}p{margin:10px 0;line-height:1.75}ul{margin:8px 0 0;padding-left:1.25rem;line-height:1.72}li+li{margin-top:4px}.subtle{color:var(--muted)}.policy-table-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--border);border-radius:13px}table{width:100%;min-width:720px;border-collapse:collapse;background:var(--surface-strong)}th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;line-height:1.6}th{font-size:.84rem;background:var(--surface-hover)}td{font-size:.88rem}tr:last-child td{border-bottom:0}.policy-note{margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-hover);line-height:1.65}.contact{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-hover);text-decoration:none;overflow-wrap:anywhere}footer{margin-top:24px;padding:16px 4px 0;color:var(--muted);text-align:center;font-size:.8rem;line-height:1.6}.top-pickers{position:fixed;right:18px;bottom:18px;z-index:1100;display:flex;align-items:flex-end;gap:8px}.top-pickers .language-picker,.top-pickers .theme-picker{position:relative;top:auto;right:auto;bottom:auto;left:auto}.top-pickers .language-menu,.top-pickers .theme-menu{top:auto;right:0;bottom:calc(100% + 8px);left:auto}@media(max-width:640px){.shell{width:min(100% - 20px,980px);padding-top:34px;padding-bottom:86px}.intro,.section,.privacy-summary{border-radius:14px;padding:17px}h1{font-size:clamp(2rem,10vw,3rem)}.top-pickers{right:14px;bottom:14px;gap:8px}}</style></head><body><div class="top-pickers"><div class="language-picker" data-language-picker><button class="language-button" type="button" data-language-button aria-label="Language" aria-haspopup="true" aria-expanded="false">🌐</button><div class="language-menu" data-language-menu role="menu"><button type="button" data-language-choice="ko" role="menuitemradio">한국어</button><button type="button" data-language-choice="en" role="menuitemradio">English</button><button type="button" data-language-choice="ja" role="menuitemradio">日本語</button><button type="button" data-language-choice="ru" role="menuitemradio">Русский</button></div></div><div class="theme-picker" data-theme-picker><button class="theme-button" type="button" data-theme-button aria-label="Theme" aria-haspopup="true" aria-expanded="false">◐</button><div class="theme-menu" data-theme-menu role="menu"><button type="button" data-theme-choice="system" role="menuitemradio"><span class="theme-choice-icon">◐</span><span data-i18n="themeSystem">System</span></button><button type="button" data-theme-choice="light" role="menuitemradio"><span class="theme-choice-icon">☀</span><span data-i18n="themeLight">Light</span></button><button type="button" data-theme-choice="dark" role="menuitemradio"><span class="theme-choice-icon">☾</span><span data-i18n="themeDark">Dark</span></button></div></div></div><main id="policyRoot" class="shell"></main><script>(()=>{const TITLES={"ko": "S967 개인정보 처리방침", "en": "S967 Privacy Policy", "ja": "S967 プライバシーポリシー", "ru": "S967 Политика конфиденциальности"};const POLICY={"ko": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>개인정보 처리방침</h1><div class=\"effective-date\">시행일: 2026년 8월 15일</div></header><section class=\"privacy-summary\"><p>본 사이트에서 처리하는 개인정보의 대표적인 예는 다음과 같습니다.</p><ul><li>Puzzles &amp; Survival 게임 닉네임 및 게임 내 정보</li><li>로그인 ID 및 비밀번호 인증정보(비밀번호는 해시 등 보호된 형태로 저장)</li><li>이용자가 희망하는 경우 직접 제공한 연락정보</li></ul><p>이 외에도 채팅, 이미지·파일 업로드, 지도 편집 등 각 기능을 이용하는 과정에서 발생하는 기술정보가 함께 처리될 수 있으며, 자세한 항목은 아래 “1. 처리하는 개인정보와 이용 목적”에서 확인할 수 있습니다.</p><p><strong>다만 전화번호, 실명 등 서비스 이용에 필요하지 않은 직접적인 개인정보는 요구하지 않습니다.</strong></p><p>본인의 개인정보를 소중히 여기고 쉽게 공개하거나 남용하지 않는 안전한 인터넷 이용을 권장합니다.</p></section><section class=\"intro\">S967(이하 “사이트”)은 이용자의 개인정보를 중요하게 생각하며 관련 법령을 준수합니다. 사이트는 서비스 제공과 운영에 필요한 범위에서 개인정보를 처리하고, 처리 목적이 달성되거나 정해진 보유기간이 지난 경우 해당 정보를 삭제하거나 계정과의 연결을 제거합니다.</section><section class=\"section\"><h2>1. 처리하는 개인정보와 이용 목적</h2><h3>1) 계정 및 인증</h3><p>Staff·채팅 전용 계정 및 IsoMap Editor 계정 운영을 위해 로그인 ID, 내부 계정 식별자, 닉네임, 권한·활성화 상태, 비밀번호 해시 또는 인증정보, 세션 토큰 해시와 만료시각 등 필요한 기술정보를 처리할 수 있습니다.</p><p><strong>이용 목적:</strong> 인증, 계정·권한 관리, Staff 기능·채팅·맵 편집 서비스 제공, 부정 이용 방지, 보안 및 장애 대응</p><p class=\"subtle\">비밀번호 원문과 세션 토큰 원문은 사이트 데이터베이스에 평문으로 저장하지 않습니다.</p><h3>2) 채팅</h3><p>채팅 메시지, 작성자 닉네임·계정 식별정보, 작성 시각, 방 참가·초대·퇴장 기록, 읽음 상태, 반응, 첨부파일, 푸시 알림 토큰·Firebase Installation ID 등을 처리할 수 있습니다.</p><p>이용자는 자신이 작성한 채팅 메시지를 개별적으로 삭제할 수 있으며, 삭제한 메시지는 즉시 삭제됩니다.</p><p>신고가 접수되면 신고 처리를 위해 필요한 범위에서 신고 대상 메시지와 제한된 전후 문맥을 별도의 신고자료로 처리할 수 있습니다. 신고 접수 당시 확보된 신고자료는 이후 원본 채팅 메시지가 삭제되더라도 신고자료의 별도 보유·삭제 기준에 따라 처리될 수 있습니다.</p><p>관리자는 일반적인 운영 목적으로 자신이 참가하지 않은 비공개 채팅방을 임의로 열람하지 않습니다.</p><h3>3) 채팅 번역</h3><p>채팅 참여자가 메시지 번역을 요청하면 <strong>번역 대상 메시지 본문</strong>이 OpenAI API로 전송됩니다. 번역을 요청한 이용자 본인이 작성한 메시지뿐만 아니라 다른 참여자가 작성한 메시지도 번역 대상이 될 수 있습니다. 계정 비밀번호나 전체 채팅방 기록은 번역 요청에 포함하지 않습니다.</p><p>번역 결과는 기능 제공을 위해 캐시될 수 있으며, 생성 후 <strong>1개월을 기준으로 정기 삭제</strong>합니다. 원본 메시지와 번역 캐시는 별도로 관리될 수 있습니다.</p><h3>4) 문의·신고</h3><p>문의·신고 내용, 처리에 필요한 닉네임 등 정보와 이용자가 선택적으로 제공한 이메일·Discord·Telegram·Kakao Open Profile·LINE 등의 연락정보를 처리할 수 있습니다. 연락정보 제공은 선택사항입니다.</p><p>문의·신고 기능에서는 이미지 또는 파일을 첨부할 수 없습니다.</p><h3>5) 이미지·파일 업로드</h3><p>사이트의 이미지 업로드 기능 및 채팅 첨부 기능을 통해 업로드한 이미지·문서·압축파일 등, 업로드 시각, 관리에 필요한 기술정보와 부정 이용 방지를 위한 IP 기반 해시 등이 생성되는 경우 해당 정보를 처리할 수 있습니다.</p><p>IP 기반 해시는 부정 이용 방지 및 차단 기능 제공을 위해 이용할 수 있습니다.</p><h3>6) 게임 내 신청·취합 기능</h3><p>게임 닉네임, 연맹 등 소속정보, 신청 내용, 병력·수량 등 이용자가 입력한 게임 관련 정보와 신청·수정 시각을 처리합니다. “공동구매”는 S967이 상품 또는 게임 아이템을 판매하거나 결제를 중개한다는 의미가 아니며, 참여자가 각자 직접 구매할 항목을 편의상 취합하는 기능입니다.</p><p>일부 신청정보는 운영을 위해 Excel 등의 파일로 정리되어 업무 알림을 수신하는 Staff에게 이메일로 전달될 수 있습니다.</p><h3>7) Staff 이메일</h3><p>Staff는 업무 알림용 이메일을 선택적으로 등록할 수 있습니다. Staff는 본인이 등록한 이메일을 조회·추가·수정·삭제할 수 있으며, 관리자는 서비스 운영·계정 관리 목적으로 Staff가 등록한 이메일을 조회하고 필요한 경우 수정, 활성화·비활성화 또는 삭제할 수 있습니다. 삭제된 수신자 정보는 S967 DB에서 즉시 삭제하며 비활성 데이터로 별도 보관하지 않습니다.</p><h3>8) IsoMap Editor</h3><p>Map Editor 로그인 ID, 내부 계정 식별자, 비밀번호 해시, 세션 인증정보, 저장 맵의 이름·문서 데이터·생성/수정 시각, 공유 시 공유코드·공유 스냅샷·갱신 시각을 처리합니다.</p><h3>9) 색칠놀이</h3><p>색칠놀이 기능 이용 시 Map Editor 계정의 내부 계정 식별자와 연결하여 사용자가 만든 색상 팔레트, 색상 이름·색상값, 구역별 색칠 상태, 색상별 기준 구역, 라벨 표시 설정, 저장 데이터의 생성·수정 시각을 처리합니다.</p><p>색칠놀이 구역도 자체는 관리자가 제공하며, 관리자가 구역도를 교체하는 경우 이전 구역도에 연결된 모든 이용자의 색칠놀이 저장 데이터는 삭제됩니다.</p></section><section class=\"section\"><h2>2. 개인정보의 보유 및 이용기간</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>정보</th><th>보유·삭제 기준</th></tr></thead><tbody><tr><td>문의 시 선택적으로 제공한 연락정보</td><td>접수 후 <strong>1개월을 기준으로 정기 삭제</strong></td></tr><tr><td>채팅 번역 캐시</td><td>번역 결과 생성 후 <strong>1개월을 기준으로 정기 삭제</strong></td></tr><tr><td>신고 자료</td><td>원칙적으로 접수 후 <strong>90일을 기준으로 정기 삭제</strong>. 실제 분쟁·법적 보존 필요 시 예외</td></tr><tr><td>업로드 이미지·파일</td><td>업로드 후 <strong>최대 6개월 이내 삭제</strong></td></tr><tr><td>문의 내용 및 처리기록</td><td>접수 후 <strong>1년을 기준으로 정기 삭제</strong></td></tr><tr><td>일반 IP 기반 해시</td><td>마지막 관련 활동 후 <strong>1년을 기준으로 삭제</strong></td></tr><tr><td>차단 대상 IP 기반 해시</td><td>부정 이용 방지 및 재접속 차단을 위해 <strong>차단이 유지되는 동안 보관</strong></td></tr><tr><td>Staff 계정</td><td><strong>계정 탈퇴 시 삭제</strong></td></tr><tr><td>채팅 계정</td><td><strong>계정 탈퇴 시 삭제</strong>. 마지막 성공 로그인 후 <strong>2년간 로그인하지 않은 경우 자동 탈퇴 처리</strong></td></tr><tr><td>일반 채팅 메시지</td><td>계정 유지 중 보관. 이용자가 개별 메시지를 삭제하는 경우 <strong>즉시 삭제</strong></td></tr><tr><td>탈퇴자가 작성한 채팅 기록</td><td>계정 연결 제거 후 <strong>최대 3년을 기준으로 정기 삭제</strong>. 실제 분쟁·법적 보존 필요 시 예외</td></tr><tr><td>Staff가 등록한 이메일 주소</td><td>등록 중 보유, 삭제 시 <strong>S967 DB에서 즉시 삭제</strong></td></tr><tr><td>푸시 알림 토큰</td><td>알림 해제 또는 계정 탈퇴 시 <strong>즉시 삭제</strong></td></tr><tr><td>IsoMap Editor 계정</td><td>마지막 성공 로그인 후 <strong>6개월을 기준으로 정기 삭제</strong></td></tr><tr><td>Iso 저장 맵</td><td>마지막 수정 후 <strong>6개월을 기준으로 정기 삭제</strong></td></tr><tr><td>색칠놀이 저장 데이터</td><td>최초 저장(생성) 후 <strong>6개월을 기준으로 정기 삭제</strong>. 이후 수정·저장으로 보유기간이 연장되지 않으며, 관리자가 구역도를 교체하면 이전 구역도에 연결된 이용자 저장 데이터는 <strong>즉시 삭제</strong></td></tr><tr><td>Iso 공유 맵 스냅샷</td><td>마지막 공유 생성·갱신 후 <strong>6개월을 기준으로 정기 삭제</strong></td></tr><tr><td>실제 분쟁·법적 절차에 필요한 정보</td><td>해당 절차 종료 시까지 필요한 최소 범위</td></tr></tbody></table></div><p class=\"policy-note\">정기 삭제는 일정 주기로 이루어지므로 기준 시점이 지난 직후가 아니라 다음 정기 삭제 시점에 처리될 수 있습니다. 다만 위 표에서 “즉시 삭제”한다고 명시한 정보는 해당 사유가 발생하면 즉시 삭제합니다.</p></section><section class=\"section\"><h2>3. 계정 탈퇴 및 채팅 기록</h2><p>Staff 계정은 탈퇴 시 계정정보를 삭제합니다.</p><p>채팅 계정은 이용자가 탈퇴하는 경우 삭제하며, 마지막 성공 로그인 후 2년간 로그인하지 않은 계정은 자동으로 탈퇴 처리될 수 있습니다.</p><p>채팅 계정이 삭제되면 로그인 권한을 제거하고 기존 채팅 작성자 정보에서 현재 계정과 직접 연결되는 식별정보를 제거합니다. 작성자는 “탈퇴한 사용자”와 같은 표시로 전환될 수 있습니다.</p><p>계정 탈퇴 당시 남아 있는 채팅 메시지는 계정과의 연결을 제거한 후 최대 3년을 기준으로 정기 삭제합니다.</p><p>이용자가 자신이 작성한 개별 채팅 메시지를 삭제하는 경우 해당 메시지는 즉시 삭제됩니다.</p><p>메시지 본문 자체에 이름·연락처 등 개인정보가 포함되어 있다면 계정 연결 제거 후에도 완전한 익명정보가 아닐 수 있습니다.</p><p>신고 접수 당시 별도로 확보된 신고자료는 원본 메시지와 별개로 신고자료의 보유기간에 따라 처리될 수 있습니다. 실제 분쟁 또는 법적 절차가 진행 중인 경우 필요한 최소 범위의 자료는 자동 삭제를 일시 보류할 수 있습니다.</p></section><section class=\"section\"><h2>4. 개인정보의 파기</h2><p>개인정보가 불필요해진 경우 해당 정보를 삭제하거나 계정과의 연결을 제거합니다. 이용자가 개별 채팅 메시지를 삭제하거나 즉시 삭제 대상으로 정한 정보에 삭제 사유가 발생한 경우 해당 정보는 즉시 삭제합니다.</p><p>정기 삭제 대상으로 정한 정보는 각 보유기간이 지난 후 정기적인 삭제 절차에 따라 삭제합니다. 법령 또는 실제 분쟁 대응을 위해 보존이 필요한 경우 필요한 범위와 기간으로 제한합니다.</p></section><section class=\"section\"><h2>5. 개인정보 처리 위탁 및 외부 서비스</h2><p>사이트는 원활한 서비스 제공 및 운영을 위해 다음 외부 서비스를 이용합니다.</p><h3>Supabase, Inc.</h3><p>인증, 데이터베이스, 파일 저장, 서버 기능 및 서비스 데이터 처리에 사용합니다. S967의 Supabase 프로젝트 데이터베이스는 <strong>싱가포르(ap-southeast-1)</strong> 리전을 사용합니다.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>푸시 알림 제공을 위해 Firebase Installation ID, 푸시 알림 토큰 등 필요한 기술정보를 처리할 수 있습니다.</p><h3>Plus Five Five, Inc. / Resend</h3><p>업무 알림 수신을 희망하여 이메일 주소를 등록한 Staff에게 운영 이메일을 발송하기 위해 사용합니다. 이 과정에서 Staff의 수신 이메일 주소와 이메일 메타데이터뿐만 아니라 이메일 본문 또는 첨부파일에 포함되는 일반 이용자의 문의·신고 내용, 닉네임 등 관련 정보, 이용자가 선택적으로 제공한 연락정보 및 신청·취합 정보가 처리될 수 있습니다.</p><p>일부 신청정보는 Excel 등의 파일 형태로 이메일에 첨부되어 전송될 수 있습니다.</p><h3>OpenAI API</h3><p>채팅 참여자가 메시지 번역을 요청할 때 번역 대상 메시지 본문과 API 처리에 필요한 기술정보가 전송될 수 있습니다. 다른 참여자가 작성한 메시지도 번역 대상이 될 수 있습니다.</p></section><section class=\"section\"><h2>6. 개인정보의 국외 이전</h2><p>사이트는 서비스 제공 및 운영을 위해 국외에 인프라를 두거나 여러 국가에서 서비스를 제공하는 외부 서비스를 이용하며, 이에 따라 서비스 제공에 필요한 개인정보가 국외로 이전될 수 있습니다.</p><h3>Supabase, Inc.</h3><ul><li><strong>이전되는 정보:</strong> 계정·인증정보, 채팅 및 서비스 이용정보, 저장 데이터, 업로드한 이미지·파일 등 Supabase를 통해 저장·처리되는 정보</li><li><strong>이전 목적:</strong> 인증, 데이터베이스, 파일 저장, 서버 기능 및 서비스 운영</li><li><strong>주요 저장지역:</strong> 싱가포르(ap-southeast-1)</li><li><strong>이전 시기 및 방법:</strong> 서비스 이용 및 관련 정보의 저장·처리가 발생하는 때 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 각 정보의 보유·삭제 기준 및 서비스 제공자의 적용 가능한 정책에 따름</li></ul><p>S967의 Supabase 프로젝트는 싱가포르(ap-southeast-1) 리전을 사용합니다. 다만 서비스 제공에 필요한 일부 처리는 Supabase 또는 그 하위처리자가 운영하는 다른 지역의 인프라에서 이루어질 수 있습니다.</p><h3>Google LLC / Firebase Cloud Messaging</h3><ul><li><strong>이전되는 정보:</strong> 푸시 알림 토큰, Firebase Installation ID 등 푸시 알림 제공에 필요한 기술정보</li><li><strong>이전 목적:</strong> 푸시 알림 제공</li><li><strong>이전 국가·지역:</strong> Google이 관련 인프라를 운영하는 국가·지역</li><li><strong>이전 시기 및 방법:</strong> 푸시 알림 기능의 등록·이용 및 알림 처리 시 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 보유·삭제 기준 및 Google의 적용 가능한 정책에 따름</li></ul><p>Firebase Cloud Messaging은 글로벌 인프라에서 제공되는 서비스로, 처리 국가를 하나로 한정하기 어려울 수 있습니다.</p><h3>Plus Five Five, Inc. / Resend</h3><ul><li><strong>이전되는 정보:</strong> 업무 알림을 수신하는 Staff의 이메일 주소, 이메일 메타데이터, 이메일 본문에 포함되는 문의·신고 내용, 닉네임 및 이용자가 선택적으로 제공한 연락정보, 이메일 본문 또는 첨부파일에 포함되는 신청·취합 정보</li><li><strong>이전 목적:</strong> Staff 대상 업무·운영 알림 이메일 발송</li><li><strong>이전 국가:</strong> 미국</li><li><strong>이전 시기 및 방법:</strong> 운영 이메일 발송 시 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 각 정보의 보유·삭제 기준 및 Resend의 적용 가능한 정책에 따름</li></ul><p>일부 신청·취합 정보는 Excel 등의 파일로 정리되어 이메일에 첨부될 수 있습니다.</p><h3>OpenAI</h3><ul><li><strong>이전되는 정보:</strong> 번역 대상 채팅 메시지 본문 및 API 요청 처리에 필요한 기술정보</li><li><strong>이전 목적:</strong> 채팅 메시지 번역</li><li><strong>이전 국가·지역:</strong> OpenAI 및 하위처리자가 관련 인프라를 운영하는 국가·지역</li><li><strong>이전 시기 및 방법:</strong> 채팅 참여자가 메시지 번역을 요청할 때 암호화된 네트워크를 통해 API로 전송</li><li><strong>보유기간:</strong> OpenAI의 적용 가능한 API 데이터 처리 정책에 따르며, S967에 저장되는 번역 캐시는 생성 후 1개월을 기준으로 정기 삭제</li></ul><p>OpenAI API의 서비스 제공에는 여러 국가·지역의 인프라가 사용될 수 있으므로 처리 국가를 하나로 한정하기 어려울 수 있습니다.</p><h3>국외 이전을 원하지 않는 경우</h3><p>이용자는 선택 기능에 따른 국외 이전을 원하지 않는 경우 해당 기능을 이용하지 않을 수 있습니다. 다만 채팅 번역의 경우 다른 채팅 참여자가 이용자가 작성한 메시지의 번역을 요청할 수 있으므로, <strong>채팅을 이용하는 경우 자신이 작성한 메시지가 번역 처리를 위해 OpenAI API로 전송될 수 있습니다.</strong> 이를 원하지 않는 경우 채팅 기능을 이용하지 않아야 합니다.</p><p>푸시 알림에 따른 국외 이전을 원하지 않는 경우에는 푸시 알림 기능을 사용하지 않을 수 있습니다. Supabase 등 사이트의 핵심 서비스 인프라와 관련된 국외 이전은 서비스 제공에 필요하므로, 이를 원하지 않는 경우 해당 기능 또는 사이트 이용이 제한될 수 있습니다.</p></section><section class=\"section\"><h2>7. 개인정보의 제3자 제공</h2><p>사이트는 이용자의 개인정보를 판매하지 않으며, 원칙적으로 수집·이용 목적을 벗어나 임의로 제3자에게 제공하지 않습니다. 다만 이용자의 별도 동의, 법률의 특별한 규정 또는 적법한 관계기관의 요청이 있는 경우 예외가 적용될 수 있습니다.</p></section><section class=\"section\"><h2>8. 이용자의 권리</h2><p>이용자는 관련 법령의 범위에서 개인정보 열람, 정정, 삭제, 처리정지, 계정 탈퇴 및 이의 제기를 요청할 수 있습니다. 채팅 이용자는 자신이 작성한 메시지를 개별적으로 삭제할 수 있으며, Staff는 자신의 업무 알림 이메일을 직접 관리할 수 있습니다.</p></section><section class=\"section\"><h2>9. 개인정보 보호 및 접근통제</h2><p>사이트는 권한 분리, 관리자 기능 접근 제한, HTTPS, 서버 비밀키의 클라이언트 비공개, 데이터베이스·비공개 파일 접근 제한, 비공개 채팅 접근 제한, 불필요한 정보의 정기 삭제 등 필요한 보호조치를 적용합니다.</p><p>부정 이용 방지를 위해 IP 기반 해시를 이용한 접근 차단 등의 조치를 적용할 수 있습니다.</p></section><section class=\"section\"><h2>10. 브라우저에 저장되는 정보</h2><p>로그인·인증 상태, 언어·테마 설정 및 서비스 이용에 필요한 설정정보를 브라우저 저장공간에 저장할 수 있습니다. IsoMap Editor는 저장되지 않은 편집 내용을 복구하기 위해 IndexedDB에 자동복구 스냅샷을 저장할 수 있으며, 이 데이터는 이용자의 기기에 저장됩니다.</p></section><section class=\"section\"><h2>11. 만 14세 미만 이용자</h2><p>사이트는 만 14세 미만 이용자의 가입을 허용하지 않습니다. 가입 과정에서 이용자에게 본인이 만 14세 이상임을 확인하도록 요구할 수 있습니다. 사이트는 만 14세 미만 아동을 위한 법정대리인 동의 절차를 제공하지 않습니다.</p></section><section class=\"section\"><h2>12. 개인정보 보호 관련 문의</h2><p>개인정보의 열람·정정·삭제, 계정 탈퇴 및 기타 개인정보 관련 요청은 아래 개인정보 보호책임자에게 문의할 수 있습니다.</p><p><strong>개인정보 보호책임자:</strong> S967 운영자</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section><section class=\"section\"><h2>13. 개인정보 처리방침의 변경</h2><p>개인정보 처리 방법, 이용하는 외부 서비스, 보유기간 또는 기타 중요한 사항이 변경되어 본 방침을 수정하는 경우 사이트를 통해 변경 내용을 공개합니다.</p><p><strong>시행일: 2026년 8월 15일</strong></p></section><footer>S967 · Privacy Policy</footer>", "en": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>Privacy Policy</h1><div class=\"effective-date\">Effective date: August 15, 2026</div></header><section class=\"privacy-summary\"><p>Representative examples of personal information processed by this Site include:</p><ul><li>Puzzles &amp; Survival game nickname and in-game information</li><li>Login ID and password authentication information (passwords are stored only in protected forms such as hashes)</li><li>Contact information voluntarily provided by the user</li></ul><p>Additional technical information may also be processed when features such as chat, image/file uploads, and map editing are used. See “1. Personal information processed and purposes of use” below for details.</p><p><strong>The Site does not require direct personal information such as a phone number or real name unless necessary for the relevant service.</strong></p><p>Users are encouraged to protect their personal information and avoid disclosing or misusing it unnecessarily.</p></section><section class=\"intro\">S967 (“the Site”) values users’ privacy and complies with applicable laws. The Site processes personal information only as necessary to provide and operate its services, and deletes information or removes its link to an account when the processing purpose has been fulfilled or the applicable retention period has expired.</section><section class=\"section\"><h2>1. Personal information processed and purposes of use</h2><h3>1) Accounts and authentication</h3><p>For Staff accounts, chat-only accounts, and IsoMap Editor accounts, the Site may process login IDs, internal account identifiers, nicknames, permission and activation status, password hashes or other authentication information, hashed session tokens, expiration times, and other necessary technical information.</p><p><strong>Purpose:</strong> authentication, account and permission management, Staff features, chat and map-editing services, abuse prevention, security, and troubleshooting.</p><p class=\"subtle\">Plain-text passwords and raw session tokens are not stored in the Site database.</p><h3>2) Chat</h3><p>The Site may process chat messages, author nicknames and account identifiers, timestamps, room participation/invitation/leave records, read status, reactions, attachments, push notification tokens, and Firebase Installation IDs.</p><p>Users may individually delete messages they have written, and deleted messages are removed immediately.</p><p>When a report is submitted, the reported message and limited surrounding context necessary to process the report may be stored separately as report material. Report material already collected at the time of submission may continue to be processed according to its separate retention standard even if the original chat message is later deleted.</p><p>Administrators do not routinely open private chat rooms they do not participate in for general operational purposes.</p><h3>3) Chat translation</h3><p>When a chat participant requests translation of a message, the <strong>body of the message being translated</strong> is sent to the OpenAI API. A message written by another participant may also be translated. Account passwords and the full history of the chat room are not included in the translation request.</p><p>Translation results may be cached to provide the feature and are periodically deleted based on <strong>1 month after creation</strong>. Original messages and translation caches may be managed separately.</p><h3>4) Inquiries and reports</h3><p>The Site may process inquiry/report content, nicknames and other information needed to handle the matter, and optional contact information voluntarily provided by the user, such as email, Discord, Telegram, Kakao Open Profile, or LINE. Providing contact information is optional.</p><p>The inquiry/report feature does not allow image or file attachments.</p><h3>5) Image and file uploads</h3><p>The Site may process images uploaded through image-upload features and images, documents, compressed files, or other attachments uploaded through chat, as well as upload timestamps, technical information needed to manage the files, and IP-based hashes where generated for abuse prevention.</p><p>IP-based hashes may be used for abuse prevention and access blocking.</p><h3>6) In-game applications and aggregation</h3><p>The Site processes game nicknames, alliance or other in-game affiliation, application details, troop/quantity information entered by the user, and submission/update times. “Group Buy” does not mean that S967 sells products or game items or intermediates payment; it is a convenience feature that aggregates items participants intend to purchase directly themselves.</p><p>Some application information may be organized into files such as Excel spreadsheets and emailed to Staff members who receive operational notifications.</p><h3>7) Staff email</h3><p>Staff may optionally register email addresses for operational notifications. Staff can view, add, edit, and delete their own registered addresses. For service operation and account management, the administrator may also view Staff-registered addresses and, where necessary, edit, activate/deactivate, or delete them. Deleted recipient records are immediately removed from the S967 database and are not separately retained as inactive data.</p><h3>8) IsoMap Editor</h3><p>The Site processes Map Editor login IDs, internal account identifiers, password hashes, session authentication information, saved map names/document data/creation and update times, and, when sharing is used, share codes, shared snapshots, and update times.</p><h3>9) Coloring</h3><p>When the Coloring feature is used, the Site links the user’s Map Editor internal account identifier with user-created color palettes, color names and values, region-by-region coloring assignments, one base region per color, label display settings, and creation/update times of saved Coloring data.</p><p>The Coloring region board itself is provided by the administrator. When the administrator replaces the active region board, all users’ saved Coloring data associated with the previous board is deleted.</p></section><section class=\"section\"><h2>2. Retention periods</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>Information</th><th>Retention / deletion standard</th></tr></thead><tbody><tr><td>Optional contact information submitted with an inquiry</td><td>Periodically deleted based on <strong>1 month after receipt</strong></td></tr><tr><td>Chat translation cache</td><td>Periodically deleted based on <strong>1 month after creation</strong></td></tr><tr><td>Report records/evidence</td><td>Normally periodically deleted based on <strong>90 days after receipt</strong>; exception for an actual dispute or legal-preservation need</td></tr><tr><td>Uploaded images/files</td><td>Deleted within a <strong>maximum of 6 months after upload</strong></td></tr><tr><td>Inquiry content and processing records</td><td>Periodically deleted based on <strong>1 year after receipt</strong></td></tr><tr><td>General IP-based hashes</td><td>Deleted based on <strong>1 year after the last relevant activity</strong></td></tr><tr><td>Blocked IP-based hashes</td><td>Retained <strong>while the block remains in effect</strong></td></tr><tr><td>Staff account</td><td><strong>Deleted on account withdrawal</strong></td></tr><tr><td>Chat account</td><td><strong>Deleted on account withdrawal</strong>; automatically withdrawn after <strong>2 years without a successful login</strong></td></tr><tr><td>General chat messages</td><td>Retained while the account exists; <strong>immediately deleted</strong> when individually deleted by the user</td></tr><tr><td>Chat records written by a withdrawn user</td><td>Unlinked from the account, then periodically deleted based on a <strong>maximum of 3 years</strong>; exception for legal preservation</td></tr><tr><td>Staff email address</td><td>Retained while registered; <strong>immediately deleted from the S967 DB</strong> when deleted</td></tr><tr><td>Push notification token</td><td><strong>Immediately deleted</strong> when notifications are disabled or the account is withdrawn</td></tr><tr><td>IsoMap Editor account</td><td>Periodically deleted based on <strong>6 months after the last successful login</strong></td></tr><tr><td>Iso saved map</td><td>Periodically deleted based on <strong>6 months after the last update</strong></td></tr><tr><td>Coloring saved data</td><td>Periodically deleted based on <strong>6 months after the first save</strong>; later edits do not extend the period, and replacement of the region board causes <strong>immediate deletion</strong> of old-board data</td></tr><tr><td>Iso shared map snapshot</td><td>Periodically deleted based on <strong>6 months after the last share creation/update</strong></td></tr><tr><td>Information required for an actual dispute or legal process</td><td>Minimum necessary scope until the relevant process ends</td></tr></tbody></table></div><p class=\"policy-note\">Periodic deletion takes place on a schedule, so deletion may occur at the next scheduled cleanup rather than immediately after the reference period passes. Information expressly designated for immediate deletion is deleted immediately when the relevant event occurs.</p></section><section class=\"section\"><h2>3. Account withdrawal and chat records</h2><p>Staff account information is deleted when the Staff account is withdrawn.</p><p>Chat accounts are deleted when users withdraw. A chat account may also be automatically withdrawn after two years without a successful login.</p><p>When a chat account is deleted, login access is removed and identifiers directly linking existing chat authorship records to the current account are removed. The author may be displayed as “Deleted User” or a similar label.</p><p>Chat messages remaining at the time of withdrawal are unlinked from the account and periodically deleted based on a maximum period of three years.</p><p>When a user individually deletes a chat message they wrote, that message is deleted immediately.</p><p>If the message body itself contains a name, contact information, or other personal information, removing the account link does not necessarily make the content fully anonymous.</p><p>Report material separately collected at the time of a report may be processed independently of the original message according to the report-material retention standard. Where an actual dispute or legal process is pending, automatic deletion of the minimum necessary records may be temporarily suspended.</p></section><section class=\"section\"><h2>4. Destruction of personal information</h2><p>When personal information is no longer necessary, the Site deletes it or removes its link to an account. Information designated for immediate deletion is deleted immediately when the relevant event occurs.</p><p>Information subject to periodic deletion is deleted through regular deletion procedures after the relevant retention period. Where retention is required by law or for an actual dispute, processing is limited to the necessary scope and period.</p></section><section class=\"section\"><h2>5. Service providers and external services</h2><p>The Site uses the following external services for service provision and operation.</p><h3>Supabase, Inc.</h3><p>Used for authentication, databases, file storage, server functions, and service data processing. The S967 Supabase project database uses the <strong>Singapore (ap-southeast-1)</strong> region.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>Firebase Installation IDs, push notification tokens, and other technical information may be processed to provide push notifications.</p><h3>Plus Five Five, Inc. / Resend</h3><p>Used to send operational emails to Staff members who have voluntarily registered an email address for notifications. This may involve Staff recipient addresses and email metadata, as well as inquiry/report content, nicknames, optional contact information provided by ordinary users, and application/aggregation information contained in the email body or attachments.</p><p>Some application information may be attached to emails in file formats such as Excel.</p><h3>OpenAI API</h3><p>When a chat participant requests translation of a message, the message body being translated and technical information needed to process the API request may be transmitted. Messages written by other participants may also be translated.</p></section><section class=\"section\"><h2>6. Overseas transfer</h2><p>The Site uses external services that maintain infrastructure outside Korea or provide services across multiple countries. Personal information necessary to provide the service may therefore be transferred overseas.</p><h3>Supabase, Inc.</h3><ul><li><strong>Information transferred:</strong> account/authentication information, chat and service-use information, saved data, uploaded images/files, and other information stored or processed through Supabase</li><li><strong>Purpose:</strong> authentication, database operation, file storage, server functions, and service operation</li><li><strong>Primary storage region:</strong> Singapore (ap-southeast-1)</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when service use or related storage/processing occurs</li><li><strong>Retention:</strong> according to S967 retention/deletion standards and applicable provider policies</li></ul><p>The S967 Supabase project uses the Singapore (ap-southeast-1) region. Some processing may occur through infrastructure operated by Supabase or its subprocessors in other regions.</p><h3>Google LLC / Firebase Cloud Messaging</h3><ul><li><strong>Information transferred:</strong> push notification tokens, Firebase Installation IDs, and related technical information</li><li><strong>Purpose:</strong> push notification delivery</li><li><strong>Country/region:</strong> countries and regions where Google operates relevant infrastructure</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when push notifications are registered, used, or processed</li><li><strong>Retention:</strong> according to S967 standards and applicable Google policies</li></ul><p>Firebase Cloud Messaging is provided through global infrastructure, so processing may not be limited to a single country.</p><h3>Plus Five Five, Inc. / Resend</h3><ul><li><strong>Information transferred:</strong> Staff recipient email addresses, email metadata, inquiry/report content, nicknames, optional contact information, and application/aggregation information contained in email bodies or attachments</li><li><strong>Purpose:</strong> operational email delivery to Staff</li><li><strong>Country:</strong> United States</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when operational emails are sent</li><li><strong>Retention:</strong> according to S967 standards and applicable Resend policies</li></ul><p>Some application/aggregation information may be organized into files such as Excel spreadsheets and attached to emails.</p><h3>OpenAI</h3><ul><li><strong>Information transferred:</strong> body of the chat message being translated and technical information necessary to process the API request</li><li><strong>Purpose:</strong> chat-message translation</li><li><strong>Country/region:</strong> countries and regions where OpenAI and its subprocessors operate relevant infrastructure</li><li><strong>Timing/method:</strong> transmitted over encrypted networks through the API when a chat participant requests translation</li><li><strong>Retention:</strong> according to applicable OpenAI API data-processing policies; translation caches stored by S967 are periodically deleted based on 1 month after creation</li></ul><p>OpenAI API service provision may use infrastructure in multiple countries or regions, so processing may not be limited to a single country.</p><h3>If you do not want overseas transfer</h3><p>Users may choose not to use optional features that involve overseas transfer. However, for chat translation, another participant may request translation of a message you wrote. Therefore, <strong>if you use chat, a message you write may be transmitted to the OpenAI API for translation processing.</strong> If you do not want this to occur, you must not use the chat feature.</p><p>Users who do not want overseas transfer for push notifications may choose not to use push notifications. Overseas processing related to core infrastructure such as Supabase is necessary to provide the service, so refusing it may limit use of some features or the Site itself.</p></section><section class=\"section\"><h2>7. Third-party disclosure</h2><p>The Site does not sell users’ personal information and, in principle, does not disclose it to third parties outside the stated purposes. Exceptions may apply with separate user consent, where specifically provided by law, or where necessary to comply with a lawful request from a competent authority.</p></section><section class=\"section\"><h2>8. User rights</h2><p>Within the scope provided by applicable law, users may request access, correction, deletion, suspension of processing, account withdrawal, and review of objections. Chat users may individually delete messages they have written, and Staff may directly manage their own operational email addresses.</p></section><section class=\"section\"><h2>9. Security and access control</h2><p>The Site applies measures such as permission separation, restricted administrator functions, HTTPS, keeping server secrets out of client code, restricted database/private-file access, limits on private-chat access, and periodic deletion of unnecessary information.</p><p>IP-based hashes may be used for access blocking and other abuse-prevention measures.</p></section><section class=\"section\"><h2>10. Information stored in the browser</h2><p>The Site may store login/authentication state, language/theme settings, and other settings needed for service use in browser storage. IsoMap Editor may store recovery snapshots for unsaved edits in IndexedDB on the user’s device.</p></section><section class=\"section\"><h2>11. Users under 14</h2><p>The Site does not permit registration by users under 14. During registration, users may be required to confirm that they are at least 14 years old. The Site does not provide a legal-guardian consent process for children under 14.</p></section><section class=\"section\"><h2>12. Privacy inquiries</h2><p>Requests concerning access, correction, deletion, account withdrawal, or other privacy matters may be sent to the Privacy Protection Officer below.</p><p><strong>Privacy Protection Officer:</strong> S967 Operator</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section><section class=\"section\"><h2>13. Changes to this policy</h2><p>If processing methods, external services, retention periods, or other important matters change, updates to this policy will be published through the Site.</p><p><strong>Effective date: August 15, 2026</strong></p></section><footer>S967 · Privacy Policy</footer>", "ja": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>プライバシーポリシー</h1><div class=\"effective-date\">施行日：2026年8月15日</div></header><section class=\"privacy-summary\"><p>本サイトで処理する個人情報の代表例は、ゲーム内ニックネーム・ゲーム情報、ログインIDおよび保護されたパスワード認証情報、利用者が任意で提供する連絡先情報です。</p><p>このほか、チャット、画像・ファイルアップロード、マップ編集等の利用時に技術情報が処理される場合があります。詳細は以下をご確認ください。</p><p><strong>電話番号や実名など、サービス利用に不要な直接的個人情報は要求しません。</strong></p></section><section class=\"intro\">S967（以下「本サイト」）は利用者のプライバシーを重視し、適用法令を遵守します。サービス提供・運営に必要な範囲で個人情報を処理し、目的達成後または保存期間経過後に削除、またはアカウントとの関連を解除します。</section><section class=\"section\"><h2>1. 処理する個人情報と利用目的</h2><h3>1) アカウント・認証</h3><p>Staff、チャット専用アカウント、IsoMap Editorアカウントについて、ログインID、内部アカウント識別子、ニックネーム、権限・有効状態、パスワードハッシュ等の認証情報、セッショントークンのハッシュ・有効期限等を処理する場合があります。</p><p><strong>目的：</strong>認証、アカウント・権限管理、Staff機能、チャット・マップ編集、不正利用防止、セキュリティ、障害対応</p><p class=\"subtle\">平文パスワードおよび生のセッショントークンはDBに平文保存しません。</p><h3>2) チャット</h3><p>メッセージ、投稿者のニックネーム・アカウント識別情報、時刻、参加・招待・退出記録、既読状態、リアクション、添付ファイル、プッシュ通知トークン、Firebase Installation ID等を処理する場合があります。</p><p>利用者が自分のメッセージを個別削除した場合、そのメッセージは即時削除されます。</p><p>通報時には対象メッセージと必要最小限の前後文脈を別の通報資料として保存する場合があります。通報受付時に確保された資料は、元メッセージ削除後も通報資料の保存基準に従って処理される場合があります。</p><p>管理者は通常の運営目的で参加していない非公開ルームを任意に閲覧しません。</p><h3>3) チャット翻訳</h3><p>チャット参加者が翻訳を要求すると、<strong>翻訳対象メッセージ本文</strong>がOpenAI APIへ送信されます。他の参加者が作成したメッセージも翻訳対象になる場合があります。パスワードやルーム全体の履歴は含めません。</p><p>翻訳結果はキャッシュされる場合があり、生成後<strong>1か月を基準に定期削除</strong>します。元メッセージと翻訳キャッシュは別管理される場合があります。</p><h3>4) お問い合わせ・通報</h3><p>内容、ニックネーム等の処理に必要な情報、任意提供のメール・Discord・Telegram・Kakao Open Profile・LINE等を処理する場合があります。連絡先提供は任意です。</p><p>お問い合わせ・通報機能では画像・ファイルを添付できません。</p><h3>5) 画像・ファイルアップロード</h3><p>画像アップロード機能およびチャット添付機能でアップロードされた画像、文書、圧縮ファイル等、時刻、管理用技術情報、不正利用防止のためのIPベースハッシュ等を処理する場合があります。</p><p>IPベースハッシュは不正利用防止・アクセス遮断に利用する場合があります。</p><h3>6) ゲーム内申請・集計</h3><p>ゲームニックネーム、同盟等の所属、申請内容、兵力・数量、申請・更新時刻を処理します。「Group Buy」は販売や決済仲介ではなく、各参加者が直接購入する項目を集計する機能です。</p><p>一部申請情報はExcel等に整理し、業務通知を受信するStaffへメール送信する場合があります。</p><h3>7) Staffメール</h3><p>Staffは業務通知用メールを任意登録できます。本人および管理者は運営・アカウント管理に必要な範囲で閲覧・追加・編集・有効化/無効化・削除できます。削除された受信者情報はS967 DBから即時削除し、無効データとして別途保存しません。</p><h3>8) IsoMap Editor</h3><p>ログインID、内部識別子、パスワードハッシュ、セッション認証情報、保存マップ名・文書データ・作成/更新時刻、共有コード・共有スナップショット・更新時刻を処理します。</p><h3>9) 塗り絵</h3><p>Map Editor内部識別子と関連付けて、パレット、色名・色値、地域別状態、色ごとの基準地域、ラベル設定、作成・更新時刻を処理します。管理者が地域ボードを交換した場合、旧ボードに紐づく保存データは削除されます。</p></section><section class=\"section\"><h2>2. 保存期間</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>情報</th><th>保存・削除基準</th></tr></thead><tbody><tr><td>Optional contact information submitted with an inquiry</td><td>Periodically deleted based on <strong>1 month after receipt</strong></td></tr><tr><td>Chat translation cache</td><td>Periodically deleted based on <strong>1 month after creation</strong></td></tr><tr><td>Report records/evidence</td><td>Normally periodically deleted based on <strong>90 days after receipt</strong>; exception for an actual dispute or legal-preservation need</td></tr><tr><td>Uploaded images/files</td><td>Deleted within a <strong>maximum of 6 months after upload</strong></td></tr><tr><td>Inquiry content and processing records</td><td>Periodically deleted based on <strong>1 year after receipt</strong></td></tr><tr><td>General IP-based hashes</td><td>Deleted based on <strong>1 year after the last relevant activity</strong></td></tr><tr><td>Blocked IP-based hashes</td><td>Retained <strong>while the block remains in effect</strong></td></tr><tr><td>Staff account</td><td><strong>Deleted on account withdrawal</strong></td></tr><tr><td>Chat account</td><td><strong>Deleted on account withdrawal</strong>; automatically withdrawn after <strong>2 years without a successful login</strong></td></tr><tr><td>General chat messages</td><td>Retained while the account exists; <strong>immediately deleted</strong> when individually deleted by the user</td></tr><tr><td>Chat records written by a withdrawn user</td><td>Unlinked from the account, then periodically deleted based on a <strong>maximum of 3 years</strong>; exception for legal preservation</td></tr><tr><td>Staff email address</td><td>Retained while registered; <strong>immediately deleted from the S967 DB</strong> when deleted</td></tr><tr><td>Push notification token</td><td><strong>Immediately deleted</strong> when notifications are disabled or the account is withdrawn</td></tr><tr><td>IsoMap Editor account</td><td>Periodically deleted based on <strong>6 months after the last successful login</strong></td></tr><tr><td>Iso saved map</td><td>Periodically deleted based on <strong>6 months after the last update</strong></td></tr><tr><td>Coloring saved data</td><td>Periodically deleted based on <strong>6 months after the first save</strong>; later edits do not extend the period, and replacement of the region board causes <strong>immediate deletion</strong> of old-board data</td></tr><tr><td>Iso shared map snapshot</td><td>Periodically deleted based on <strong>6 months after the last share creation/update</strong></td></tr><tr><td>情報 required for an actual dispute or legal process</td><td>Minimum necessary scope until the relevant process ends</td></tr></tbody></table></div><p class=\"policy-note\">Periodic deletion takes place on a schedule, so deletion may occur at the next scheduled cleanup rather than immediately after the reference period passes. 情報 expressly designated for immediate deletion is deleted immediately when the relevant event occurs.</p></section><section class=\"section\"><h2>3. 退会とチャット記録</h2><p>Staffアカウントは退会時に削除します。チャットアカウントも退会時に削除し、最終ログイン成功後2年間ログインがない場合は自動退会処理される場合があります。</p><p>チャットアカウント削除時はログイン権限を削除し、既存投稿から現アカウントへ直接結びつく識別情報を除去します。投稿者は「退会したユーザー」等と表示される場合があります。</p><p>退会時に残るメッセージはアカウントとの関連解除後、最大3年を基準に定期削除します。利用者が個別削除したメッセージは即時削除します。</p><p>本文自体に氏名・連絡先等が含まれる場合、関連解除後も完全な匿名情報とは限りません。通報資料は元メッセージとは別の保存基準で処理され、実際の紛争・法的手続中は必要最小限の資料の削除を一時停止できます。</p></section><section class=\"section\"><h2>4. 個人情報の削除</h2><p>不要になった個人情報は削除またはアカウントとの関連を解除します。即時削除対象は該当事由発生時に直ちに削除し、定期削除対象は各保存期間経過後に削除します。法令または実際の紛争対応で必要な場合は必要な範囲と期間に限定します。</p></section><section class=\"section\"><h2>5. 委託先・外部サービス</h2><h3>Supabase, Inc.</h3><p>認証、DB、ファイル保存、サーバー機能、サービスデータ処理に使用し、S967 DBは<strong>シンガポール（ap-southeast-1）</strong>リージョンを使用します。</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>プッシュ通知のためFirebase Installation ID、通知トークン等を処理する場合があります。</p><h3>Plus Five Five, Inc. / Resend</h3><p>業務通知を希望してメールを登録したStaffへの運営メール送信に利用します。Staffの受信メール・メタデータのほか、メール本文または添付に含まれる一般利用者のお問い合わせ・通報内容、ニックネーム、任意連絡先、申請・集計情報が処理される場合があります。一部申請情報はExcel等で添付されます。</p><h3>OpenAI API</h3><p>チャット参加者が翻訳を要求した際、翻訳対象本文と必要な技術情報が送信される場合があります。他参加者のメッセージも対象になり得ます。</p></section><section class=\"section\"><h2>6. 国外移転</h2><p>本サイトは 서비스 제공 및 운영을 위해 국외에 인프라를 두거나 여러 국가에서 서비스를 제공하는 외부 서비스를 이용하며, 이에 따라 서비스 제공에 필요한 개인정보가 국외로 이전될 수 있습니다.</p><h3>Supabase, Inc.</h3><ul><li><strong>이전되는 정보:</strong> 계정·인증정보, チャット 및 서비스 이용정보, 저장 데이터, 업로드한 이미지·파일 등 Supabase를 통해 저장·처리되는 정보</li><li><strong>이전 목적:</strong> 인증, 데이터베이스, 파일 저장, 서버 기능 및 서비스 운영</li><li><strong>주요 저장지역:</strong> 싱가포르(ap-southeast-1)</li><li><strong>이전 시기 및 방법:</strong> 서비스 이용 및 관련 정보의 저장·처리가 발생하는 때 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 각 정보의 보유·삭제 기준 및 서비스 제공자의 적용 가능한 정책에 따름</li></ul><p>S967의 Supabase 프로젝트는 싱가포르(ap-southeast-1) 리전을 사용합니다. 다만 서비스 제공에 필요한 일부 처리는 Supabase 또는 그 하위처리자가 운영하는 다른 지역의 인프라에서 이루어질 수 있습니다.</p><h3>Google LLC / Firebase Cloud Messaging</h3><ul><li><strong>이전되는 정보:</strong> プッシュ通知 토큰, Firebase Installation ID 등 プッシュ通知 제공에 필요한 기술정보</li><li><strong>이전 목적:</strong> プッシュ通知 제공</li><li><strong>이전 국가·지역:</strong> Google이 관련 인프라를 운영하는 국가·지역</li><li><strong>이전 시기 및 방법:</strong> プッシュ通知 기능의 등록·이용 및 알림 처리 시 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 보유·삭제 기준 및 Google의 적용 가능한 정책에 따름</li></ul><p>Firebase Cloud Messaging은 글로벌 인프라에서 제공되는 서비스로, 처리 국가를 하나로 한정하기 어려울 수 있습니다.</p><h3>Plus Five Five, Inc. / Resend</h3><ul><li><strong>이전되는 정보:</strong> 업무 알림을 수신하는 Staff의 이메일 주소, 이메일 메타데이터, 이메일 본문에 포함되는 문의·신고 내용, 닉네임 및 이용자가 선택적으로 제공한 연락정보, 이메일 본문 또는 첨부파일에 포함되는 신청·취합 정보</li><li><strong>이전 목적:</strong> Staff 대상 업무·운영 알림 이메일 발송</li><li><strong>이전 국가:</strong> 米国</li><li><strong>이전 시기 및 방법:</strong> 운영 이메일 발송 시 암호화된 네트워크를 통해 전송</li><li><strong>보유기간:</strong> S967에서 정한 각 정보의 보유·삭제 기준 및 Resend의 적용 가능한 정책에 따름</li></ul><p>일부 신청·취합 정보는 Excel 등의 파일로 정리되어 이메일에 첨부될 수 있습니다.</p><h3>OpenAI</h3><ul><li><strong>이전되는 정보:</strong> 번역 대상 チャット 메시지 본문 및 API 요청 처리에 필요한 기술정보</li><li><strong>이전 목적:</strong> チャット 메시지 번역</li><li><strong>이전 국가·지역:</strong> OpenAI 및 하위처리자가 관련 인프라를 운영하는 국가·지역</li><li><strong>이전 시기 및 방법:</strong> チャット 참여자가 메시지 번역을 요청할 때 암호화된 네트워크를 통해 API로 전송</li><li><strong>보유기간:</strong> OpenAI의 적용 가능한 API 데이터 처리 정책에 따르며, S967에 저장되는 번역 캐시는 생성 후 1개월을 기준으로 정기 삭제</li></ul><p>OpenAI API의 서비스 제공에는 여러 국가·지역의 인프라가 사용될 수 있으므로 처리 국가를 하나로 한정하기 어려울 수 있습니다.</p><h3>국외 이전을 원하지 않는 경우</h3><p>利用者は 선택 기능에 따른 국외 이전을 원하지 않는 경우 해당 기능을 이용하지 않을 수 있습니다. 다만 チャット 번역의 경우 다른 チャット 참여자가 이용자가 작성한 메시지의 번역을 요청할 수 있으므로, <strong>チャット을 이용하는 경우 자신이 작성한 메시지가 번역 처리를 위해 OpenAI API로 전송될 수 있습니다.</strong> 이를 원하지 않는 경우 チャット 기능을 이용하지 않아야 합니다.</p><p>プッシュ通知에 따른 국외 이전을 원하지 않는 경우에는 プッシュ通知 기능을 사용하지 않을 수 있습니다. Supabase 등 사이트의 핵심 서비스 인프라와 관련된 국외 이전은 서비스 제공에 필요하므로, 이를 원하지 않는 경우 해당 기능 또는 사이트 이용이 제한될 수 있습니다.</p></section><section class=\"section\"><h2>7. 第三者提供</h2><p>本サイトは個人情報を販売せず、原則として明示目的を超えて第三者へ提供しません。別途同意、法令の特別規定、適法な関係機関の要請がある場合は例外となる場合があります。</p></section><section class=\"section\"><h2>8. 利用者の権利</h2><p>適用法令の範囲で閲覧、訂正、削除、処理停止、退会、異議申立て等を請求できます。チャット利用者は自身のメッセージを個別削除でき、Staffは自身の業務通知メールを管理できます。</p></section><section class=\"section\"><h2>9. 安全管理・アクセス制御</h2><p>権限分離、管理者機能制限、HTTPS、サーバー秘密情報のクライアント非公開、DB・非公開ファイル・非公開チャットへのアクセス制限、不要情報の定期削除等を行います。IPベースハッシュによる不正利用防止・アクセス遮断を行う場合があります。</p></section><section class=\"section\"><h2>10. ブラウザに保存される情報</h2><p>ログイン・認証状態、言語・テーマ等の設定をブラウザストレージに保存する場合があります。IsoMap Editorは未保存編集の復旧スナップショットを利用者端末のIndexedDBに保存する場合があります。</p></section><section class=\"section\"><h2>11. 14歳未満の利用者</h2><p>本サイトは14歳未満の登録を許可しません。登録時に14歳以上であることの確認を求める場合があります。14歳未満向けの法定代理人同意手続は提供しません。</p></section><section class=\"section\"><h2>12. プライバシーに関するお問い合わせ</h2><p>閲覧・訂正・削除、退会その他の要請は以下へご連絡ください。</p><p><strong>個人情報保護責任者：</strong>S967 運営者</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section><section class=\"section\"><h2>13. 本ポリシーの変更</h2><p>処理方法、外部サービス、保存期間その他重要事項が変わる場合、本サイトで変更内容を公開します。</p><p><strong>施行日：2026年8月15日</strong></p></section><footer>S967 · Privacy Policy</footer>", "ru": "<header class=\"hero\"><div class=\"eyebrow\">S967</div><h1>Политика конфиденциальности</h1><div class=\"effective-date\">Дата вступления в силу: 15 августа 2026 г.</div></header><section class=\"privacy-summary\"><p>Сайт может обрабатывать игровой никнейм и внутриигровую информацию, логин и защищённые данные аутентификации пароля, а также добровольно предоставленные контакты.</p><p>Дополнительная техническая информация может обрабатываться при использовании чата, загрузки изображений/файлов, редактора карт и других функций.</p><p><strong>Сайт не требует номер телефона или настоящее имя, если они не нужны для соответствующей функции.</strong></p></section><section class=\"intro\">S967 («Сайт») ценит конфиденциальность пользователей и соблюдает применимое законодательство. Данные обрабатываются только в объёме, необходимом для работы сервиса, и удаляются либо отвязываются от аккаунта после достижения цели или истечения срока хранения.</section><section class=\"section\"><h2>1. Обрабатываемые данные и цели</h2><h3>1) Аккаунты и аутентификация</h3><p>Могут обрабатываться логины, внутренние идентификаторы, никнеймы, права и статус, хэши паролей и другие данные аутентификации, хэши токенов сессии и сроки их действия.</p><p><strong>Цели:</strong> аутентификация, управление аккаунтами и правами, Staff-функции, чат, редактор карт, предотвращение злоупотреблений, безопасность и устранение сбоев.</p><p class=\"subtle\">Пароли и исходные токены сессии в открытом виде в базе не хранятся.</p><h3>2) Чат</h3><p>Могут обрабатываться сообщения, никнеймы и идентификаторы авторов, время, записи участия/приглашения/выхода, статусы прочтения, реакции, вложения, push-токены и Firebase Installation ID.</p><p>Пользователь может удалить своё сообщение отдельно; такое сообщение удаляется немедленно.</p><p>При жалобе сообщение и минимально необходимый контекст могут сохраняться отдельно как материалы жалобы. Уже сохранённые материалы могут обрабатываться по отдельному сроку даже после удаления исходного сообщения.</p><p>Администраторы не просматривают приватные комнаты, в которых не участвуют, в обычных операционных целях.</p><h3>3) Перевод чата</h3><p>Когда участник запрашивает перевод, <strong>текст переводимого сообщения</strong> отправляется в OpenAI API. Переводиться могут и сообщения других участников. Пароли и полная история комнаты не отправляются.</p><p>Результат может кэшироваться и регулярно удаляется через <strong>1 месяц после создания</strong>. Исходное сообщение и кэш могут храниться отдельно.</p><h3>4) Обращения и жалобы</h3><p>Могут обрабатываться содержание, никнейм и добровольно предоставленные email, Discord, Telegram, Kakao Open Profile, LINE и т. п. Контакты необязательны.</p><p>В этой функции нельзя прикреплять изображения или файлы.</p><h3>5) Загрузка изображений и файлов</h3><p>Обрабатываются изображения из функций загрузки, а также изображения, документы и архивы, прикреплённые в чате, время загрузки, техническая информация и IP-хэши для защиты от злоупотреблений.</p><p>IP-хэши могут использоваться для блокировки доступа.</p><h3>6) Игровые заявки и агрегация</h3><p>Обрабатываются никнейм, альянс, содержание заявки, войска/количество, время подачи/изменения. Group Buy — это свод позиций, которые участники покупают самостоятельно, а не продажа или платёжное посредничество S967.</p><p>Некоторые заявки могут оформляться в Excel и отправляться Staff по email.</p><h3>7) Email Staff</h3><p>Staff может добровольно зарегистрировать email для уведомлений. Пользователь и администратор могут управлять им в необходимом объёме. Удалённый адрес немедленно удаляется из базы S967 и отдельно как неактивная запись не хранится.</p><h3>8) IsoMap Editor</h3><p>Обрабатываются логин, внутренний идентификатор, хэш пароля, сессия, названия и данные карт, время создания/изменения, коды общего доступа и снимки.</p><h3>9) Coloring</h3><p>Обрабатываются внутренний идентификатор Map Editor, палитры, названия и значения цветов, состояния регионов, базовый регион для цвета, настройки меток и время создания/изменения. При замене схемы регионов данные старой схемы удаляются.</p></section><section class=\"section\"><h2>2. Сроки хранения</h2><div class=\"policy-table-wrap\"><table><thead><tr><th>Информация</th><th>Срок хранения / удаления</th></tr></thead><tbody><tr><td>Optional contact information submitted with an inquiry</td><td>Periodically deleted based on <strong>1 month after receipt</strong></td></tr><tr><td>Chat translation cache</td><td>Periodically deleted based on <strong>1 month after creation</strong></td></tr><tr><td>Report records/evidence</td><td>Normally periodically deleted based on <strong>90 days after receipt</strong>; exception for an actual dispute or legal-preservation need</td></tr><tr><td>Uploaded images/files</td><td>Deleted within a <strong>maximum of 6 months after upload</strong></td></tr><tr><td>Inquiry content and processing records</td><td>Periodically deleted based on <strong>1 year after receipt</strong></td></tr><tr><td>General IP-based hashes</td><td>Deleted based on <strong>1 year after the last relevant activity</strong></td></tr><tr><td>Blocked IP-based hashes</td><td>Retained <strong>while the block remains in effect</strong></td></tr><tr><td>Staff account</td><td><strong>Deleted on account withdrawal</strong></td></tr><tr><td>Chat account</td><td><strong>Deleted on account withdrawal</strong>; automatically withdrawn after <strong>2 years without a successful login</strong></td></tr><tr><td>General chat messages</td><td>Retained while the account exists; <strong>immediately deleted</strong> when individually deleted by the user</td></tr><tr><td>Chat records written by a withdrawn user</td><td>Unlinked from the account, then periodically deleted based on a <strong>maximum of 3 years</strong>; exception for legal preservation</td></tr><tr><td>Staff email address</td><td>Retained while registered; <strong>immediately deleted from the S967 DB</strong> when deleted</td></tr><tr><td>Push notification token</td><td><strong>Immediately deleted</strong> when notifications are disabled or the account is withdrawn</td></tr><tr><td>IsoMap Editor account</td><td>Periodically deleted based on <strong>6 months after the last successful login</strong></td></tr><tr><td>Iso saved map</td><td>Periodically deleted based on <strong>6 months after the last update</strong></td></tr><tr><td>Coloring saved data</td><td>Periodically deleted based on <strong>6 months after the first save</strong>; later edits do not extend the period, and replacement of the region board causes <strong>immediate deletion</strong> of old-board data</td></tr><tr><td>Iso shared map snapshot</td><td>Periodically deleted based on <strong>6 months after the last share creation/update</strong></td></tr><tr><td>Информация required for an actual dispute or legal process</td><td>Minimum necessary scope until the relevant process ends</td></tr></tbody></table></div><p class=\"policy-note\">Periodic deletion takes place on a schedule, so deletion may occur at the next scheduled cleanup rather than immediately after the reference period passes. Информация expressly designated for immediate deletion is deleted immediately when the relevant event occurs.</p></section><section class=\"section\"><h2>3. Удаление аккаунта и сообщения</h2><p>Аккаунт Staff удаляется при выходе. Чат-аккаунт также удаляется при выходе и может быть автоматически закрыт после 2 лет без успешного входа.</p><p>После удаления чат-аккаунта убирается доступ и прямая связь старых сообщений с текущим аккаунтом; автор может отображаться как «Удалённый пользователь». Оставшиеся сообщения удаляются в срок до 3 лет. Сообщение, удалённое пользователем вручную, удаляется немедленно.</p><p>Если в тексте сообщения есть имя или контакты, отвязка аккаунта не делает его полностью анонимным. Материалы жалобы хранятся отдельно; при реальном споре или юридической процедуре удаление минимально необходимых данных может быть временно приостановлено.</p></section><section class=\"section\"><h2>4. Удаление персональных данных</h2><p>Ненужные данные удаляются или отвязываются от аккаунта. Данные с немедленным удалением удаляются сразу, данные с периодическим сроком — после его истечения. При юридической необходимости хранение ограничивается необходимым объёмом и сроком.</p></section><section class=\"section\"><h2>5. Внешние сервисы</h2><h3>Supabase, Inc.</h3><p>Используется для аутентификации, БД, файлов, серверных функций и данных сервиса. База S967 использует регион <strong>Сингапур (ap-southeast-1)</strong>.</p><h3>Google LLC / Firebase Cloud Messaging</h3><p>Для push-уведомлений могут обрабатываться Firebase Installation ID и токены.</p><h3>Plus Five Five, Inc. / Resend</h3><p>Используется для отправки писем Staff, добровольно зарегистрировавшим email. Могут обрабатываться адрес Staff, метаданные письма, содержание обращений/жалоб, никнеймы, добровольные контакты и данные заявок/агрегации в тексте или вложениях. Некоторые заявки отправляются как Excel.</p><h3>OpenAI API</h3><p>При запросе перевода передаются текст переводимого сообщения и необходимая техническая информация. Переводиться могут сообщения других участников.</p></section><section class=\"section\"><h2>6. Трансграничная передача</h2><p>The Site uses external services that maintain infrastructure outside Korea or provide services across multiple countries. Personal information necessary to provide the service may therefore be transferred overseas.</p><h3>Supabase, Inc.</h3><ul><li><strong>Information transferred:</strong> account/authentication information, chat and service-use information, saved data, uploaded images/files, and other information stored or processed through Supabase</li><li><strong>Purpose:</strong> authentication, database operation, file storage, server functions, and service operation</li><li><strong>Primary storage region:</strong> Singapore (ap-southeast-1)</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when service use or related storage/processing occurs</li><li><strong>Retention:</strong> according to S967 retention/deletion standards and applicable provider policies</li></ul><p>The S967 Supabase project uses the Singapore (ap-southeast-1) region. Some processing may occur through infrastructure operated by Supabase or its subprocessors in other regions.</p><h3>Google LLC / Firebase Cloud Messaging</h3><ul><li><strong>Information transferred:</strong> push notification tokens, Firebase Installation IDs, and related technical information</li><li><strong>Purpose:</strong> push notification delivery</li><li><strong>Country/region:</strong> countries and regions where Google operates relevant infrastructure</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when push notifications are registered, used, or processed</li><li><strong>Retention:</strong> according to S967 standards and applicable Google policies</li></ul><p>Firebase Cloud Messaging is provided through global infrastructure, so processing may not be limited to a single country.</p><h3>Plus Five Five, Inc. / Resend</h3><ul><li><strong>Information transferred:</strong> Staff recipient email addresses, email metadata, inquiry/report content, nicknames, optional contact information, and application/aggregation information contained in email bodies or attachments</li><li><strong>Purpose:</strong> operational email delivery to Staff</li><li><strong>Country:</strong> США</li><li><strong>Timing/method:</strong> transmitted over encrypted networks when operational emails are sent</li><li><strong>Retention:</strong> according to S967 standards and applicable Resend policies</li></ul><p>Some application/aggregation information may be organized into files such as Excel spreadsheets and attached to emails.</p><h3>OpenAI</h3><ul><li><strong>Information transferred:</strong> body of the chat message being translated and technical information necessary to process the API request</li><li><strong>Purpose:</strong> chat-message translation</li><li><strong>Country/region:</strong> countries and regions where OpenAI and its subprocessors operate relevant infrastructure</li><li><strong>Timing/method:</strong> transmitted over encrypted networks through the API when a chat participant requests translation</li><li><strong>Retention:</strong> according to applicable OpenAI API data-processing policies; translation caches stored by S967 are periodically deleted based on 1 month after creation</li></ul><p>OpenAI API service provision may use infrastructure in multiple countries or regions, so processing may not be limited to a single country.</p><h3>If you do not want overseas transfer</h3><p>Users may choose not to use optional features that involve overseas transfer. However, for chat translation, another participant may request translation of a message you wrote. Therefore, <strong>if you use chat, a message you write may be transmitted to the OpenAI API for translation processing.</strong> If you do not want this to occur, you must not use the chat feature.</p><p>Users who do not want overseas transfer for push notifications may choose not to use push notifications. Overseas processing related to core infrastructure such as Supabase is necessary to provide the service, so refusing it may limit use of some features or the Site itself.</p></section><section class=\"section\"><h2>7. Передача третьим лицам</h2><p>Сайт не продаёт персональные данные и, как правило, не передаёт их третьим лицам вне заявленных целей. Исключения возможны с отдельного согласия, по закону или законному запросу компетентного органа.</p></section><section class=\"section\"><h2>8. Права пользователей</h2><p>В рамках закона пользователь может требовать доступ, исправление, удаление, приостановку обработки, удаление аккаунта и рассмотрение возражений. Пользователь чата может удалять свои сообщения, Staff — управлять email уведомлений.</p></section><section class=\"section\"><h2>9. Безопасность и доступ</h2><p>Сайт использует разделение прав, ограничения админ-функций, HTTPS, скрытие серверных секретов от клиента, ограничения доступа к БД, приватным файлам и чатам, а также регулярное удаление ненужных данных. IP-хэши могут использоваться для защиты от злоупотреблений и блокировки.</p></section><section class=\"section\"><h2>10. Данные в браузере</h2><p>В браузере могут сохраняться состояние входа, язык, тема и другие настройки. IsoMap Editor может сохранять снимки восстановления несохранённых изменений в IndexedDB на устройстве пользователя.</p></section><section class=\"section\"><h2>11. Пользователи младше 14 лет</h2><p>Сайт не разрешает регистрацию лиц младше 14 лет. При регистрации может требоваться подтверждение возраста 14+. Процедура согласия законного представителя для детей младше 14 лет не предоставляется.</p></section><section class=\"section\"><h2>12. Вопросы о конфиденциальности</h2><p>По вопросам доступа, исправления, удаления, удаления аккаунта и другим вопросам можно обратиться к ответственному лицу.</p><p><strong>Ответственный:</strong> S967 Operator</p><a class=\"contact\" href=\"mailto:lemon.967ace@gmail.com\">✉ lemon.967ace@gmail.com</a></section><section class=\"section\"><h2>13. Изменения политики</h2><p>При изменении способов обработки, внешних сервисов, сроков хранения или других важных условий изменения публикуются на Сайте.</p><p><strong>Дата вступления в силу: 15 августа 2026 г.</strong></p></section><footer>S967 · Privacy Policy</footer>"};const root=document.getElementById('policyRoot');function render(lang){const target=POLICY[lang]?lang:'ko';root.innerHTML=POLICY[target];document.documentElement.lang=target;document.title=TITLES[target];}render(document.documentElement.lang||'ko');window.addEventListener('languagechange',e=>{if(e.detail&&e.detail.language)render(e.detail.language);});})();</script></body></html>
