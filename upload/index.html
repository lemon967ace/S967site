<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="S967 image upload">
  <title>Image Upload · S967</title>

  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js" defer></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 36px 20px;
      display: grid;
      place-items: center;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: min(620px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 4.3rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 500px;
      margin: 20px auto 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .panel {
      margin-top: 30px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: left;
    }

    .small {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .file-label {
      display: block;
      padding: 24px 18px;
      border: 1px dashed var(--border-hover);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .file-label:hover {
      background: var(--surface-hover);
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .previews {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .preview {
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .action {
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-hover);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .error {
      color: #c94c4c;
    }

    .success-code {
      margin: 18px 0 8px;
      font-size: clamp(1.35rem, 6vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }

    .back {
      display: inline-block;
      margin-top: 28px;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="theme-picker" data-theme-picker>
    <button
      class="theme-button"
      type="button"
      data-theme-button
      aria-label="Theme"
      aria-haspopup="true"
      aria-expanded="false"
    >◐</button>

    <div class="theme-menu" data-theme-menu role="menu">
      <button type="button" data-theme-choice="system" role="menuitemradio">
        <span class="theme-choice-icon">◐</span><span>System</span>
      </button>
      <button type="button" data-theme-choice="light" role="menuitemradio">
        <span class="theme-choice-icon">☀</span><span>Light</span>
      </button>
      <button type="button" data-theme-choice="dark" role="menuitemradio">
        <span class="theme-choice-icon">☾</span><span>Dark</span>
      </button>
    </div>
  </div>

  <main>
    <div class="eyebrow">S967</div>
    <h1>Image Upload</h1>

    <p class="lead">
      Upload screenshots.<br>
      PNG, JPG, JPEG · max 5 MB each · up to 3 images.
    </p>

    <section id="uploadPanel" class="panel">
      <label class="file-label" for="images">
        Choose up to 3 images
      </label>

      <input
        id="images"
        type="file"
        accept=".png,.jpg,.jpeg,image/png,image/jpeg"
        multiple
      >

      <div id="previews" class="previews"></div>

      <button
        id="uploadButton"
        class="action"
        type="button"
        disabled
      >
        Upload Images
      </button>

      <div id="uploadStatus" class="status"></div>

      <p class="small">
        Limit: up to 8 images per 24 hours from the same network.
      </p>
    </section>

    <section id="successPanel" class="panel hidden">
      <div class="success-code">Upload complete</div>
      <p class="small">
        Your images have been received successfully.
      </p>
    </section>

    <a class="back" href="/">← Back to S967</a>
  </main>

  <script>
    // Put your deployed upload-image Function URL here.
    const UPLOAD_IMAGE_URL =
      "https://dpmjwsnqkuzetyvfcmfr.supabase.co/functions/v1/rapid-service";

    const imagesInput =
      document.getElementById("images");

    const previews =
      document.getElementById("previews");

    const uploadButton =
      document.getElementById("uploadButton");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const uploadPanel =
      document.getElementById("uploadPanel");

    const successPanel =
      document.getElementById("successPanel");

    let selectedFiles = [];

    function showError(
      element,
      message
    ) {
      element.textContent =
        message;

      element.classList.add(
        "error"
      );
    }

    function clearStatus(
      element
    ) {
      element.textContent = "";

      element.classList.remove(
        "error"
      );
    }

    imagesInput.addEventListener(
      "change",
      () => {
        clearStatus(
          uploadStatus
        );

        previews.innerHTML = "";

        const files =
          Array.from(
            imagesInput.files || []
          );

        if (
          files.length > 3
        ) {
          selectedFiles = [];

          imagesInput.value = "";

          uploadButton.disabled =
            true;

          showError(
            uploadStatus,
            "You can select up to 3 images."
          );

          return;
        }

        const allowedTypes =
          new Set([
            "image/png",
            "image/jpeg",
          ]);

        for (
          const file
          of files
        ) {
          if (
            !allowedTypes.has(
              file.type
            )
          ) {
            selectedFiles = [];

            imagesInput.value = "";

            uploadButton.disabled =
              true;

            showError(
              uploadStatus,
              "Only PNG, JPG, and JPEG images are allowed."
            );

            return;
          }

          if (
            file.size >
            5 * 1024 * 1024
          ) {
            selectedFiles = [];

            imagesInput.value = "";

            uploadButton.disabled =
              true;

            showError(
              uploadStatus,
              "Each image must be 5 MB or smaller."
            );

            return;
          }
        }

        selectedFiles = files;

        uploadButton.disabled =
          selectedFiles.length === 0;

        for (
          const file
          of selectedFiles
        ) {
          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "preview";

          const image =
            document.createElement(
              "img"
            );

          const objectUrl =
            URL.createObjectURL(
              file
            );

          image.src =
            objectUrl;

          image.onload =
            () =>
              URL.revokeObjectURL(
                objectUrl
              );

          wrapper.appendChild(
            image
          );

          previews.appendChild(
            wrapper
          );
        }
      }
    );

    uploadButton.addEventListener(
      "click",
      async () => {
        if (
          selectedFiles.length < 1
        ) {
          return;
        }

        uploadButton.disabled =
          true;

        imagesInput.disabled =
          true;

        clearStatus(
          uploadStatus
        );

        uploadStatus.textContent =
          "Uploading…";

        const form =
          new FormData();

        for (
          const file
          of selectedFiles
        ) {
          form.append(
            "files",
            file
          );
        }

        try {
          const response =
            await fetch(
              UPLOAD_IMAGE_URL,
              {
                method: "POST",
                body: form,
              }
            );

          const result =
            await response
              .json()
              .catch(() => ({}));

          if (
            !response.ok ||
            !result.success
          ) {
            throw new Error(
              result.error ||
              "Upload failed."
            );
          }

          uploadPanel.classList.add(
            "hidden"
          );

          successPanel.classList.remove(
            "hidden"
          );

          selectedFiles = [];
        } catch (error) {
          showError(
            uploadStatus,
            error.message ||
            "Upload failed."
          );

          uploadButton.disabled =
            false;
        } finally {
          imagesInput.disabled =
            false;
        }
      }
    );
  </script>
</body>
</html>
