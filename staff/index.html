const STAFF_IMAGE_API_URL =
  "https://dpmjwsnqkuzetyvfcmfr.supabase.co/functions/v1/staff-image-admin";

const STORAGE_BASE =

    async function staffImageRequest(
  method,
  body = null
) {
  const {
    data: sessionData
  } =
    await supabase.auth
      .getSession();

  const token =
    sessionData.session
      ?.access_token;

  if (!token) {
    throw new Error(
      "Staff session expired."
    );
  }

  const options = {
    method,

    headers: {
      "Authorization":
        `Bearer ${token}`,
    },
  };

  if (body !== null) {
    options.headers[
      "Content-Type"
    ] =
      "application/json";

    options.body =
      JSON.stringify(body);
  }

  const response =
    await fetch(
      STAFF_IMAGE_API_URL,
      options
    );

  const result =
    await response
      .json()
      .catch(
        () => ({})
      );

  if (!response.ok) {
    throw new Error(
      result.error ||
      "Image management request failed."
    );
  }

  return result;
}


function getPublicImageUrl(
  path
) {
  return (
    STORAGE_BASE +
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")
  );
}


function getBlock(
  ipHash
) {
  return (
    imageData.blocked.find(
      (item) =>
        item.ip_hash ===
        ipHash
    ) ??
    null
  );
}


function isActiveBlock(
  block
) {
  if (!block) {
    return false;
  }

  if (
    block.blocked_until ===
    null
  ) {
    return true;
  }

  return (
    new Date(
      block.blocked_until
    ).getTime() >
    Date.now()
  );
}


function formatBlock(
  block
) {
  if (!block) {
    return "Not blocked";
  }

  if (
    block.blocked_until ===
    null
  ) {
    return "Blocked by Admin";
  }

  const until =
    new Date(
      block.blocked_until
    );

  return (
    `Blocked until ${until.toLocaleString()}`
  );
}


async function loadImages() {
  refreshImagesButton.disabled =
    true;

  setStatus(
    imageStatus,
    "Loading…"
  );

  try {
    const result =
      await staffImageRequest(
        "GET"
      );

    imageData = {
      uploads:
        result.uploads ?? [],

      blocked:
        result.blocked ?? [],
    };

    renderImages();

    setStatus(
      imageStatus,
      ""
    );

  } catch (error) {
    setStatus(
      imageStatus,
      error.message ||
      "Could not load images.",
      true
    );

  } finally {
    refreshImagesButton.disabled =
      false;
  }
}


function renderImages() {
  imageUploads.innerHTML =
    "";

  const uploads =
    imageData.uploads ?? [];

  if (
    uploads.length === 0
  ) {
    imageUploads.innerHTML =
      '<div class="small">No uploads found.</div>';

    return;
  }


  uploads.forEach(
    (item) => {
      const container =
        document.createElement(
          "div"
        );

      container.className =
        "upload-item";


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "upload-meta";


      const reference =
        document.createElement(
          "strong"
        );

      reference.textContent =
        item.reference_code ||
        "Unknown";

      meta.appendChild(
        reference
      );

      meta.appendChild(
        document.createElement(
          "br"
        )
      );

      meta.append(
        new Date(
          item.created_at
        ).toLocaleString()
      );


      const block =
        getBlock(
          item.ip_hash
        );

      const blocked =
        isActiveBlock(
          block
        );


      const badge =
        document.createElement(
          "div"
        );

      badge.className =
        blocked
          ? "badge badge-blocked"
          : "badge";

      badge.textContent =
        blocked
          ? formatBlock(block)
          : "Not blocked";


      const grid =
        document.createElement(
          "div"
        );

      grid.className =
        "upload-images";


      for (
        const path
        of item.storage_paths ||
          []
      ) {
        const box =
          document.createElement(
            "div"
          );

        box.className =
          "upload-image-box";


        const link =
          document.createElement(
            "a"
          );

        link.href =
          getPublicImageUrl(
            path
          );

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";


        const img =
          document.createElement(
            "img"
          );

        img.src =
          getPublicImageUrl(
            path
          );

        img.alt =
          "Uploaded image";

        img.loading =
          "lazy";


        link.appendChild(
          img
        );


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.type =
          "button";

        deleteButton.className =
          "image-delete-button";

        deleteButton.textContent =
          "Delete";


        deleteButton.addEventListener(
          "click",
          async () => {
            const confirmed =
              confirm(
                "Delete this image?"
              );

            if (!confirmed) {
              return;
            }

            deleteButton.disabled =
              true;

            try {
              await staffImageRequest(
                "POST",
                {
                  action:
                    "delete_image",

                  uploadId:
                    item.id,

                  storagePath:
                    path,
                }
              );

              await loadImages();

            } catch (error) {
              alert(
                error.message ||
                "Could not delete image."
              );

              deleteButton.disabled =
                false;
            }
          }
        );


        box.appendChild(
          link
        );

        box.appendChild(
          deleteButton
        );

        grid.appendChild(
          box
        );
      }


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "upload-actions";


      const blockButton =
        document.createElement(
          "button"
        );

      blockButton.type =
        "button";

      blockButton.textContent =
        "Block 7 days";


      blockButton.disabled =
        blocked;


      blockButton.addEventListener(
        "click",
        async () => {
          const confirmed =
            confirm(
              "Block this uploader for 7 days?"
            );

          if (!confirmed) {
            return;
          }

          blockButton.disabled =
            true;

          try {
            await staffImageRequest(
              "POST",
              {
                action:
                  "block_ip_7d",

                ipHash:
                  item.ip_hash,
              }
            );

            await loadImages();

          } catch (error) {
            alert(
              error.message ||
              "Could not block uploader."
            );

            blockButton.disabled =
              false;
          }
        }
      );


      const unblockButton =
        document.createElement(
          "button"
        );

      unblockButton.type =
        "button";

      unblockButton.textContent =
        "Unblock";


      const canUnblock =
        blocked &&
        block?.reason ===
          "Staff block";


      unblockButton.disabled =
        !canUnblock;


      unblockButton.addEventListener(
        "click",
        async () => {
          const confirmed =
            confirm(
              "Unblock this uploader?"
            );

          if (!confirmed) {
            return;
          }

          unblockButton.disabled =
            true;

          try {
            await staffImageRequest(
              "POST",
              {
                action:
                  "unblock_ip",

                ipHash:
                  item.ip_hash,
              }
            );

            await loadImages();

          } catch (error) {
            alert(
              error.message ||
              "Could not unblock uploader."
            );

            unblockButton.disabled =
              false;
          }
        }
      );


      actions.appendChild(
        blockButton
      );

      actions.appendChild(
        unblockButton
      );


      container.appendChild(
        meta
      );

      container.appendChild(
        badge
      );

      container.appendChild(
        grid
      );

      container.appendChild(
        actions
      );


      imageUploads.appendChild(
        container
      );
    }
  );
}


refreshImagesButton

imageData = {

    async function verifyStaff(
      user
    ) {
      if (!user) {
        return null;
      }

      const {
        data,
        error
      } =
        await supabase
          .from(
            "staff_accounts"
          )
          .select(
            "user_id, display_name, role, is_active"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (error) {
        throw error;
      }


      if (
        !data ||
        data.role !== "staff" ||
        data.is_active !== true
      ) {
        return null;
      }


      return data;
    }


    async function openExistingSession() {
      const {
        data: {
          user
        },
        error
      } =
        await supabase.auth
          .getUser();


      if (
        error ||
        !user
      ) {
        showLogin();
        return;
      }


      try {
        const account =
          await verifyStaff(
            user
          );


        if (!account) {
          await supabase.auth
            .signOut({
              scope: "local"
            });

          showLogin();

          setStatus(
            loginStatus,
            "This account does not have active Staff access.",
            true
          );

          return;
        }


        showStaff(
          account,
          user
        );

      } catch (error) {
        showLogin();

        setStatus(
          loginStatus,
          error.message ||
            "Could not verify Staff access.",
          true
        );
      }
    }


    async function login() {
      const email =
        emailInput
          .value
          .trim();

      const password =
        passwordInput.value;


      if (
        !email ||
        !password
      ) {
        setStatus(
          loginStatus,
          "Enter your email and password.",
          true
        );

        return;
      }


      loginButton.disabled =
        true;

      setStatus(
        loginStatus,
        "Signing in…"
      );


      try {
        const {
          data,
          error
        } =
          await supabase.auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {
          throw error;
        }


        const user =
          data.user;


        const account =
          await verifyStaff(
            user
          );


        if (!account) {
          await supabase.auth
            .signOut({
              scope: "local"
            });

          throw new Error(
            "This account does not have active Staff access."
          );
        }


        emailInput.value =
          "";

        passwordInput.value =
          "";

        setStatus(
          loginStatus,
          ""
        );


        showStaff(
          account,
          user
        );

      } catch (error) {
        setStatus(
          loginStatus,
          error.message ||
            "Login failed.",
          true
        );

      } finally {
        loginButton.disabled =
          false;
      }
    }


    loginButton.addEventListener(
      "click",
      login
    );


    passwordInput.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key ===
          "Enter"
        ) {
          login();
        }
      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {
        logoutButton.disabled =
          true;

        try {
          await supabase.auth
            .signOut({
              scope: "local"
            });

        } finally {
          logoutButton.disabled =
            false;

          showLogin();
        }
      }
    );


    changePasswordButton
      .addEventListener(
        "click",
        async () => {
          const password =
            newPasswordInput.value;

          const confirmPassword =
            confirmPasswordInput.value;


          if (
            password.length < 6
          ) {
            setStatus(
              passwordStatus,
              "Password must be at least 6 characters.",
              true
            );

            return;
          }


          if (
            password !==
            confirmPassword
          ) {
            setStatus(
              passwordStatus,
              "Passwords do not match.",
              true
            );

            return;
          }


          changePasswordButton.disabled =
            true;

          setStatus(
            passwordStatus,
            "Changing password…"
          );


          try {
            const {
              error
            } =
              await supabase.auth
                .updateUser({
                  password
                });


            if (error) {
              throw error;
            }


            newPasswordInput.value =
              "";

            confirmPasswordInput.value =
              "";


            setStatus(
              passwordStatus,
              "Password changed."
            );

          } catch (error) {
            setStatus(
              passwordStatus,
              error.message ||
                "Could not change password.",
              true
            );

          } finally {
            changePasswordButton.disabled =
              false;
          }
        }
      );


    openExistingSession();

    staffTabs.forEach(
  (button) => {
    button.addEventListener(
      "click",
      () => {
        const target =
          button.dataset
            .staffTab;

        staffTabs.forEach(
          (item) => {
            item.classList.toggle(
              "is-active",
              item === button
            );
          }
        );

        staffSections.forEach(
          (section) => {
            section.classList.toggle(
              "is-active",
              section.dataset
                .staffSection ===
                target
            );
          }
        );
      }
    );
  }
);
    
  </script>

</body>
</html>
