<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Staff Chat | S967</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js" defer></script>
  <script src="/language.js" defer></script>
  <script src="/admin/admin-auth.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100dvh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page-bg);color:var(--text)}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .app{width:min(1180px,100%);height:100dvh;margin:0 auto;padding:12px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px}
    .panel{border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:15px}
    .sidebar{min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px}
    .side-head{display:flex;align-items:center;gap:6px}
    .side-head strong{flex:1}
    .rooms{min-height:0;overflow:auto;display:grid;align-content:start;gap:5px}
    .room-button{width:100%;display:flex;align-items:center;gap:7px;padding:9px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}
    .room-button:hover,.room-button.active{background:var(--surface-hover);border-color:var(--border)}
    .room-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge{min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;border-radius:999px;background:var(--text);color:var(--page-bg);font-size:.68rem;font-weight:800}
    .main{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:8px}
    .bar{display:flex;align-items:center;gap:8px;padding:10px 12px}
    .bar h1{margin:0;font-size:1.02rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar button,.bar a,.notify-button{border:1px solid var(--border);background:var(--surface-hover);border-radius:8px;padding:7px 9px;text-decoration:none}
    .search-toggle{display:none}
    .actor{font-size:.74rem;color:var(--muted);white-space:nowrap}
    .searchbar{padding:8px;display:grid;grid-template-columns:minmax(130px,1fr) auto auto auto auto;gap:6px;align-items:end}
    .searchbar label{display:grid;gap:3px;color:var(--muted);font-size:.7rem}
    .searchbar input{min-height:34px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover)}
    .searchbar button{min-height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);padding:6px 9px}
    .older{justify-self:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 11px;color:var(--muted)}
    .messages{min-height:0;overflow:auto;padding:12px;scroll-behavior:smooth}
    .empty{min-height:180px;display:grid;place-items:center;color:var(--muted)}
    .message{max-width:min(76%,620px);margin:0 0 12px;padding:9px 11px;border:1px solid var(--border);border-radius:13px;background:var(--surface-hover)}
    .message.mine{margin-left:auto}
    .message.admin{border-style:double}
    .message-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;color:var(--muted);font-size:.7rem}
    .message-author{color:var(--text);font-weight:750}
    .message-time{margin-left:auto}
    .message-action{border:0;background:transparent;padding:1px 3px;color:var(--muted);font-size:.7rem}
    .reply-preview{margin-bottom:6px;padding:6px 8px;border-left:3px solid var(--border-hover);background:var(--surface);border-radius:6px;color:var(--muted);font-size:.76rem;overflow:hidden}
    .reply-preview strong{color:var(--text)}
    .reply-preview .snippet{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .message-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.48;font-size:.92rem}
    .reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;position:relative}.reaction-chip,.reaction-add{border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:3px 7px;font-size:.75rem}.reaction-chip.mine{background:var(--surface-hover);border-color:var(--border-hover);font-weight:800}.reaction-users{flex-basis:100%;margin-top:1px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);font-size:.7rem;line-height:1.4}.reaction-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;padding:6px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.reaction-picker button{border:0;background:transparent;padding:4px;font-size:1.15rem}
    .message-foot{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:5px;min-height:16px}
    .unread-number{font-size:.68rem;font-weight:800;color:var(--muted)}
    .attachments{display:grid;gap:6px;margin-top:7px}
    .image-preview{width:min(100%,420px);max-height:300px;object-fit:contain;border:1px solid var(--border);border-radius:9px;cursor:pointer}
    .attachment{display:flex;gap:8px;align-items:center;padding:6px 7px;border:1px solid var(--border);border-radius:9px;background:var(--surface);text-decoration:none}
    .attachment-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem}
    .attachment-size{font-size:.7rem;color:var(--muted)}
    .translate-button{border:1px solid var(--border);border-radius:999px;background:transparent;padding:3px 7px;color:var(--muted);font-size:.69rem}
    .translation{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);white-space:pre-wrap;font-size:.84rem;line-height:1.45}
    .translation-label{display:block;margin-bottom:3px;color:var(--muted);font-size:.68rem}
    .composer{padding:9px}
    .replying{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);font-size:.76rem;color:var(--muted)}
    .replying span{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .replying button{border:0;background:transparent;color:var(--muted)}
    .file-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
    .file-chip{max-width:100%;padding:4px 7px;border:1px solid var(--border);border-radius:999px;font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .compose-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:end}
    .file-button,.send-button{min-height:40px;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover);padding:7px 11px;font-weight:700}
    textarea{min-height:40px;max-height:150px;resize:none;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover);padding:9px 10px;outline:none;line-height:1.4}
    .status{min-height:1.1em;margin-top:5px;color:var(--muted);font-size:.72rem}
    .status.error{color:#c2410c}
    .gate{width:min(520px,calc(100% - 28px));margin:10vh auto;padding:22px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow)}
    .gate h1{margin-top:0}
    .chat-login{display:grid;gap:8px;margin-top:14px}
    .chat-login input{padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover)}
    .chat-login button{padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover);font-weight:700}
    .admin-login-button{display:block;margin-top:8px;padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--surface-hover);color:var(--text);text-align:center;text-decoration:none;font-weight:700}
    .gate-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .gate-links a{padding:7px 9px;border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none}

    .room-tools{display:flex;gap:5px}
    .room-tools button{min-width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);padding:0 7px}
    .room-dialog{width:min(520px,calc(100vw - 28px));border:1px solid var(--border);border-radius:15px;padding:0;background:var(--surface-hover);color:var(--text);box-shadow:var(--menu-shadow)}
    .room-dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
    .room-dialog-inner{padding:17px}
    .room-dialog h2{margin:0 0 10px;font-size:1.05rem}
    .room-dialog input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
    .room-dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}
    .room-dialog-actions button,.member-row button{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:7px 9px}
    .member-list,.invite-list{display:grid;gap:6px;margin-top:9px;max-height:240px;overflow:auto}
    .member-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
    .member-row .member-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .member-kind{font-size:.68rem;color:var(--muted)}
    .room-note{color:var(--muted);font-size:.76rem;line-height:1.45}
    .danger-button{color:#c2410c}

    @media(max-width:760px){
      .app{height:100dvh;padding:7px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
      .sidebar{min-height:auto;padding:7px}
      .rooms{display:flex;overflow:auto;gap:5px}
      .room-button{width:auto;min-width:max-content}
      .main{min-height:0}
      .search-toggle{display:inline-flex;align-items:center;justify-content:center}
      .searchbar{grid-template-columns:1fr 1fr}
      .searchbar.mobile-collapsed{display:none}
      .search-text-label{grid-column:1/-1}
      .message{max-width:88%}
      .actor{display:none}
    }
  
    .message.search-hit{outline:2px solid currentColor;outline-offset:3px}
    .message.system-event{
      max-width:min(92%,720px);
      margin:8px auto 14px;
      padding:7px 12px;
      border:0;
      border-radius:999px;
      background:var(--surface);
      color:var(--muted);
      text-align:center;
      box-shadow:none;
    }
    .system-event-text{
      font-size:.76rem;
      line-height:1.4;
      font-weight:650;
    }
    .system-event-time{
      margin-left:6px;
      font-size:.66rem;
      font-weight:400;
      opacity:.78;
      white-space:nowrap;
    }

    /* =========================================================
       CHAT COMPOSER FIXED TO VIEWPORT BOTTOM
       입력/전송 영역은 항상 하단에 두고,
       남는 높이는 메시지 목록이 전부 사용합니다.
       ========================================================= */

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    .app {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    .main {
      height: 100%;
      min-height: 0;
      overflow: hidden;

      grid-template-rows:
        auto
        auto
        auto
        minmax(0, 1fr)
        auto;
    }

    .messages {
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .composer {
      position: relative;
      z-index: 5;
      align-self: end;
      flex: none;

      /* 모바일 하단 safe-area까지 포함 */
      padding-bottom:
        max(
          9px,
          env(safe-area-inset-bottom)
        );
    }

    @media (max-width: 760px) {
      .app {
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;

        grid-template-rows:
          auto
          minmax(0, 1fr);
      }

      .main {
        height: 100%;
        max-height: 100%;
        min-height: 0;
      }

      .messages {
        min-height: 0;
      }

      .composer {
        margin-bottom: 0;
      }
    }

    /* 지원 브라우저에서는 주소창 변화에 더 안정적인 viewport 단위 사용 */
    @supports (height: 100svh) {
      @media (max-width: 760px) {
        .app {
          height: 100svh;
          min-height: 100svh;
          max-height: 100svh;
        }
      }
    }

  
    /* =========================================================
       CHAT VIEWPORT LAYOUT FIX v2
       - root vertical scrolling/overscroll is enabled for pull-to-refresh
       - message area always consumes all remaining height
       - empty state fills that area
       - composer stays at the visible bottom on mobile
       ========================================================= */

    html {
      height: auto !important;
      min-height: 100% !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      overscroll-behavior-y: auto !important;
    }

    body {
      height: auto !important;
      min-height: 100dvh !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      overscroll-behavior-y: auto !important;
      touch-action: pan-y !important;
    }

    .app {
      height: 100dvh !important;
      min-height: 100dvh !important;
      max-height: 100dvh !important;
      overflow: hidden !important;
    }

    .main {
      height: 100% !important;
      min-height: 0 !important;
      max-height: 100% !important;
      overflow: hidden !important;

      grid-template-rows:
        auto
        auto
        auto
        minmax(0, 1fr)
        auto !important;
    }

    .messages {
      height: auto !important;
      min-height: 0 !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      overscroll-behavior: contain;

      display: flex !important;
      flex-direction: column !important;
    }

    .messages > .empty {
      flex: 1 1 auto !important;
      width: 100% !important;
      min-height: 100% !important;

      display: grid !important;
      place-items: center !important;
    }

    .composer {
      position: relative !important;
      inset: auto !important;
      align-self: stretch !important;
      margin: 0 !important;
      flex: 0 0 auto !important;
      z-index: 5;

      padding-bottom:
        max(
          9px,
          env(safe-area-inset-bottom)
        ) !important;
    }

    @media (max-width: 760px) {
      .app {
        height: 100dvh !important;
        min-height: 100dvh !important;
        max-height: 100dvh !important;

        grid-template-columns: 1fr !important;
        grid-template-rows:
          auto
          minmax(0, 1fr) !important;
      }

      .sidebar {
        min-height: 0 !important;
        max-height: max-content;
      }

      .main {
        min-height: 0 !important;
        height: 100% !important;
        max-height: 100% !important;
      }

      .messages {
        min-height: 0 !important;
      }

      .composer {
        align-self: end !important;
      }
    }

  
    /* =========================================================
       CHAT HEIGHT DISTRIBUTION FIX v3
       정확한 역할 분리:
       - header / search / older / composer = 내용 높이만 사용
       - messages = 남는 높이 전부 사용
       - empty = messages 안에서 그 높이를 전부 채움
       ========================================================= */

    .main {
      display: flex !important;
      flex-direction: column !important;
      min-width: 0 !important;
      min-height: 0 !important;
      height: 100% !important;
      max-height: 100% !important;
      gap: 8px !important;
      overflow: hidden !important;
    }

    .main > .bar,
    .main > .searchbar,
    .main > .older,
    .main > .composer {
      flex: 0 0 auto !important;
    }

    .main > .messages {
      flex: 1 1 0 !important;
      min-height: 0 !important;
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;

      display: flex !important;
      flex-direction: column !important;
    }

    .main > .messages > .empty {
      flex: 1 1 auto !important;
      min-height: 0 !important;
      width: 100% !important;

      display: grid !important;
      place-items: center !important;
    }

    .main > .composer {
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      align-self: stretch !important;
      margin: 0 !important;
      padding-top: 9px !important;
      padding-right: 9px !important;
      padding-left: 9px !important;
      padding-bottom:
        max(
          9px,
          env(safe-area-inset-bottom)
        ) !important;
    }

    .main > .composer .status:empty {
      min-height: 0 !important;
      margin-top: 0 !important;
    }

    @media (max-width: 760px) {
      .app {
        height: 100dvh !important;
        min-height: 100dvh !important;
        max-height: 100dvh !important;

        display: grid !important;
        grid-template-columns: 1fr !important;
        grid-template-rows:
          auto
          minmax(0, 1fr) !important;
      }

      .main {
        min-height: 0 !important;
        height: 100% !important;
        max-height: 100% !important;
      }

      .main > .messages {
        flex: 1 1 0 !important;
      }

      .main > .composer {
        flex: 0 0 auto !important;
      }
    }

  
    /* =========================================================
       MOBILE SEARCH ZOOM + ROOM UNREAD BADGE
       ========================================================= */

    .room-button .badge {
      min-width: 20px;
      max-width: 42px;
      padding-inline: 6px;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      /* iOS/Safari 등에서 작은 input 폰트 포커스 시 자동 확대되는 현상 방지 */
      .searchbar input,
      .searchbar select,
      .searchbar textarea {
        font-size: 16px !important;
      }

      .searchbar button,
      .search-toggle {
        touch-action: manipulation;
      }
    }

  
    /* =========================================================
       TOP ACTION BUTTON CLEANUP
       - desktop/tablet: search panel is always visible, so hide search toggle
       - top refresh button is no longer shown
       - mobile: keep search toggle because the search panel collapses there
       ========================================================= */

    #refreshButton {
      display: none !important;
    }

    #searchToggleButton {
      display: none !important;
    }

    @media (max-width: 760px) {
      #searchToggleButton {
        display: inline-flex !important;
      }
    }

  
    /* =========================================================
       AUTH GATE VISIBILITY FIX v6
       인증 전/실패 상태에서는 채팅 UI를 절대 표시하지 않음.
       이전 모바일 .app { display:grid !important; }가
       .hidden을 덮어쓰는 문제를 더 높은 우선순위로 차단.
       ========================================================= */

    #app.hidden {
      display: none !important;
    }

    #gate.hidden {
      display: none !important;
    }

  
    /* =========================================================
       CHAT ANNOUNCEMENT BOX v7
       Desktop: separate box above room list
       Mobile: between "Rooms" title and + / refresh controls
       ========================================================= */

    .chat-announcement {
      min-width: 0;
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-hover);
      color: var(--text);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 2px 8px rgba(0,0,0,.045);
    }

    .chat-announcement[hidden] {
      display: none !important;
    }

    .chat-announcement-inner {
      min-width: 0;
      padding: 8px 9px;

      font-size: .76rem;
      line-height: 1.45;
    }

    .chat-announcement-text {
      position: relative;
      display: block;
      min-width: 0;
      height: 1.45em;
      overflow: hidden;
    }

    .chat-announcement-slide {
      position: absolute;
      inset: 0;

      display: block;
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      opacity: 0;
      transform: translateY(110%);

      transition:
        transform 420ms ease,
        opacity 420ms ease;
    }

    .chat-announcement-slide.is-active {
      opacity: 1;
      transform: translateY(0);
    }

    .chat-announcement-slide.is-leaving {
      opacity: 0;
      transform: translateY(-110%);
    }

    #chatAnnouncementMobile {
      display: none;
    }

    @media (max-width: 760px) {
      .side-head {
        display: grid !important;
        grid-template-columns:
          auto
          minmax(0, 1fr)
          auto;
        align-items: center;
        gap: 7px;
      }

      .side-head > strong {
        flex: none !important;
      }

      #chatAnnouncementDesktop {
        display: none !important;
      }

      #chatAnnouncementMobile:not([hidden]) {
        display: block !important;
      }

      #chatAnnouncementMobile {
        min-width: 0;
      }

      #chatAnnouncementMobile .chat-announcement-inner {
        padding: 6px 8px;
        font-size: .72rem;
      }

      .room-tools {
        flex: 0 0 auto;
      }
    }

  
    /* =========================================================
       CHAT NOTICE POSITION + LANGUAGE/THEME CONTROLS v8
       ========================================================= */

    .sidebar-stack {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .sidebar-stack > .sidebar {
      min-height: 0;
      height: 100%;
    }

    .chat-announcement-desktop-panel {
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .chat-announcement-desktop-panel .chat-announcement-inner {
      padding: 11px 12px;
    }

    .bar .actor {
      margin-right: auto;
      min-width: 0;
    }

    #chatSettingsToolbarSlot:empty {
      display: none;
    }

    .chat-settings-pickers {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-settings-pickers.login-position {
      position: fixed;
      right: 18px;
      bottom: 18px;

      if(isMobile){
        if(!chatSettingsToolbarSlot)return;
        chatSettingsToolbarSlot.append(chatSettingsPickers);
        chatSettingsPickers.classList.add("toolbar-position");

    let chatAnnouncementPages = [];

    function clearChatAnnouncementTimer(){
      if(chatAnnouncementTimer!==null){
        clearInterval(chatAnnouncementTimer);
        chatAnnouncementTimer=null;
      }
    }

    function hideChatAnnouncements(){
      clearChatAnnouncementTimer();
      chatAnnouncementPages=[];
      chatAnnouncementIndex=0;

      if(chatAnnouncementDesktop){
        chatAnnouncementDesktop.hidden=true;
      }
      if(chatAnnouncementMobile){
        chatAnnouncementMobile.hidden=true;
      }
      if(chatAnnouncementDesktopText){
        chatAnnouncementDesktopText.replaceChildren();
      }
      if(chatAnnouncementMobileText){
        chatAnnouncementMobileText.replaceChildren();
      }
      if(chatAnnouncementDesktopText){
        chatAnnouncementDesktopText.textContent="";
      }
      if(chatAnnouncementMobileText){
        chatAnnouncementMobileText.textContent="";
      }
    }

    function renderChatAnnouncement(index,initial=false){
      if(!chatAnnouncementPages.length){
        hideChatAnnouncements();
        return;
      }

      const nextIndex=
        ((Number(index)||0)%chatAnnouncementPages.length+
          chatAnnouncementPages.length)%
        chatAnnouncementPages.length;

      const value=chatAnnouncementPages[nextIndex];

      const hosts=[
        [chatAnnouncementDesktop,chatAnnouncementDesktopText],
        [chatAnnouncementMobile,chatAnnouncementMobileText],
      ];

      for(const [box,viewport] of hosts){
        if(!box||!viewport)continue;

        const old=
          viewport.querySelector(
            ".chat-announcement-slide.is-active"
          );

        const next=document.createElement("span");
        next.className="chat-announcement-slide";
        next.textContent=value;

        viewport.append(next);
        box.hidden=false;

        requestAnimationFrame(()=>{
          if(old){
            old.classList.remove("is-active");
            old.classList.add("is-leaving");

            setTimeout(
              ()=>old.remove(),
              480
            );
          }

          next.classList.add("is-active");
        });

        if(initial && !old){
          // Initial display still enters from below, matching the main page.
        }
      }

      chatAnnouncementIndex=nextIndex;
    }

    function startChatAnnouncementRotation(){
      clearChatAnnouncementTimer();

      if(!chatAnnouncementPages.length){
        return;
      }

      chatAnnouncementTimer=setInterval(()=>{
        renderChatAnnouncement(
          (chatAnnouncementIndex+1)%
            chatAnnouncementPages.length
        );
      },5000);
    }

    async function loadChatAnnouncements(){
      try{
        const response=await fetch(
          CHAT_ANNOUNCEMENT_API,
          {cache:"no-store"}
        );

        if(!response.ok){
          throw new Error("ANNOUNCEMENT_LOAD_FAILED");
        }

        const result=await response.json();

        const currentLanguage=
          ["ko","en","ja","ru"].includes(language)
            ? language
            : "en";

        chatAnnouncementPages=
          (Array.isArray(result?.announcements)
            ? result.announcements
            : [])
            .map(item=>
              String(
                item?.texts?.[currentLanguage] ??
                item?.texts?.en ??
                ""
              ).trim()
            )
            .filter(Boolean);

        chatAnnouncementIndex=0;
        clearChatAnnouncementTimer();

        if(!chatAnnouncementPages.length){
          hideChatAnnouncements();
          return;
        }

        renderChatAnnouncement(0,true);
        startChatAnnouncementRotation();

      }catch(error){
        console.warn(
          "Chat announcement load failed",
          error
        );
        hideChatAnnouncements();
      }
    }

    async function accessToken(){
      const adminToken=globalThis.S967AdminAuth?.getToken?.();
      if(adminToken) return {token:adminToken,kind:"admin"};
      const {data}=await supabase.auth.getSession();
      const token=data.session?.access_token;
      return token?{token,kind:"auth"}:null;

    async function request(url,options={}){
      const auth=await accessToken();
      if(!auth?.token){const e=new Error("UNAUTHORIZED");e.status=401;throw e;}
      const headers=new Headers(options.headers??{});
      headers.set("Authorization",`Bearer ${auth.token}`);
      const response=await fetch(url,{...options,headers});
      const result=await response.json().catch(()=>({}));
      if(!response.ok){const e=new Error(result.error||`HTTP_${response.status}`);e.status=response.status;throw e;}
      return result;
    }

    async function setupPushNotifications({askPermission=false}={}) {
      if(pushSetupPromise)return pushSetupPromise;
      pushSetupPromise=(async()=>{
        if(!("Notification" in window)||!("serviceWorker" in navigator))return false;
        if(!(await isMessagingSupported()))return false;

        let permission=Notification.permission;
        if(askPermission&&permission!=="granted")permission=await Notification.requestPermission();
        if(permission!=="granted")return false;

        const sw=await navigator.serviceWorker.register("/firebase-messaging-sw.js");
        firebaseMessaging??=getMessaging(firebaseApp);

        if(!pushCallbacksBound){
          pushCallbacksBound=true;
          onRegistered(firebaseMessaging,(fid)=>{
            uploadPushRegistration(fid,"register").catch(error=>console.warn("Push registration upload failed",error));
          });
          onUnregistered(firebaseMessaging,(fid)=>{
            uploadPushRegistration(fid,"unregister").catch(()=>{});
          });
          // Foreground chat updates come from Supabase Realtime. FCM is used for background push only.
          onMessage(firebaseMessaging,()=>{});
        }

        await registerMessaging(firebaseMessaging,{
          vapidKey:FIREBASE_VAPID_KEY,
          serviceWorkerRegistration:sw
        });
        return true;
      })();
      try{return await pushSetupPromise;}finally{pushSetupPromise=null;}
    }

        console.warn("Push dispatch failed",error);

    function buildListUrl({before="",after="",around="",limit=MESSAGE_BATCH_SIZE,initialUnread=false,roomId=currentRoomId}={}){

    function buildSearchUrl(){
      const p=new URLSearchParams({room_id:currentRoomId??"",limit:"1"});
      if(currentSearch.q)p.set("q",currentSearch.q);
      if(currentSearch.date)p.set("target_date",currentSearch.date);

      /*
        Repeated text searches walk backward through matches.
        The server search function sorts newest -> oldest, and `before`
        asks for the next match older than the current hit.
      */
      if(currentSearch.q&&searchBefore){
        p.set("before",searchBefore);
      }

      p.set("search_navigation","1");
      return`${API.list}?${p.toString()}`;
    }

      if(message.system_type==="member_invited"){
        const inviter=String(payload.inviter_name??message.author_name??"").trim()||"—";

        return String(
          text.memberInvited??
          "{target} was invited to the chat room. Invited by: {inviter}"
        )
          .replace("{target}",target)
          .replace("{inviter}",inviter);
      }

      if(message.system_type==="member_left"){
        return String(
          text.memberLeft??
          "{target} left the chat room."
        ).replace("{target}",target);
      }

      if(message.system_type==="member_removed"){
        return String(
          text.memberRemoved??
          "{target} was removed from the chat room."
        ).replace("{target}",target);
      }

      return"";

    function mergeStableAttachmentUrls(previous,next){
      if(!previous?.attachments?.length||!next?.attachments?.length)return next;
      const oldById=new Map(previous.attachments.map(a=>[String(a.id),a]));
      return {
        ...next,
        attachments:next.attachments.map(a=>{
          const old=oldById.get(String(a.id));
          return old?.signed_url ? {...a,signed_url:old.signed_url} : a;
        })
      };
    }

    function renderMessagesSelective(changedIds=new Set()){
      const items=[...messageMap.values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      if(!items.length){
        const empty=document.createElement("div");
        empty.className="empty";
        empty.textContent=currentRoomId?text.empty:text.chooseRoom;
        messagesHost.replaceChildren(empty);
        olderButton.classList.add("hidden");
        return;
      }

      const wanted=new Set(items.map(item=>String(item.id)));
      for(const existing of [...messagesHost.querySelectorAll("[data-message-id]")]){
        if(!wanted.has(String(existing.dataset.messageId)))existing.remove();
      }

      let cursor=messagesHost.firstElementChild;
      for(const item of items){
        const id=String(item.id);
        let existing=messagesHost.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
        if(!existing||changedIds.has(id)){
          const replacement=renderMessage(item);
          if(existing){existing.replaceWith(replacement);existing=replacement;}
          else{messagesHost.insertBefore(replacement,cursor);existing=replacement;}
        }
        if(existing!==cursor){
          messagesHost.insertBefore(existing,cursor);
        }
        cursor=existing.nextElementSibling;
      }
      olderButton.classList.toggle("hidden",!hasMore);
    }

    }

    async function loadLatest(forceScroll=false,notify=false,{initial=false}={}){
      const requestRoomId=currentRoomId;
      const requestGeneration=roomLoadGeneration;
      if(!requestRoomId)return;
      if(loading&&!initial)return;
      loading=true;
      const previous=newestMessage()?.id??notificationBaseline;
      const unread=currentRoomUnreadCount();
      try{
        const r=await request(buildListUrl({limit:MESSAGE_BATCH_SIZE,initialUnread:initial,roomId:requestRoomId}));
        if(requestGeneration!==roomLoadGeneration||requestRoomId!==currentRoomId)return;
        actor=r.actor;
        currentSignalTopic=r.signal_topic??null;
        chatTitle.textContent=r.room?.name??text.title;
        if(initial)messageMap.clear();
        const changedIds=new Set();
        for(const incoming of r.messages??[]){
          const previous=messageMap.get(incoming.id);
          const merged=mergeStableAttachmentUrls(previous,incoming);
          if(!previous||messageRenderSignature(previous)!==messageRenderSignature(merged)){
            changedIds.add(String(incoming.id));
          }
          messageMap.set(incoming.id,merged);
        }
        hasMore=Boolean(r.has_more);
        initialUnreadAnchor=r.initial_unread_message_id??null;
        if(initial)renderMessages();else renderMessagesSelective(changedIds);

        if(initial&&initialUnreadAnchor){
          const anchor=messagesHost.querySelector(`[data-message-id="${CSS.escape(String(initialUnreadAnchor))}"]`);
          if(anchor)anchor.scrollIntoView({block:"start"});
          else messagesHost.scrollTop=0;
        }else if(initial&&unread>0){
          const anchorId=r.messages?.[0]?.id;
          const anchor=anchorId?messagesHost.querySelector(`[data-message-id="${CSS.escape(String(anchorId))}"]`):null;
          if(anchor)anchor.scrollIntoView({block:"start"});
          else messagesHost.scrollTop=0;
        }else if(forceScroll){
          messagesHost.scrollTop=messagesHost.scrollHeight;
        }

        if(notify)maybeNotify(r.messages??[],previous);
        notificationBaseline=newestMessage()?.id??notificationBaseline;
        gate.classList.add("hidden");
        app.classList.remove("hidden");
      placeChatSettingsInToolbar();
      loadChatAnnouncements();
      loadChatAnnouncements();
        renderRooms();
      }catch(e){
        if(e.status===401||e.status===403){await showAccessFailure(e);}else setStatus(text.loadFailed,true);
        throw e;
      }finally{
        if(requestGeneration===roomLoadGeneration)loading=false;
      }
    }

    async function loadOlder(){

      const requestRoomId=currentRoomId;
      const requestGeneration=roomLoadGeneration;
      const items=[...messageMap.values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      const earliest=items[0];
      if(!earliest)return;
      loadingOlder=true;
      olderButton.disabled=true;
      const oldHeight=messagesHost.scrollHeight;
      const oldTop=messagesHost.scrollTop;
      try{
        const r=await request(buildListUrl({limit:MESSAGE_BATCH_SIZE,before:earliest.created_at,roomId:requestRoomId}));
        if(requestGeneration!==roomLoadGeneration||requestRoomId!==currentRoomId)return;
        for(const m of r.messages??[])messageMap.set(m.id,m);
        hasMore=Boolean(r.has_more);

      }catch{

    async function navigateSearch(){
      const requestRoomId=currentRoomId;
      const requestGeneration=roomLoadGeneration;

      const nextSearch={
        q:searchText.value.trim(),
        date:searchDate.value
      };

      if(!requestRoomId||(!nextSearch.q&&!nextSearch.date))return;

      /*
        A new search term/date starts from the newest result again.
        Pressing Search repeatedly with the same text keeps the cursor and
        moves to the next older matching message.
      */
      const nextKey=
        `${requestRoomId}\n${nextSearch.q}\n${nextSearch.date}`;

      if(nextKey!==searchNavigationKey){
        searchNavigationKey=nextKey;
        searchBefore="";
      }

      currentSearch=nextSearch;

      try{
        const result=await request(buildSearchUrl());
        if(requestGeneration!==roomLoadGeneration||requestRoomId!==currentRoomId)return;

        const hit=result.search_match??result.messages?.[0]??null;

        /*
          No older match: stay where we are.
          A changed query automatically resets the cursor above.
        */
        if(!hit)return;

        if(currentSearch.q&&hit.created_at){
          searchBefore=hit.created_at;
        }

        const around=await request(
          buildListUrl({
            around:hit.id,
            limit:MESSAGE_BATCH_SIZE,
            roomId:requestRoomId
          })
        );

        if(requestGeneration!==roomLoadGeneration||requestRoomId!==currentRoomId)return;

        messageMap.clear();
        for(const m of around.messages??[])messageMap.set(m.id,m);
        hasMore=Boolean(around.has_more);
        renderMessages();

        requestAnimationFrame(()=>{
          const el=messagesHost.querySelector(
            `[data-message-id="${CSS.escape(String(hit.id))}"]`
          );
          el?.scrollIntoView({block:"center"});
          el?.classList.add("search-hit");
          setTimeout(()=>el?.classList.remove("search-hit"),1800);
        });
      }catch(e){
        setStatus(text.loadFailed,true);
      }
    }

          ? "로그인 정보가 틀렸습니다. 아이디와 비밀번호를 확인하세요."
          : language==="ja"

            : language==="ru"
              ? "Неверные данные для входа. Проверьте ID и пароль."
              : "Incorrect login information. Check your ID and password.";
      }

      if(
        code==="email_not_confirmed" ||
        /email not confirmed/i.test(message)
      ){
        return language==="ko"
          ? "계정 인증이 완료되지 않았습니다. 관리자에게 문의하세요."
          : language==="ja"
            ? "アカウント認証が完了していません。管理者にお問い合わせください。"
            : language==="ru"
              ? "Учётная запись не подтверждена. Обратитесь к администратору."
              : "The account is not confirmed. Contact the administrator.";
      }

      if(
        code==="user_banned" ||
        /banned/i.test(message)
      ){
        return language==="ko"
          ? "비활성화되었거나 이용이 정지된 계정입니다."
          : language==="ja"
            ? "無効化または停止されたアカウントです。"
            : language==="ru"
              ? "Учётная запись отключена или заблокирована."
              : "This account is disabled or suspended.";
      }

      return language==="ko"
        ? `로그인에 실패했습니다.${message?` (${message})`:""}`
        : language==="ja"
          ? `ログインに失敗しました。${message?` (${message})`:""}`
          : language==="ru"
            ? `Не удалось войти.${message?` (${message})`:""}`
            : `Login failed.${message?` (${message})`:""}`;

      setStatus(t.loggingOut);

      try{
        /*
          Chat can be entered through either:
          1) the custom Admin session, or
          2) a normal Supabase Auth Staff/Member session.

          Clear both so an old session of the other type cannot remain
          silently active after the visible account logs out.
        */
        if(globalThis.S967AdminAuth?.getToken?.()){
          try{
            await globalThis.S967AdminAuth.logout({
              url:ADMIN_LOGOUT_API
            });
          }catch(error){
            console.warn("Admin chat logout request failed:",error);
            globalThis.S967AdminAuth?.clearToken?.();
          }
        }

        try{
          await supabase.auth.signOut({
            scope:"local"
          });
        }catch(error){
          console.warn("Supabase chat logout failed:",error);
        }
      }finally{
        stopRealtime();

        /*
          Reload after clearing authentication so every room/message/member
          state is rebuilt from an unauthenticated page instead of leaving
          stale private data in the current DOM.
        */
        location.reload();
      }
    }


    async function doChatLogin(){
      const id=chatId.value.trim();
      const password=chatPassword.value;

      if(!password){
        gateMessage.textContent=loginFieldsRequiredMessage();
        return;
      }

      chatLoginButton.disabled=true;
      gateMessage.textContent=text.checking;

      try{
        /*
          Unified login form:
          - Empty ID + correct admin password => Lemon/admin session.
          - Any ID supplied => normal Staff/Member login.
          - Empty ID + wrong admin password => do not reveal that an admin
            password was tested; show only the normal ID/password prompt.
        */
        if(!id){
          try{
            await tryAdminLogin(password);
          }catch(error){
            console.warn("Admin login rejected from chat gate:",error?.code??error?.message??error);
            gateMessage.textContent=loginFieldsRequiredMessage();
            chatId.focus();
            return;
          }

          chatPassword.value="";
          gate.classList.add("hidden");
          await bootstrap();
          return;
        }

        /*
          New Chat-only accounts use chat-<id>@s967.org.
          Accounts converted from Staff to Chat-only intentionally keep
          their existing <id>@s967.org Supabase Auth email, so try that
          legacy/current-permission path only if the normal Chat login fails.
        */
        const normalized=id.toLowerCase();
        const candidates=[
          `chat-${normalized}@s967.org`,
          `${normalized}@s967.org`
        ];

        let lastError=null;
        let signedIn=false;

        for(const email of candidates){
          const {error}=await supabase.auth.signInWithPassword({
            email,
            password
          });

          if(!error){
            signedIn=true;
            break;
          }

          lastError=error;

          const code=String(error?.code??"");
          const message=String(error?.message??"");

          if(
            code!=="invalid_credentials" &&
            !/invalid login credentials/i.test(message)
          ){
            break;
          }
        }

        if(!signedIn){
          throw lastError??new Error("LOGIN_FAILED");
        }

        gate.classList.add("hidden");
        await bootstrap();
      }catch(error){
        console.error("Chat login failed:",error);
        gateMessage.textContent=chatLoginErrorMessage(error);
        chatPassword.focus();
        chatPassword.select();
      }finally{
        chatLoginButton.disabled=false;
      }
    }

    chatLoginButton.onclick=doChatLogin;
    chatPasskeyLoginButton.onclick=doChatPasskeyLogin;
    chatPassword.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doChatLogin();}});

    logoutButton.onclick=doChatLogout;

    passkeyButton.onclick=openPasskeyDialog;
    passkeyDialogVerify.onclick=verifyChatPasswordForPasskey;
    passkeyDialogRegister.onclick=registerChatPasskey;
    passkeyDialogClose.onclick=()=>{
      resetChatPasskeyRegistration();
      passkeyDialog.close();
    };
    passkeyDialogPassword.addEventListener("keydown",e=>{
      if(e.key==="Enter"&&!e.isComposing&&!passkeyDialogVerify.disabled){
        e.preventDefault();
        verifyChatPasswordForPasskey();
      }
    });
    createRoomButton.onclick=()=>{createRoomStatus.textContent="";createRoomStatus.classList.remove("error");newRoomName.value="";createRoomDialog.showModal();newRoomName.focus();};
    cancelCreateRoomButton.onclick=()=>createRoomDialog.close();
    confirmCreateRoomButton.onclick=createRoom;
    newRoomName.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();createRoom();}});
    roomMembersButton.onclick=openRoomMembers;
    nicknameButton.onclick=openNicknameDialog;
    cancelNicknameButton.onclick=()=>nicknameDialog.close();
    saveNicknameButton.onclick=saveNickname;
    nicknameInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();saveNickname();}});
    closeRoomMembersButton.onclick=()=>roomMembersDialog.close();
    leaveRoomButton.onclick=leaveCurrentRoom;
    deleteRoomButton.onclick=deleteCurrentRoom;
    backButton.addEventListener("click",event=>{event.preventDefault();if(history.length>1){history.back();}else{location.href="/";}});
    roomRefreshButton.onclick=()=>loadRooms().catch(()=>{});
    refreshButton.onclick=()=>loadLatest(false).then(loadRooms).catch(()=>{});
    notifyButton.onclick=async()=>{
      try{
        const enabled=await setupPushNotifications({askPermission:true});
        if(!enabled)setStatus(text.notificationDenied,true);
        else setStatus("");
      }catch(error){
        console.error("Push setup failed",error);
        setStatus(text.notificationDenied,true);
      }
    };
    function syncMobileSearchState(){
      if(!window.matchMedia("(max-width:760px)").matches){
        searchPanel.classList.remove("mobile-collapsed");
        searchToggleButton.setAttribute("aria-expanded","true");
        return;
      }
      const open=!searchPanel.classList.contains("mobile-collapsed");
      searchToggleButton.setAttribute("aria-expanded",String(open));
    }
    searchToggleButton.onclick=()=>{
      if(!window.matchMedia("(max-width:760px)").matches)return;
      searchPanel.classList.toggle("mobile-collapsed");
      syncMobileSearchState();
      if(!searchPanel.classList.contains("mobile-collapsed"))searchText.focus();
    };
    window.addEventListener("resize",syncMobileSearchState);
    syncMobileSearchState();

    searchButton.onclick=async()=>{
      if(window.matchMedia("(max-width:760px)").matches){
        const active=document.activeElement;
        if(active&&typeof active.blur==="function")active.blur();
      }
      await navigateSearch();
      if(window.matchMedia("(max-width:760px)").matches){
        searchPanel.classList.add("mobile-collapsed");
        syncMobileSearchState();
      }
    };
    clearSearchButton.onclick=async()=>{searchText.value="";searchDate.value="";currentSearch={q:"",date:""};searchNavigationKey="";searchBefore="";messageMap.clear();await loadLatest(false,false,{initial:true}).catch(()=>{});};
    searchText.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();searchButton.click();}});
    searchDate.onchange=()=>{
      if(searchDate.value)searchText.value="";
      searchButton.click();
    };
    searchText.addEventListener("input",()=>{
      if(searchText.value.trim())searchDate.value="";
    });
    olderButton.onclick=loadOlder;
    cancelReplyButton.onclick=()=>{replyTarget=null;renderReplyTarget();};
    fileButton.onclick=()=>fileInput.click();
    fileInput.onchange=()=>{const files=[...(fileInput.files??[])];if(files.length>MAX_FILES){setStatus(text.tooManyFiles,true);return;}if(files.some(f=>f.size>MAX_FILE_BYTES)){setStatus(text.fileTooLarge,true);return;}selectedFiles=files;setStatus("");renderFiles();};
    sendButton.onclick=sendMessage;
    messageInput.addEventListener("input",()=>{messageInput.style.height="auto";messageInput.style.height=`${Math.min(150,messageInput.scrollHeight)}px`;});
    messageInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}});
    messagesHost.addEventListener("scroll",()=>{
      if(messagesHost.scrollTop<80&&hasMore&&!loadingOlder)loadOlder();
      if(nearBottom())markRead();
    },{passive:true});
    window.addEventListener("s967languagechange",e=>{language=e.detail?.language??(typeof getCurrentLanguage==="function"?getCurrentLanguage():"en");text=TEXT[language]??TEXT.en;setText();});
    window.addEventListener("beforeunload",()=>{stopRealtime();});

    bootstrap().then(()=>{
      if(Notification.permission==="granted")setupPushNotifications().catch(error=>console.warn("Push startup sync failed",error));
    });
  </script>
</body>
</html>
