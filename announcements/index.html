<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>공지사항 관리 | S967</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <script src="/language.js" defer></script>
  <script src="/admin/admin-auth.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;font-family:system-ui,sans-serif}
    main{width:min(1080px,calc(100% - 28px));margin:26px auto 60px}
    h1,h2,h3{margin-top:0}
    .hidden{display:none!important}
    .panel{margin-top:14px;padding:15px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .lang-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    label{display:grid;gap:4px;color:var(--muted);font-size:.77rem}
    input,textarea,button,select{font:inherit;color:inherit}
    input,textarea,select{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover)}
    textarea{min-height:78px;resize:vertical;line-height:1.45}
    button,.btn{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);color:var(--text);text-decoration:none;cursor:pointer}
    .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .row .grow{flex:1}
    .status{min-height:1.2em;margin-top:7px;color:var(--muted);font-size:.76rem}
    .status.error{color:#c2410c}
    .cards{display:grid;gap:9px;margin-top:10px}
    .card{padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--surface-hover)}
    .card-head{display:flex;gap:7px;align-items:flex-start}
    .card-head strong{flex:1}
    .meta{color:var(--muted);font-size:.72rem;line-height:1.5}
    .texts{display:grid;gap:3px;margin-top:7px;font-size:.79rem}
    .gate{width:min(520px,calc(100% - 28px));margin:10vh auto;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
    .login{display:grid;gap:7px;margin-top:12px}
    .preset{border-style:dashed}
    code{font-size:.78em}
    @media(max-width:700px){.grid,.lang-grid{grid-template-columns:1fr}}

    /* Shared bottom-right Language + Theme controls */
    .top-pickers{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:1400;
      display:flex;
      align-items:flex-end;
      gap:8px;
    }
    .top-pickers .language-picker,
    .top-pickers .theme-picker{
      position:relative;
      inset:auto;
    }
    .top-pickers .language-menu,
    .top-pickers .theme-menu{
      top:auto;
      right:0;
      bottom:calc(100% + 8px);
    }
    @media(max-width:480px){
      .top-pickers{
        right:14px;
        bottom:14px;
      }
    }

  </style>
</head>

  <div class="top-pickers">
    <div class="language-picker" data-language-picker>
      <button
        class="language-button"
        type="button"
        data-language-button
        aria-label="Language"
        aria-haspopup="true"
        aria-expanded="false"
      >🌐</button>

      <div class="language-menu" data-language-menu role="menu">
        <button type="button" data-language-choice="ko" role="menuitemradio">한국어</button>
        <button type="button" data-language-choice="en" role="menuitemradio">English</button>
        <button type="button" data-language-choice="ja" role="menuitemradio">日本語</button>
        <button type="button" data-language-choice="ru" role="menuitemradio">Русский</button>
      </div>
    </div>

    <div class="theme-picker" data-theme-picker>
      <button
        class="theme-button"
        type="button"
        data-theme-button
        aria-label="Theme"
        aria-haspopup="true"
        aria-expanded="false"
      >◐</button>

      <div class="theme-menu" data-theme-menu role="menu">
        <button type="button" data-theme-choice="system" role="menuitemradio">

          <span data-i18n="themeSystem">System</span>

        <button type="button" data-theme-choice="light" role="menuitemradio">

          <span data-i18n="themeLight">Light</span>
        </button>
        <button type="button" data-theme-choice="dark" role="menuitemradio">
          <span class="theme-choice-icon">☾</span>
          <span data-i18n="themeDark">Dark</span>
        </button>
      </div>
    </div>

    </section>

    async function token(){
      const admin=S967AdminAuth?.getToken?.();
      if(admin)return admin;
      const {data}=await supabase.auth.getSession();
      return data.session?.access_token??null;
    }

    async function request(method="GET",body=null){
      const t=await token();
      if(!t)throw Object.assign(new Error(annText().loginNeeded),{status:401});
      const options={method,headers:{Authorization:`Bearer ${t}`}};
      if(body!==null){options.headers["Content-Type"]="application/json";options.body=JSON.stringify(body);}
      const response=await fetch(`${API}?manage=1`,options);
      const result=await response.json().catch(()=>({}));
      if(!response.ok)throw Object.assign(new Error(result.error||`HTTP_${response.status}`),{status:response.status});
      return result;
    }

        const title=document.createElement("strong");title.textContent=`${fmt(item.starts_at)} → ${fmt(item.ends_at)}`;
        const meta=document.createElement("span");meta.className="meta";meta.textContent=`${item.author_name} · ${displayRole(item.author_kind)}`;
        head.append(title,meta);card.append(head,textBlock(item));
        if(item.can_edit){const actions=document.createElement("div");actions.className="row";actions.style.marginTop="8px";const edit=document.createElement("button");edit.textContent=annText().edit;edit.onclick=()=>editAnnouncement(item);const del=document.createElement("button");del.textContent=annText().delete;del.onclick=()=>deleteAnnouncement(item);actions.append(edit,del);card.append(actions);}
        return card;
      }));

      routineList.replaceChildren(...(data.routines??[]).map(item=>{
        const card=document.createElement("div");card.className="card";
        const head=document.createElement("div");head.className="card-head";
        const title=document.createElement("strong");title.textContent=`${item.enabled?"●":"○"} ${item.name}`;
        const meta=document.createElement("span");meta.className="meta";meta.textContent=`${item.author_name} · ${displayRole(item.author_kind)}`;
        head.append(title,meta);
        const detail=document.createElement("div");detail.className="meta";detail.textContent=`${annText().firstStart} ${fmt(item.anchor_start)} · ${item.repeat_every_days} ${annText().everyDays} · ${item.active_hours} ${annText().activeHours} · ${annText().dateOffset.replace("{n}",item.event_offset_days)}`;
        card.append(head,detail,textBlock(item));
        if(item.can_edit){const actions=document.createElement("div");actions.className="row";actions.style.marginTop="8px";const edit=document.createElement("button");edit.textContent=annText().edit;edit.onclick=()=>editRoutine(item);const del=document.createElement("button");del.textContent=annText().delete;del.onclick=()=>deleteRoutine(item);actions.append(edit,del);card.append(actions);}
        return card;
      }));
    }

    async function load(){
      data=await request();
      render();
    }

    function clearAnnouncement(){aId.value="";aKo.value=aEn.value=aJa.value=aRu.value="";aStart.value=aEnd.value="";saveAnnouncement.textContent=annText().saveAnnouncement;cancelAnnouncementEdit.classList.add("hidden");}
    function editAnnouncement(item){aId.value=item.id;aKo.value=item.text_ko;aEn.value=item.text_en;aJa.value=item.text_ja;aRu.value=item.text_ru;aStart.value=localInputValue(item.starts_at);aEnd.value=localInputValue(item.ends_at);saveAnnouncement.textContent=annText().saveAnnouncementEdit;cancelAnnouncementEdit.classList.remove("hidden");scrollTo({top:0,behavior:"smooth"});}
    async function deleteAnnouncement(item){if(!confirm(annText().deleteAnnouncementConfirm))return;await request("POST",{action:"delete_announcement",id:item.id});await load();}

    saveAnnouncement.onclick=async()=>{saveAnnouncement.disabled=true;try{status(announcementStatus,annText().saving);const payload={action:aId.value?"update_announcement":"create_announcement",id:aId.value||undefined,text_ko:aKo.value,text_en:aEn.value,text_ja:aJa.value,text_ru:aRu.value,starts_at:isoFromLocal(aStart.value),ends_at:isoFromLocal(aEnd.value)};await request("POST",payload);clearAnnouncement();await load();status(announcementStatus,annText().saved);}catch(e){status(announcementStatus,e.message,true);}finally{saveAnnouncement.disabled=false;}};
    cancelAnnouncementEdit.onclick=clearAnnouncement;

    function clearRoutine(){rId.value="";rName.value="";rAnchor.value="";rRepeat.value="14";rHours.value="72";rOffset.value="3";rEnabled.value="true";rKo.value=rEn.value=rJa.value=rRu.value="";saveRoutine.textContent=annText().saveRoutine;cancelRoutineEdit.classList.add("hidden");}
    function editRoutine(item){rId.value=item.id;rName.value=item.name;rAnchor.value=localInputValue(item.anchor_start);rRepeat.value=item.repeat_every_days;rHours.value=item.active_hours;rOffset.value=item.event_offset_days;rEnabled.value=String(item.enabled);rKo.value=item.text_ko;rEn.value=item.text_en;rJa.value=item.text_ja;rRu.value=item.text_ru;saveRoutine.textContent=annText().saveRoutineEdit;cancelRoutineEdit.classList.remove("hidden");}
    async function deleteRoutine(item){if(!confirm(annText().deleteRoutineConfirm))return;await request("POST",{action:"delete_routine",id:item.id});await load();}

    wkPreset.onclick=()=>{rName.value="황무지 모집";rRepeat.value="14";rHours.value="72";rOffset.value="3";rKo.value="현재 {date} 황무지 모집 기간입니다.";rEn.value="Recruitment is now open for the {date} Wasteland event.";rJa.value="現在、{date}の荒野イベントの募集期間です。";rRu.value="Сейчас идёт набор на событие «Пустошь» {date}.";status(routineStatus,annText().presetNote);};
    periodPreset.onclick=()=>{rName.value="기간 안내";rRepeat.value="7";rHours.value="24";rOffset.value="0";rKo.value="{start}~{end} 안내 기간입니다.";rEn.value="The notice period is {start}–{end}.";rJa.value="{start}～{end}は案内期間です。";rRu.value="Период объявления: {start}–{end}.";};

    saveRoutine.onclick=async()=>{saveRoutine.disabled=true;try{status(routineStatus,annText().saving);const payload={action:rId.value?"update_routine":"create_routine",id:rId.value||undefined,name:rName.value,anchor_start:isoFromLocal(rAnchor.value),repeat_every_days:Number(rRepeat.value),active_hours:Number(rHours.value),event_offset_days:Number(rOffset.value),enabled:rEnabled.value==="true",text_ko:rKo.value,text_en:rEn.value,text_ja:rJa.value,text_ru:rRu.value};await request("POST",payload);clearRoutine();await load();status(routineStatus,annText().saved);}catch(e){status(routineStatus,e.message,true);}finally{saveRoutine.disabled=false;}};
    cancelRoutineEdit.onclick=clearRoutine;

    async function staffSignIn(){
      const id=staffId.value.trim();
      const password=staffPassword.value;
      if(!id||!password)return;
      staffLoginButton.disabled=true;
      try{
        const {error}=await supabase.auth.signInWithPassword({email:`${id.toLowerCase()}@s967.org`,password});
        if(error)throw error;
        gate.classList.add("hidden");app.classList.remove("hidden");await load();applyAnnouncementLanguage();
      }catch{gateMessage.textContent=annText().staffLoginFailed;}
      finally{staffLoginButton.disabled=false;}
    }
    staffLoginButton.onclick=staffSignIn;
    staffPassword.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();staffSignIn();}});


    window.addEventListener("s967languagechange",(event)=>{
      annLanguage =
        event.detail?.language ??
        (typeof getCurrentLanguage === "function"
          ? getCurrentLanguage()
          : (localStorage.getItem("s967_language") || "en"));
      applyAnnouncementLanguage();
    });

    /*
      When this page is inside the Staff page iframe, changing the parent
      page language writes the same localStorage key. The storage event
      reaches this iframe, so keep the inner page synchronized too.
    */
    window.addEventListener("storage",(event)=>{
      if(event.key==="s967_language" && event.newValue){
        annLanguage=event.newValue;
        applyAnnouncementLanguage();
      }
    });

    applyAnnouncementLanguage();

    (async()=>{
      try{
        const t=await token();
        if(!t){gateMessage.textContent=annText().loginRequired;return;}
        await load();
        applyAnnouncementLanguage();
        gate.classList.add("hidden");
        app.classList.remove("hidden");
      }catch(e){
        gateMessage.textContent=e.status===403?annText().permissionDenied:annText().loginRequired;
      }
    })();
  </script>
</body>
</html>
