<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="robots" content="noindex, nofollow">
  <title>Image Gallery · S967</title>

  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 36px 20px 60px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: min(1050px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 620px;
      margin: 20px auto 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .notice {
      max-width: 620px;
      margin: 24px auto 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .toolbar {
      margin: 28px 0 18px;
      display: flex;
      justify-content: flex-end;
    }

    .refresh {
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .refresh:hover {
      background: var(--surface-hover);
    }

    .status {
      padding: 50px 0;
      color: var(--muted);
    }

    .gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      text-align: left;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .image-link {
      display: block;
      aspect-ratio: 1;
      background: var(--surface);
    }

    .image-link img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .meta {
      padding: 10px 12px 12px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .back {
      display: inline-block;
      margin-top: 34px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .gallery {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .meta {
        padding: 8px 9px 10px;
        font-size: 0.73rem;
      }
    }
  </style>
</head>

<body>
  <div class="theme-picker" data-theme-picker>
    <button
      class="theme-button"
      type="button"
      data-theme-button
      aria-label="Theme"
      aria-haspopup="true"
      aria-expanded="false"
    >◐</button>

    <div
      class="theme-menu"
      data-theme-menu
      role="menu"
    >
      <button
        type="button"
        data-theme-choice="system"
        role="menuitemradio"
      >
        <span class="theme-choice-icon">◐</span>
        <span>System</span>
      </button>

      <button
        type="button"
        data-theme-choice="light"
        role="menuitemradio"
      >
        <span class="theme-choice-icon">☀</span>
        <span>Light</span>
      </button>

      <button
        type="button"
        data-theme-choice="dark"
        role="menuitemradio"
      >
        <span class="theme-choice-icon">☾</span>
        <span>Dark</span>
      </button>
    </div>
  </div>

  <main>
    <div class="eyebrow">S967</div>
    <h1>Image Gallery</h1>

    <p class="lead">
      Images uploaded by the community.
    </p>

    <div class="toolbar">
      <button
        id="refreshButton"
        class="refresh"
        type="button"
      >
        Refresh
      </button>
    </div>

    <div
      id="status"
      class="status"
    >
      Loading images…
    </div>

    <div
      id="gallery"
      class="gallery hidden"
    ></div>

    <a
      class="back"
      href="/"
    >
      ← Back to Home
    </a>
  </main>

  <script>
    // Paste the deployed list-gallery Function URL here.
    const GALLERY_FUNCTION_URL =
      "https://dpmjwsnqkuzetyvfcmfr.supabase.co/functions/v1/smooth-service";

    const gallery =
      document.getElementById("gallery");

    const status =
      document.getElementById("status");

    const refreshButton =
      document.getElementById("refreshButton");

    function formatDate(value) {
      try {
        return new Intl.DateTimeFormat(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          }
        ).format(
          new Date(value)
        );
      } catch {
        return "";
      }
    }

    function createCard(
      image,
      createdAt
    ) {
      const card =
        document.createElement("article");

      card.className =
        "card";

      const link =
        document.createElement("a");

      link.className =
        "image-link";

      link.href =
        image.url;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      const img =
        document.createElement("img");

      img.src =
        image.url;

      img.alt =
        "Community upload";

      img.loading =
        "lazy";

      img.addEventListener(
        "error",
        () => {
          card.remove();
        }
      );

      link.appendChild(img);

      const meta =
        document.createElement("div");

      meta.className =
        "meta";

      meta.textContent =
        formatDate(createdAt);

      card.appendChild(link);
      card.appendChild(meta);

      return card;
    }

    async function loadGallery() {
      refreshButton.disabled =
        true;

      status.classList.remove(
        "hidden"
      );

      gallery.classList.add(
        "hidden"
      );

      status.textContent =
        "Loading images…";

      gallery.innerHTML =
        "";

      try {
        const response =
          await fetch(
            GALLERY_FUNCTION_URL,
            {
              method: "GET",
              cache: "no-store",
            }
          );

        const result =
          await response
            .json()
            .catch(() => ({}));

        if (
          !response.ok ||
          !result.success
        ) {
          throw new Error(
            result.error ||
            "Could not load gallery."
          );
        }

        let count = 0;

        for (
          const event
          of result.events || []
        ) {
          for (
            const image
            of event.images || []
          ) {
            gallery.appendChild(
              createCard(
                image,
                event.createdAt
              )
            );

            count++;
          }
        }

        if (count === 0) {
          status.textContent =
            "No images have been uploaded yet.";

          return;
        }

        status.classList.add(
          "hidden"
        );

        gallery.classList.remove(
          "hidden"
        );
      } catch (error) {
        status.textContent =
          error.message ||
          "Could not load gallery.";
      } finally {
        refreshButton.disabled =
          false;
      }
    }

    refreshButton.addEventListener(
      "click",
      loadGallery
    );

    loadGallery();
  </script>
</body>
</html>
