<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="description"
    content="S967 — Different Languages. One Server."
  >

  <title>S967</title>

  <link
    rel="stylesheet"
    href="/theme.css"
  >

  <script
    src="/theme.js"
    defer
  ></script>

  <script
    src="/language.js"
    defer
  ></script>

  <style>
    .staff-link {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1100;

  width: 40px;
  height: 40px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid var(--border);
  border-radius: 10px;

  background: var(--surface-hover);
  color: var(--text);

  text-decoration: none;
  font-size: 1rem;

  cursor: pointer;
}

.staff-link:hover {
  border-color: var(--border-hover);
}

@media (max-width: 480px) {
  .staff-link {
    top: 14px;
    left: 14px;
  }
}
    
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 32px 20px;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255,255,255,.08),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #111318 0%,
          #171a21 50%,
          #0e1014 100%
        );

      color: #f3f4f6;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: min(680px, 100%);
      text-align: center;
    }

    .server {
      margin: 0;

      font-size:
        clamp(
          4.5rem,
          17vw,
          8rem
        );

      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 800;
    }

    .headline {
      margin: 28px 0 0;

      font-size:
        clamp(
          1.35rem,
          4.5vw,
          2rem
        );

      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .tagline {
      margin: 12px 0 0;

      font-size:
        clamp(
          .95rem,
          3.2vw,
          1.12rem
        );

      color: #aeb4bf;
      letter-spacing: .01em;
    }

    .buttons {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 180px)
        );

      justify-content: center;

      gap:
        clamp(
          10px,
          2vw,
          18px
        );

      margin-top: 44px;
    }

    .button {
      min-width: 180px;

      padding: 15px 24px;

      border:
        1px solid
        rgba(255,255,255,.18);

      border-radius: 12px;

      color: #f7f7f8;

      background:
        rgba(255,255,255,.07);

      text-decoration: none;

      font-size: 1rem;
      font-weight: 650;

      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease;

      backdrop-filter:
        blur(10px);
    }

    .button:hover {
      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(255,255,255,.32);
    }

    .button:active {
      transform:
        translateY(0);
    }

    .group-buy-button {
      grid-column: 1 / -1;
      justify-self: center;
    }

    footer {
      margin-top: 54px;

      color: #626875;

      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .source-link {
      display: inline-block;

      margin-top: 8px;

      color: #555c68;

      font-size: .72rem;
      letter-spacing: .03em;
      text-transform: none;
      text-decoration: none;
    }

    .source-link:hover {
      color: #8c939f;
      text-decoration: underline;
    }


    /*
      Language + Theme
      오른쪽 아래 공통 컨트롤
    */

    .top-pickers {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 1100;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .top-pickers
    .language-picker,
    .top-pickers
    .theme-picker {
      position: relative;

      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
    }

    .top-pickers
    .language-menu,
    .top-pickers
    .theme-menu {
      top: auto;
      bottom: calc(100% + 8px);
      right: 0;
    }


    @media (
      max-width: 480px
    ) {
      .buttons {
        grid-template-columns:
          1fr;
      }

      .group-buy-button {
        grid-column: auto;
        justify-self: stretch;
      }

      .button {
        width: 100%;
        min-width: 0;
      }

      .top-pickers {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>


<body>

  <a
  class="staff-link"
  href="/staff"
  aria-label="Staff"
  title="Staff"
>
  🛠️
</a>

  <div class="top-pickers">

    <div
      class="language-picker"
      data-language-picker
    >
      <button
        class="language-button"
        type="button"
        data-language-button
        aria-label="Language"
        aria-haspopup="true"
        aria-expanded="false"
      >
        🌐
      </button>

      <div
        class="language-menu"
        data-language-menu
        role="menu"
      >
        <button
          type="button"
          data-language-choice="ko"
          role="menuitemradio"
        >
          한국어
        </button>

        <button
          type="button"
          data-language-choice="en"
          role="menuitemradio"
        >
          English
        </button>

        <button
          type="button"
          data-language-choice="ja"
          role="menuitemradio"
        >
          日本語
        </button>

        <button
          type="button"
          data-language-choice="ru"
          role="menuitemradio"
        >
          Русский
        </button>
      </div>
    </div>


    <div
      class="theme-picker"
      data-theme-picker
    >
      <button
        class="theme-button"
        type="button"
        data-theme-button
        aria-label="Theme"
        aria-haspopup="true"
        aria-expanded="false"
      >
        ◐
      </button>

      <div
        class="theme-menu"
        data-theme-menu
        role="menu"
      >
        <button
          type="button"
          data-theme-choice="system"
          role="menuitemradio"
        >
          <span
            class="theme-choice-icon"
          >
            ◐
          </span>

          <span
            data-i18n="themeSystem"
          >
            System
          </span>
        </button>

        <button
          type="button"
          data-theme-choice="light"
          role="menuitemradio"
        >
          <span
            class="theme-choice-icon"
          >
            ☀
          </span>

          <span
            data-i18n="themeLight"
          >
            Light
          </span>
        </button>

        <button
          type="button"
          data-theme-choice="dark"
          role="menuitemradio"
        >
          <span
            class="theme-choice-icon"
          >
            ☾
          </span>

          <span
            data-i18n="themeDark"
          >
            Dark
          </span>
        </button>
      </div>
    </div>

  </div>


  <main>

    <h1 class="server">
      S967
    </h1>

    <p
      class="headline"
      data-i18n="headline"
    >
      Different Languages. One Server.
    </p>

    <p
      class="tagline"
      data-i18n="tagline"
    >
      Peaceful, open, and connected.
    </p>


    <nav
      class="buttons"
      aria-label="S967 links"
    >
      <a
        class="button"
        href="/inquiry"
        data-i18n="inquiry"
      >
        Inquiry
      </a>

      <a
        class="button"
        href="/wk"
        data-i18n="wkApplication"
      >
        WK Application
      </a>

      <a
        class="button"
        href="/upload"
        data-i18n="imageUpload"
      >
        Image Upload
      </a>

      <a
        class="button"
        href="/gallery"
        data-i18n="viewImages"
      >
        View Images
      </a>

      <a
        class="button group-buy-button"
        href="/groupBuy"
        data-i18n="groupBuyApplication"
      >
        Group Buy Application
      </a>
    </nav>


    <footer>
      PNS · State 967
      <br>

      <span
        class="unofficial"
        data-i18n="unofficial"
      >
        Unofficial community site for State 967.
      </span>
      
      <br>
        Operated by ᴬᶜᴱ⍣⃝ 레몬
      <br>
      <a
        class="source-link"
        href="https://github.com/lemon967ace/S967site"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="sourceCode"
      >
        View source code
      </a>
    </footer>

  </main>

</body>
</html>
